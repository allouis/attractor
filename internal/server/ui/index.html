<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>attractor</title>
<script data-theme-preload>
  // Apply the persisted theme before first paint to avoid a flash of the
  // wrong palette. Absent a stored choice, the CSS media query drives it.
  (function () {
    try {
      const t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* localStorage may be unavailable; fall back to OS pref */ }
  })();
</script>
<style>
  /* Design tokens (web-ui-spec W1). Every view consumes tokens only — no
     ad-hoc colours/sizes. Light is the base :root; dark values arrive via
     the data-theme override (manual toggle) and prefers-color-scheme. */
  :root {
    /* surface + text ramp */
    --surface-0: #ffffff;   /* page background */
    --surface-1: #f6f8fa;   /* raised panels */
    --surface-2: #eaeef2;   /* inset / hover */
    --text: #1f2328;
    --text-muted: #656d76;
    --border: #d0d7de;
    --accent: #0969da;
    /* spacing scale */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    /* type scale */
    --font-sm: 12px;
    --font-base: 14px;
    --font-lg: 18px;
    /* semantic state palette — the load-bearing colour decision.
       needs-human is deliberately the highest-attention hue. */
    --state-queued: #64748b;
    --state-running: #2563eb;
    --state-success: #16a34a;
    --state-failed: #dc2626;
    --state-needs-human: #d97706;
    --state-retrying: #ea580c;
    --state-cancelled: #94a3b8;
  }
  /* Dark tokens. Duplicated across an explicit override and the media
     query so a manual choice always wins over the OS preference:
       no data-theme        -> follow prefers-color-scheme
       data-theme="dark"     -> dark regardless of OS
       data-theme="light"    -> stay on the light :root base */
  :root[data-theme="dark"] {
    --surface-0: #0d1117;
    --surface-1: #161b22;
    --surface-2: #21262d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --border: #30363d;
    --accent: #4493f8;
    --state-queued: #94a3b8;
    --state-running: #60a5fa;
    --state-success: #4ade80;
    --state-failed: #f87171;
    --state-needs-human: #fbbf24;
    --state-retrying: #fb923c;
    --state-cancelled: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface-0: #0d1117;
      --surface-1: #161b22;
      --surface-2: #21262d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --border: #30363d;
      --accent: #4493f8;
      --state-queued: #94a3b8;
      --state-running: #60a5fa;
      --state-success: #4ade80;
      --state-failed: #f87171;
      --state-needs-human: #fbbf24;
      --state-retrying: #fb923c;
      --state-cancelled: #64748b;
    }
  }
  * { box-sizing: border-box; }
  body { font: var(--font-base)/1.5 system-ui, sans-serif; margin: 0; color: var(--text); background: var(--surface-0); }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); font-weight: 600; }
  header a { color: inherit; text-decoration: none; }
  header .brand { margin-right: var(--space-5); }
  nav { display: flex; gap: var(--space-4); flex: 1; font-weight: 400; }
  nav a { color: var(--text-muted); padding: var(--space-1) 0; border-bottom: 2px solid transparent; }
  nav a.active { color: var(--text); border-bottom-color: var(--accent); }
  #theme-toggle { font-weight: 400; }
  main { padding: var(--space-3) var(--space-4); }
  /* One view visible at a time; the router shows the routed section. */
  main > section { display: none; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; }
  a { color: var(--accent); }
  .status { font-weight: 600; text-transform: capitalize; }
  .status.completed { color: var(--state-success); }
  .status.failed { color: var(--state-failed); }
  .status.cancelled { color: var(--state-cancelled); }
  .status.running { color: var(--state-running); }
  .status.retrying { color: var(--state-retrying); }
  .status.queued { color: var(--state-queued); }
  /* Items filter/group toolbar. Controls consume tokens; they wrap on
     narrow viewports rather than overflow. */
  .toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center;
             margin-bottom: var(--space-3); }
  .toolbar select, .toolbar input { font: inherit; padding: var(--space-1) var(--space-2);
             color: var(--text); background: var(--surface-1);
             border: 1px solid var(--border); border-radius: 6px; }
  .toolbar .check { display: inline-flex; align-items: center; gap: var(--space-1);
             color: var(--text-muted); }
  .group-head { margin: var(--space-4) 0 var(--space-1); color: var(--text-muted); font-size: var(--font-sm);
             text-transform: uppercase; letter-spacing: .04em; }
  .group-head:first-child { margin-top: 0; }
  /* Warning banner: a partial-source outage must be visible, not silent. */
  .banner { padding: var(--space-2) var(--space-3); border-radius: 6px; margin-bottom: var(--space-3);
            border: 1px solid var(--border); background: var(--surface-1); }
  .banner.error { color: var(--state-failed); border-color: var(--state-failed); }
  /* Item badges: a linked-run pill (status-tinted, links to #run/<id>) and
     the deliberately loud in-progress chip. */
  .badge { display: inline-block; font-size: var(--font-sm); font-weight: 600;
           padding: 0 var(--space-2); border-radius: 999px; border: 1px solid var(--border);
           text-decoration: none; margin-right: var(--space-1); }
  .badge.in-progress { color: var(--state-running); border-color: var(--state-running); }
  .layout { display: grid; grid-template-columns: 1fr 360px; gap: var(--space-4); align-items: start; }
  #graph svg { max-width: 100%; height: auto; }
  #graph g.node { cursor: pointer; }
  #node-pane { border: 1px solid var(--border); border-radius: 6px; padding: var(--space-3);
               min-height: 120px; background: var(--surface-1); }
  #node-pane h3 { margin: 0 0 var(--space-2); }
  #node-links a { margin-right: var(--space-3); }
  #node-log { white-space: pre-wrap; font: var(--font-sm)/1.45 ui-monospace, monospace;
              margin-top: var(--space-2); max-height: 320px; overflow: auto; }
  .tool { color: var(--text-muted); }
  #human-dock { margin-top: var(--space-4); }
  #human-dock .q { border: 1px solid var(--state-needs-human); border-radius: 6px;
                   padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2); }
  .pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .muted { color: var(--text-muted); }
  button { font: inherit; padding: var(--space-1) var(--space-3); cursor: pointer;
           background: var(--surface-1); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
  button:hover { background: var(--surface-2); }
  /* Run-action picker: a token-styled modal over the Items view. */
  #run-picker { color: var(--text); background: var(--surface-0);
                border: 1px solid var(--border); border-radius: 8px;
                padding: var(--space-4); min-width: 320px; }
  #run-picker::backdrop { background: rgba(0, 0, 0, .4); }
  #run-picker h3 { margin: 0 0 var(--space-3); }
  #run-picker label { display: block; margin-bottom: var(--space-3); color: var(--text-muted); }
  #run-picker select, #run-picker input { font: inherit; width: 100%; margin-top: var(--space-1);
                color: var(--text); background: var(--surface-1);
                border: 1px solid var(--border); border-radius: 6px; padding: var(--space-1) var(--space-2); }
  .picker-actions { display: flex; justify-content: flex-end; gap: var(--space-2); }
</style>
</head>
<body>
<header>
  <a class="brand" href="#items">attractor</a>
  <nav>
    <a id="nav-items" href="#items">Items</a>
    <a id="nav-runs" href="#runs">Runs</a>
    <a id="nav-workflows" href="#workflows">Workflows</a>
  </nav>
  <button id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark" aria-label="Toggle theme">&#9790;</button>
</header>
<main>
  <section id="items-view">
    <div id="items-toolbar" class="toolbar">
      <select id="items-filter-source" title="source"><option value="">all sources</option></select>
      <select id="items-filter-type" title="type"><option value="">all types</option></select>
      <select id="items-filter-repo" title="repo"><option value="">all repos</option></select>
      <input id="items-filter-text" type="search" placeholder="filter title…">
      <label class="check"><input id="items-filter-progress" type="checkbox"> in progress</label>
      <select id="items-group" title="group by">
        <option value="">no grouping</option>
        <option value="repo">group by repo</option>
        <option value="source">group by source</option>
      </select>
    </div>
    <div id="items-warning" role="alert"></div>
    <div id="items-list"></div>
    <dialog id="run-picker">
      <h3>run item</h3>
      <label>workflow <select id="run-picker-workflow"></select></label>
      <label>repo <input id="run-picker-repo" list="run-picker-repos" placeholder="owner/name"></label>
      <datalist id="run-picker-repos"></datalist>
      <p id="run-picker-error" class="banner error" hidden></p>
      <div class="picker-actions">
        <button type="button" id="run-picker-cancel">cancel</button>
        <button type="button" id="run-picker-run">run</button>
      </div>
    </dialog>
  </section>
  <section id="runs-view">
    <section id="run-list"></section>
  </section>
  <section id="workflows-view"><p class="muted">No workflows yet.</p></section>
  <section id="run-view">
    <p><a href="#runs">&larr; all runs</a></p>
    <h2 id="run-title"></h2>
    <div class="layout">
      <div id="graph"></div>
      <div>
        <div id="node-pane"><p class="muted">Click a node to inspect it.</p></div>
        <div id="human-dock"></div>
      </div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let es = null;                 // active EventSource
let currentRun = null;         // run id being viewed
let selectedNode = null;       // node id in the pane
const nodeLog = {};            // node id -> accumulated log html chunks
const nodeState = {};          // node id -> status class
let dockTimer = null;

// ---- theme -------------------------------------------------------------
// currentTheme resolves the effective palette: an explicit manual choice
// (data-theme) wins, else the OS preference.
function currentTheme() {
  const set = document.documentElement.getAttribute('data-theme');
  if (set) return set;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

// syncToggle points the toggle glyph at the palette it switches *to*.
function syncToggle() {
  const btn = $('theme-toggle');
  if (btn) btn.innerHTML = currentTheme() === 'dark' ? '&#9728;' : '&#9790;';
}

function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', next); } catch (e) { /* best-effort */ }
  document.documentElement.setAttribute('data-theme', next);
  syncToggle();
}

// showView switches the single visible top-level section by id.
function showView(name) {
  for (const sec of document.querySelectorAll('main > section')) {
    sec.style.display = sec.id === name ? 'block' : 'none';
  }
}

// ---- routing -----------------------------------------------------------
// teardownRun stops the run-detail stream + dock poll when leaving a run.
function teardownRun() {
  if (es) { es.close(); es = null; }
  if (dockTimer) { clearInterval(dockTimer); dockTimer = null; }
  currentRun = null;
}

// route dispatches on the URL hash. All navigation flows through the hash
// (nav tabs, run rows, back links), so one hashchange listener drives
// every view switch. Default landing is Items.
function route() {
  const m = location.hash.match(/^#run\/(.+)$/);
  if (m) { openRun(m[1]); return; }
  teardownRun();
  const tab = location.hash.replace(/^#/, '') || 'items';
  if (tab === 'runs') { highlightNav('runs'); showView('runs-view'); renderList(); return; }
  if (tab === 'workflows') { highlightNav('workflows'); showView('workflows-view'); return; }
  highlightNav('items'); showView('items-view'); showItems();
}

// highlightNav marks the active tab; run detail counts as the Runs tab.
function highlightNav(tab) {
  const active = { items: 'nav-items', runs: 'nav-runs', workflows: 'nav-workflows' }[tab];
  for (const id of ['nav-items', 'nav-runs', 'nav-workflows']) {
    const el = $(id); if (el) el.classList.toggle('active', id === active);
  }
}

// ---- items view --------------------------------------------------------
// The candidate set is what each source returns for "assigned to me". The
// GET /items endpoint is single-source, so the view discovers the daemon's
// sources (GET /items/sources — never a hardcoded list, which would drift
// from config) and fetches each, merging client-side (web-ui-spec §Items
// view). itemsCache holds the merged set; renderItems draws from it so
// filters re-render without refetching.
let itemsCache = [];
let itemsRendered = false; // suppresses the loading flash on a background refresh
let itemsGen = 0;          // request generation; only the latest fetch renders

// showItems renders the Items view and refreshes it on every entry, so live
// status badges and newly-assigned items stay current (a stale, never-
// refreshing list defeats the view's purpose). The first entry shows a
// loading placeholder; a re-entry refetches in the background — keeping the
// current rows and the user's filter selections visible until fresh data
// lands. itemsGen guards out-of-order fetches: only the latest render wins.
function showItems() {
  fetchItems();
}

async function fetchItems() {
  const gen = ++itemsGen;
  const listEl = $('items-list');
  if (!itemsRendered) listEl.innerHTML = '<p class="muted">loading…</p>';
  let sources;
  try {
    const r = await fetch('/items/sources');
    if (!r.ok) throw new Error('status ' + r.status);
    sources = (await r.json()).sources || [];
  } catch (e) {
    if (gen !== itemsGen) return;   // superseded by a newer fetch
    // A refresh failure keeps the last-known list rather than wiping it; a
    // first-load failure has nothing to keep, so it shows the error inline.
    if (itemsRendered) {
      setItemsWarning('could not refresh items — showing the last-loaded set');
    } else {
      itemsCache = [];
      renderSourceWarning([]);
      listEl.innerHTML = '<p class="banner error">could not reach the daemon to load item sources</p>';
    }
    return;
  }
  // Fetch each source independently and record which failed, so a partial
  // outage (a source 500ing/rate-limited) is surfaced rather than silently
  // dropping assigned work — the one failure a triage view must not have
  // (review B1).
  const failed = [];
  const per = await Promise.all(sources.map(async (s) => {
    try {
      const r = await fetch(`/items?source=${encodeURIComponent(s)}&filter=assigned`);
      if (!r.ok) { failed.push(s); return []; }
      return (await r.json()).items || [];
    } catch (e) { failed.push(s); return []; }
  }));
  if (gen !== itemsGen) return;     // a newer fetch superseded this one
  itemsCache = per.flat();
  itemsRendered = true;
  renderSourceWarning(failed);
  populateItemFilters();
  renderItems();
}

// setItemsWarning shows an error banner above the list, or clears it when
// text is empty.
function setItemsWarning(text) {
  const el = $('items-warning');
  if (!el) return;
  el.textContent = text || '';
  el.className = text ? 'banner error' : '';
}

// renderSourceWarning surfaces sources that failed to load, naming them so
// the user reads the list as incomplete rather than as "nothing assigned".
// An empty list clears the banner.
function renderSourceWarning(failed) {
  setItemsWarning(failed.length
    ? `could not load: ${failed.join(', ')} — showing the remaining sources only`
    : '');
}

// itemRepo / itemSource / itemType read the fields the filters key on.
const itemRepo = (it) => (it.vars && it.vars.repo) || '';
const itemSource = (it) => (it.ref && it.ref.source) || '';
const itemType = (it) => (it.ref && it.ref.type) || '';

// populateItemFilters fills the source/type/repo selects with the distinct
// values present in the merged set, preserving the current selection.
function populateItemFilters() {
  fillOptions('items-filter-source', distinct(itemsCache.map(itemSource)));
  fillOptions('items-filter-type', distinct(itemsCache.map(itemType)));
  fillOptions('items-filter-repo', distinct(itemsCache.map(itemRepo)));
}

function distinct(values) {
  return [...new Set(values.filter(Boolean))].sort();
}

// fillOptions rebuilds a select's options below its first (all/none) option,
// keeping the current choice selected when it still exists.
function fillOptions(id, values) {
  const sel = $(id);
  if (!sel) return;
  const prev = sel.value;
  while (sel.options.length > 1) sel.remove(1);
  for (const v of values) {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  }
  sel.value = values.includes(prev) ? prev : '';
}

// applyFilters narrows the merged set by the toolbar controls (v1 narrows
// only; broadening the candidate set is v2 backend work — web-ui-spec
// §Items view).
function applyFilters(list) {
  const source = $('items-filter-source').value;
  const type = $('items-filter-type').value;
  const repo = $('items-filter-repo').value;
  const text = $('items-filter-text').value.trim().toLowerCase();
  const progressOnly = $('items-filter-progress').checked;
  return list.filter(it =>
    (!source || itemSource(it) === source) &&
    (!type || itemType(it) === type) &&
    (!repo || itemRepo(it) === repo) &&
    (!text || (it.title || '').toLowerCase().includes(text)) &&
    (!progressOnly || it.in_progress));
}

function renderItems() {
  const list = applyFilters(itemsCache);
  if (!list.length) { $('items-list').innerHTML = '<p class="muted">no items</p>'; return; }
  const groupBy = $('items-group').value;
  const key = { repo: itemRepo, source: itemSource }[groupBy];
  if (!key) { $('items-list').innerHTML = itemsTable(list); return; }
  const groups = new Map();
  for (const it of list) {
    const g = key(it) || '(none)';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(it);
  }
  $('items-list').innerHTML = [...groups.keys()].sort().map(g =>
    `<div class="group-head">${escapeHtml(g)}</div>${itemsTable(groups.get(g))}`).join('');
}

// itemsTable renders one table of item rows.
function itemsTable(list) {
  const rows = list.map(itemRowHtml).join('');
  return `<table>
    <thead><tr><th>title</th><th>source</th><th>type</th><th>repo</th><th>runs</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

// itemRowHtml builds one item row. Every field originates from an external
// source, so all are escaped for the HTML context; the title URL is also
// scheme-checked for the URL context (escapeHtml alone does not neutralise a
// javascript: href) and opened with rel=noopener noreferrer.
function itemRowHtml(it) {
  return `
    <tr>
      <td><a href="${escapeHtml(safeUrl(it.url || ''))}" target="_blank" rel="noopener noreferrer">${escapeHtml(it.title || '')}</a></td>
      <td class="muted">${escapeHtml(itemSource(it))}</td>
      <td class="muted">${escapeHtml(itemType(it))}</td>
      <td class="muted">${escapeHtml(itemRepo(it))}</td>
      <td>${itemBadges(it)}</td>
      <td>${itemRunButton(it)}</td>
    </tr>`;
}

// itemRunButton renders the per-row run trigger. The item ref + repo ride
// on data-* attributes (escaped) rather than an inline onclick, matching
// the page's no-inline-JS convention; a delegated click on #items-list
// opens the picker (web-ui-spec §Items view run action).
function itemRunButton(it) {
  const ref = it.ref || {};
  return `<button data-run` +
    ` data-run-source="${escapeHtml(ref.source || '')}"` +
    ` data-run-type="${escapeHtml(ref.type || '')}"` +
    ` data-run-id="${escapeHtml(ref.external_id || '')}"` +
    ` data-run-repo="${escapeHtml(itemRepo(it))}">run</button>`;
}

// safeUrl returns url only when it resolves to an http(s) scheme; a
// javascript:/data: URL (or anything unparseable) becomes '#', so an
// external item's URL cannot smuggle a script into the app origin (S1).
function safeUrl(url) {
  try {
    const proto = new URL(url, location.origin).protocol;
    return (proto === 'http:' || proto === 'https:') ? url : '#';
  } catch (e) { return '#'; }
}

// itemBadges renders the item's run annotation (web-ui-spec §Items view):
// a loud in-progress chip when a linked run is queued/running, then one
// status-tinted pill per linked run linking to #run/<id>.
function itemBadges(it) {
  const chip = it.in_progress ? '<span class="badge in-progress">in progress</span>' : '';
  const runs = (it.linked_runs || []).map(run => {
    const id = run.id || '';
    const status = escapeHtml(run.status || '');
    return `<a class="badge status ${status}" href="#run/${escapeHtml(id)}"` +
           ` title="${status}">${escapeHtml(id.slice(0, 8))}</a>`;
  }).join('');
  return chip + runs;
}

// ---- run-action picker -------------------------------------------------
// The picker turns an item into a run: pick a workflow from the catalog
// (GET /workflows), confirm the repo, POST /items/run (web-ui-spec §Items
// view). workflowsCache holds the catalog; runPickerRef holds the item
// being dispatched while the modal is open.
let workflowsCache = null;
let runPickerRef = null;

// fetchWorkflows loads the workflow catalog. GET /workflows returns
// [{name, path}]; path is the pipeline.dot POST /items/run wants. Only a
// non-empty successful catalog is cached — a transient failure or an empty
// result must NOT poison the cache, or one blip would wedge the picker at
// "no workflows" for the whole session. A fetch/HTTP failure throws so the
// caller can surface it and retry on the next open.
async function fetchWorkflows() {
  if (workflowsCache) return workflowsCache;
  const r = await fetch('/workflows');
  if (!r.ok) throw new Error('status ' + r.status);
  const list = await r.json();
  if (list.length) workflowsCache = list;
  return list;
}

// openRunPicker fills the modal from a run button's data-* attributes and
// the workflow catalog, then shows it. A PR item auto-fills its repo from
// vars.repo; other items start blank (the datalist suggests repos already
// seen). The backend maps the repo via repos.toml and 422s an unmapped one.
async function openRunPicker(btn) {
  runPickerRef = {
    source: btn.dataset.runSource,
    type: btn.dataset.runType,
    external_id: btn.dataset.runId,
  };
  // An item that carries its own repo (a PR, via vars.repo) has that repo
  // used by the backend regardless of this field, so show it read-only
  // rather than inviting a silently-ignored edit. Other items keep an
  // editable field (the datalist suggests known repos).
  const repoInput = $('run-picker-repo');
  const itemRepo = btn.dataset.runRepo || '';
  repoInput.value = itemRepo;
  repoInput.readOnly = !!itemRepo;
  repoInput.title = itemRepo ? 'repo comes from the item' : '';
  setRunError('');
  let wfs = [];
  try {
    wfs = await fetchWorkflows();
  } catch (e) {
    setRunError('could not load workflows — reopen to retry');
  }
  $('run-picker-workflow').innerHTML = wfs.length
    ? wfs.map(w => `<option value="${escapeHtml(w.path)}">${escapeHtml(w.name)}</option>`).join('')
    : '<option value="">no workflows</option>';
  fillRepoDatalist();
  $('run-picker').showModal();
}

// fillRepoDatalist suggests the repos present across the loaded items, so a
// non-PR item can be pointed at a known checkout without a repo-map endpoint.
function fillRepoDatalist() {
  const dl = $('run-picker-repos');
  if (!dl) return;
  dl.innerHTML = distinct(itemsCache.map(itemRepo))
    .map(r => `<option value="${escapeHtml(r)}"></option>`).join('');
}

// setRunError shows a picker error (a 422 from an unset/unmapped repo, a
// failed dispatch), or hides the line when empty.
function setRunError(text) {
  const el = $('run-picker-error');
  if (!el) return;
  el.textContent = text || '';
  el.hidden = !text;
}

// submitRun dispatches the picked item → POST /items/run {item_ref,
// pipeline, repo}. The backend resolves the repo (a PR auto-fills it, else
// the field) to the run's cwd and 422s an unset/unmapped one; on success it
// returns the new run id, which we navigate to via the hash router.
let runSubmitting = false;   // in-flight guard: one dispatch per confirm
async function submitRun() {
  if (!runPickerRef || runSubmitting) return;
  const pipeline = $('run-picker-workflow').value;
  if (!pipeline) { setRunError('no workflow selected'); return; }
  setRunError('');
  runSubmitting = true;
  const btn = $('run-picker-run');
  if (btn) btn.disabled = true;
  try {
    let r;
    try {
      r = await postJSON('/items/run', {
        item_ref: runPickerRef,
        pipeline,
        repo: $('run-picker-repo').value.trim(),
      });
    } catch (e) { setRunError('could not reach the daemon'); return; }
    if (!r.ok) { setRunError((await r.text()).trim() || `dispatch failed (${r.status})`); return; }
    const { id } = await r.json();
    $('run-picker').close();
    location.hash = `#run/${id}`;
  } finally {
    runSubmitting = false;
    if (btn) btn.disabled = false;
  }
}

async function renderList() {
  let pipelines = [];
  try {
    const r = await fetch('/pipelines');
    pipelines = (await r.json()).pipelines || [];
  } catch (e) { $('run-list').innerHTML = '<p class="muted">server unreachable</p>'; return; }
  if (!pipelines.length) { $('run-list').innerHTML = '<p class="muted">no runs yet</p>'; return; }
  const rows = pipelines.map(runRowHtml).join('');
  $('run-list').innerHTML = `<table>
    <thead><tr><th>pipeline</th><th>status</th><th>cwd</th><th>started</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

// runRowHtml builds one run-list row. Every attacker-controlled field
// (graph_name, cwd, status come from the DOT source) is escaped before it
// reaches innerHTML. Navigation is pure-hash: the row links to #run/<id>
// and the router opens it, so no inline JS carries the id.
function runRowHtml(p) {
  return `
    <tr>
      <td><a href="#run/${escapeHtml(p.id)}">${escapeHtml(p.graph_name || p.id)}</a></td>
      <td><span class="status ${escapeHtml(p.status)}">${escapeHtml(p.status)}</span></td>
      <td class="muted">${escapeHtml(p.cwd || '')}</td>
      <td class="muted">${escapeHtml(p.started_at || '')}</td>
    </tr>`;
}

// ---- run view ----------------------------------------------------------
async function openRun(id) {
  teardownRun();
  currentRun = id;
  selectedNode = null;
  for (const k in nodeLog) delete nodeLog[k];
  for (const k in nodeState) delete nodeState[k];
  highlightNav('runs');
  showView('run-view');
  $('run-title').textContent = id;
  $('node-pane').innerHTML = '<p class="muted">Click a node to inspect it.</p>';
  await loadGraph(id);
  attachStream(id);
  if (dockTimer) clearInterval(dockTimer);
  refreshDock();
  dockTimer = setInterval(refreshDock, 3000);
}

async function loadGraph(id) {
  try {
    const r = await fetch(`/pipelines/${id}/graph`);
    $('graph').innerHTML = r.ok ? await r.text() : '<p class="muted">graph unavailable</p>';
  } catch (e) { $('graph').innerHTML = '<p class="muted">graph unavailable</p>'; return; }
  // Make each graphviz node clickable; its DOT id lives in <title>.
  $('graph').querySelectorAll('g.node').forEach(g => {
    const id = g.querySelector('title')?.textContent;
    if (!id) return;
    g.addEventListener('click', () => selectNode(id));
    if (nodeState[id]) paintNode(id, nodeState[id]);
  });
}

// paintNode colours a graphviz node's shape by status.
function paintNode(id, cls) {
  nodeState[id] = cls;
  const g = [...$('graph').querySelectorAll('g.node')]
    .find(g => g.querySelector('title')?.textContent === id);
  if (!g) return;
  const color = { running: 'var(--state-running)', completed: 'var(--state-success)',
                  failed: 'var(--state-failed)', retrying: 'var(--state-retrying)' }[cls];
  g.classList.toggle('pulse', cls === 'running');
  g.querySelectorAll('polygon, ellipse, path').forEach(shape => {
    if (color) shape.setAttribute('stroke', color);
  });
}

function attachStream(id) {
  if (es) es.close();
  es = new EventSource(`/pipelines/${id}/events`);
  // Idempotent replay: every (re)connect replays the run's full history
  // from the start before live events. `applied` counts events already
  // handled for this run; `pos` is the position within the current
  // connection's stream (reset on each open). Events at or below `applied`
  // were seen on an earlier connection, so skip them — otherwise a mid-run
  // reconnect re-appends every node-log chunk.
  let applied = 0, pos = 0;
  es.onopen = () => { pos = 0; };
  const on = (kind, fn) => es.addEventListener(kind, e => {
    pos++;
    if (pos <= applied) return;
    applied = pos;
    fn(JSON.parse(e.data));
  });
  on('stage_started',   ev => paintNode(ev.node_id, 'running'));
  on('stage_completed', ev => paintNode(ev.node_id, 'completed'));
  on('stage_failed',    ev => paintNode(ev.node_id, 'failed'));
  on('stage_retrying',  ev => paintNode(ev.node_id, 'retrying'));
  on('stage_progress',  ev => appendProgress(ev));
  // On a terminal event, close the stream. The server ends the SSE
  // connection for finished runs, so leaving it open lets EventSource
  // reconnect every few seconds and replay the whole history again,
  // duplicating node-log chunks each time.
  const done = () => { if (es) es.close(); renderDock([]); refreshDock(); };
  on('pipeline_completed', done);
  on('pipeline_failed', done);
  es.onerror = () => { /* transient; EventSource retries on its own */ };
}

// appendProgress records assistant_delta / tool_call chunks per node.
function appendProgress(ev) {
  const node = ev.node_id; if (!node) return;
  const kind = ev.detail && ev.detail.kind;
  let html = '';
  if (kind === 'assistant_delta') html = escapeHtml(ev.message || '');
  else if (kind === 'tool_call') {
    const name = (ev.detail && ev.detail.tool_name) || 'tool';
    html = `<span class="tool">[${escapeHtml(name)}] ${escapeHtml(ev.message || '')}</span>\n`;
  } else if (ev.message) html = escapeHtml(ev.message) + '\n';
  if (!html) return;
  (nodeLog[node] = nodeLog[node] || []).push(html);
  if (node === selectedNode) {
    const log = $('node-log');
    if (log) { log.innerHTML += html; log.scrollTop = log.scrollHeight; }
  }
}

function selectNode(id) {
  selectedNode = id;
  const base = `/pipelines/${currentRun}/artifacts/${id}`;
  $('node-pane').innerHTML = `
    <h3>${escapeHtml(id)}</h3>
    <div id="node-links">
      <a href="${base}/prompt.md" target="_blank">prompt.md</a>
      <a href="${base}/response.md" target="_blank">response.md</a>
      <a href="${base}/tool_calls/" target="_blank">tool_calls/</a>
    </div>
    <div id="node-log">${(nodeLog[id] || []).join('')}</div>`;
  const log = $('node-log'); if (log) log.scrollTop = log.scrollHeight;
}

// ---- wait.human dock ---------------------------------------------------
async function refreshDock() {
  if (!currentRun) return;
  try {
    const r = await fetch(`/pipelines/${currentRun}/questions`);
    renderDock((await r.json()).questions || []);
  } catch (e) { /* transient; retried on next tick */ }
}

// renderDock builds the wait.human dock via DOM + listeners rather than
// interpolating question text into an HTML string: option labels can
// contain quotes that would otherwise break an inline onclick attribute.
function renderDock(questions) {
  const dock = $('human-dock');
  dock.textContent = '';
  if (!questions.length) return;
  const h = document.createElement('h3'); h.textContent = 'open questions';
  dock.appendChild(h);
  questions.forEach(q => {
    const box = document.createElement('div'); box.className = 'q';
    const label = document.createElement('div');
    label.textContent = (q.text || '') + ' ';
    const who = document.createElement('span'); who.className = 'muted';
    who.textContent = '(' + (q.node_id || '') + ')';
    label.appendChild(who);
    box.appendChild(label);
    if ((q.options || []).length) {
      q.options.forEach(o => {
        const b = document.createElement('button');
        b.textContent = o.label;
        b.addEventListener('click', () => answer(q.id, { key: o.key, label: o.label }));
        box.appendChild(b); box.appendChild(document.createTextNode(' '));
      });
    } else {
      const input = document.createElement('input'); input.placeholder = 'answer';
      const send = document.createElement('button'); send.textContent = 'send';
      send.addEventListener('click', () => answer(q.id, { text: input.value }));
      box.appendChild(input); box.appendChild(document.createTextNode(' ')); box.appendChild(send);
    }
    dock.appendChild(box);
  });
}

// postJSON POSTs a JSON body and returns the raw Response, leaving status
// handling to the caller.
function postJSON(url, body) {
  return fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}

async function answer(qid, body) {
  await postJSON(`/pipelines/${currentRun}/questions/${qid}/answer`, body);
  refreshDock();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---- boot --------------------------------------------------------------
window.addEventListener('load', () => {
  syncToggle();
  // Toolbar controls re-render from the cached merged set — no refetch.
  for (const id of ['items-filter-source', 'items-filter-type', 'items-filter-repo',
                    'items-filter-progress', 'items-group']) {
    $(id)?.addEventListener('change', renderItems);
  }
  $('items-filter-text')?.addEventListener('input', renderItems);
  // Delegated run trigger: item rows are innerHTML, so a single listener on
  // the list opens the picker for whichever row's run button was clicked.
  $('items-list')?.addEventListener('click', e => {
    const btn = e.target.closest('button[data-run]');
    if (btn) openRunPicker(btn);
  });
  $('run-picker-cancel')?.addEventListener('click', () => $('run-picker').close());
  $('run-picker-run')?.addEventListener('click', submitRun);
  window.addEventListener('hashchange', route);
  route();
});
</script>
</body>
</html>
