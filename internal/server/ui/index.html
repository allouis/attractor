<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>attractor</title>
<script data-theme-preload>
  // Apply the persisted theme before first paint to avoid a flash of the
  // wrong palette. Absent a stored choice, the CSS media query drives it.
  (function () {
    try {
      const t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* localStorage may be unavailable; fall back to OS pref */ }
  })();
</script>
<style>
  /* Design tokens (web-ui-spec W1). Every view consumes tokens only — no
     ad-hoc colours/sizes. Light is the base :root; dark values arrive via
     the data-theme override (manual toggle) and prefers-color-scheme. */
  :root {
    /* surface + text ramp */
    --surface-0: #ffffff;   /* page background */
    --surface-1: #f6f8fa;   /* raised panels */
    --surface-2: #eaeef2;   /* inset / hover */
    --text: #1f2328;
    --text-muted: #656d76;
    --border: #d0d7de;
    --accent: #0969da;
    /* spacing scale */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    /* type scale */
    --font-sm: 12px;
    --font-base: 14px;
    --font-lg: 18px;
    /* semantic state palette — the load-bearing colour decision.
       needs-human is deliberately the highest-attention hue. */
    --state-queued: #64748b;
    --state-running: #2563eb;
    --state-success: #16a34a;
    --state-failed: #dc2626;
    --state-needs-human: #d97706;
    --state-retrying: #ea580c;
    --state-cancelled: #94a3b8;
    /* Ink for text sitting on a filled needs-human (amber) fill. Amber is
       light in both themes, so this stays dark and is NOT overridden below —
       it clears WCAG AA on the amber fill in light and dark alike. */
    --attention-ink: #1f2328;
  }
  /* Dark tokens. Duplicated across an explicit override and the media
     query so a manual choice always wins over the OS preference:
       no data-theme        -> follow prefers-color-scheme
       data-theme="dark"     -> dark regardless of OS
       data-theme="light"    -> stay on the light :root base */
  :root[data-theme="dark"] {
    --surface-0: #0d1117;
    --surface-1: #161b22;
    --surface-2: #21262d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --border: #30363d;
    --accent: #4493f8;
    --state-queued: #94a3b8;
    --state-running: #60a5fa;
    --state-success: #4ade80;
    --state-failed: #f87171;
    --state-needs-human: #fbbf24;
    --state-retrying: #fb923c;
    --state-cancelled: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface-0: #0d1117;
      --surface-1: #161b22;
      --surface-2: #21262d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --border: #30363d;
      --accent: #4493f8;
      --state-queued: #94a3b8;
      --state-running: #60a5fa;
      --state-success: #4ade80;
      --state-failed: #f87171;
      --state-needs-human: #fbbf24;
      --state-retrying: #fb923c;
      --state-cancelled: #64748b;
    }
  }
  * { box-sizing: border-box; }
  body { font: var(--font-base)/1.5 system-ui, sans-serif; margin: 0; color: var(--text); background: var(--surface-0); }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); font-weight: 600; }
  header a { color: inherit; text-decoration: none; }
  header .brand { margin-right: var(--space-5); }
  nav { display: flex; gap: var(--space-4); flex: 1; font-weight: 400; }
  nav a { color: var(--text-muted); padding: var(--space-1) 0; border-bottom: 2px solid transparent; }
  nav a.active { color: var(--text); border-bottom-color: var(--accent); }
  #theme-toggle { font-weight: 400; }
  main { padding: var(--space-3) var(--space-4); }
  /* One view visible at a time; the router shows the routed section. */
  main > section { display: none; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; }
  a { color: var(--accent); }
  .status { font-weight: 600; text-transform: capitalize; }
  .status.completed { color: var(--state-success); }
  .status.failed { color: var(--state-failed); }
  .status.cancelled { color: var(--state-cancelled); }
  .status.running { color: var(--state-running); }
  .status.retrying { color: var(--state-retrying); }
  .status.queued { color: var(--state-queued); }
  /* Runs fleet counts (web-ui-spec W5): outlined state-tinted pills that
     answer "how many running / queued / needs-human / failed" at a glance.
     needs-human is the load-bearing state, so when non-zero it fills rather
     than outlines — the highest-attention treatment. */
  .counts { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
  .counts:empty { display: none; }
  .count { font-size: var(--font-sm); font-weight: 600; padding: var(--space-1) var(--space-3);
           border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); }
  .count-running { color: var(--state-running); border-color: var(--state-running); }
  .count-queued { color: var(--state-queued); border-color: var(--state-queued); }
  .count-failed { color: var(--state-failed); border-color: var(--state-failed); }
  .count-needs-human { color: var(--state-needs-human); border-color: var(--state-needs-human); }
  .count.loud { background: var(--state-needs-human); color: var(--attention-ink);
                border-color: var(--state-needs-human); }
  /* Per-row needs-human flag: same loud amber fill, carried on the run row. */
  .chip.needs-human { display: inline-block; font-size: var(--font-sm); font-weight: 600;
           padding: 0 var(--space-2); border-radius: 999px; margin-left: var(--space-2);
           background: var(--state-needs-human); color: var(--attention-ink); }
  /* Items filter/group toolbar. Controls consume tokens; they wrap on
     narrow viewports rather than overflow. */
  .toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center;
             margin-bottom: var(--space-3); }
  .toolbar select, .toolbar input { font: inherit; padding: var(--space-1) var(--space-2);
             color: var(--text); background: var(--surface-1);
             border: 1px solid var(--border); border-radius: 6px; }
  .toolbar .check { display: inline-flex; align-items: center; gap: var(--space-1);
             color: var(--text-muted); }
  .group-head { margin: var(--space-4) 0 var(--space-1); color: var(--text-muted); font-size: var(--font-sm);
             text-transform: uppercase; letter-spacing: .04em; }
  .group-head:first-child { margin-top: 0; }
  /* Warning banner: a partial-source outage must be visible, not silent. */
  .banner { padding: var(--space-2) var(--space-3); border-radius: 6px; margin-bottom: var(--space-3);
            border: 1px solid var(--border); background: var(--surface-1); }
  .banner.error { color: var(--state-failed); border-color: var(--state-failed); }
  .banner.ok { color: var(--state-success); border-color: var(--state-success); }
  .banner.warn { color: var(--state-needs-human); border-color: var(--state-needs-human); }
  /* Item badges: a linked-run pill (status-tinted, links to #run/<id>) and
     the deliberately loud in-progress chip. */
  .badge { display: inline-block; font-size: var(--font-sm); font-weight: 600;
           padding: 0 var(--space-2); border-radius: 999px; border: 1px solid var(--border);
           text-decoration: none; margin-right: var(--space-1); }
  .badge.in-progress { color: var(--state-running); border-color: var(--state-running); }
  .layout { display: grid; grid-template-columns: 1fr 360px; gap: var(--space-4); align-items: start; }
  /* Shared graph-pane sizing: the run-detail graph and the static workflow
     graph both render server-side SVG and size identically. */
.workflow-expand { display: inline-block; margin: 0 0 var(--space-3); color: var(--text-muted); font-size: .9em; cursor: pointer; }
  .graph-pane svg { max-width: 100%; height: auto; }
  #graph g.node { cursor: pointer; }
  /* Card primitive (web-ui-v2-spec U1): a bordered, padded surface for a
     grouped chunk of content — the node inspector and each config panel. */
  .card { border: 1px solid var(--border); border-radius: 6px; padding: var(--space-3);
          background: var(--surface-1); }
  #node-pane { min-height: 120px; }
  #node-pane h3 { margin: 0 0 var(--space-2); }
  #node-log { white-space: pre-wrap; font: var(--font-sm)/1.45 ui-monospace, monospace;
              margin-top: var(--space-2); max-height: 320px; overflow: auto; }
  #node-pane h4 { margin: var(--space-3) 0 var(--space-1); font-size: var(--font-sm); }
  .stage-meta { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }
  .stage-text { margin: 0; padding: var(--space-2); background: var(--surface-2); border-radius: 6px;
                white-space: pre-wrap; font: var(--font-sm)/1.45 ui-monospace, monospace;
                max-height: 320px; overflow: auto; }
  .tool { color: var(--text-muted); }
  .tool-call summary { cursor: pointer; color: var(--text-muted); }
  .tool-call pre { margin: var(--space-1) 0 0; padding: var(--space-2);
                   background: var(--surface-2); border-radius: 6px;
                   font: var(--font-sm)/1.45 ui-monospace, monospace;
                   white-space: pre-wrap; overflow: auto; }
  #human-dock { margin-top: var(--space-4); }
  #human-dock .q { border: 1px solid var(--state-needs-human); border-radius: 6px;
                   padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2); }
  /* Event timeline (web-ui-v2-spec U3): the full, filterable run event log —
     a scrollable feed under the graph so the whole history is one glance. */
  #event-timeline { margin-top: var(--space-4); }
  #event-timeline h3 { margin: 0 0 var(--space-2); }
  .tl-controls { display: flex; gap: var(--space-2); margin-bottom: var(--space-2); }
  .tl-controls input { flex: 1; }
  .timeline { border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1);
              max-height: 360px; overflow: auto; font: var(--font-sm)/1.45 ui-monospace, monospace; }
  .tl-row { display: flex; align-items: baseline; gap: var(--space-2);
            padding: var(--space-1) var(--space-3); border-bottom: 1px solid var(--border); }
  .tl-row:last-child { border-bottom: 0; }
  .tl-time { color: var(--text-muted); white-space: nowrap; }
  .tl-kind { flex: none; }
  .tl-node { color: var(--text-muted); }
  .tl-msg { white-space: pre-wrap; word-break: break-word; }
  .pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .muted { color: var(--text-muted); }
  /* Shared empty/loading/error placeholder (web-ui-v2-spec U1). Centred,
     padded, and colour-coded so a failure never reads like an empty list. */
  .state { color: var(--text-muted); text-align: center; padding: var(--space-5) 0; }
  .state-error { color: var(--state-failed); }
  button { font: inherit; padding: var(--space-1) var(--space-3); cursor: pointer;
           background: var(--surface-1); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
  button:hover { background: var(--surface-2); }
  /* Reusable modal (web-ui-v2-spec U1): a token-styled <dialog>. The
     run-action picker is the first user; new dialogs get the look for free. */
  .modal { color: var(--text); background: var(--surface-0);
                border: 1px solid var(--border); border-radius: 8px;
                padding: var(--space-4); min-width: 320px; max-width: min(560px, 92vw); }
  .modal::backdrop { background: rgba(0, 0, 0, .4); }
  .modal h3 { margin: 0 0 var(--space-3); }
  .modal label { display: block; margin-bottom: var(--space-3); color: var(--text-muted); }
  .modal select, .modal input { font: inherit; width: 100%; margin-top: var(--space-1);
                color: var(--text); background: var(--surface-1);
                border: 1px solid var(--border); border-radius: 6px; padding: var(--space-1) var(--space-2); }
  .modal-actions { display: flex; justify-content: flex-end; gap: var(--space-2); }
  /* Config view (config-screen-spec C4): hand-built panels over the whole
     config doc. Panels share the table/banner/button primitives; inputs
     consume tokens like the toolbar controls. */
  .config-panel { margin-bottom: var(--space-4); }
  .config-panel h3 { margin: 0 0 var(--space-1); }
  .config-panel .muted { margin-top: 0; }
  .config-panel input, .config-panel select { font: inherit; width: 100%;
             color: var(--text); background: var(--surface-1);
             border: 1px solid var(--border); border-radius: 6px; padding: var(--space-1) var(--space-2); }
  .config-note { color: var(--state-needs-human); font-size: var(--font-sm); }
  .config-actions { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-4); }
  /* Responsive (web-ui-v2-spec U1): on a narrow viewport collapse the
     two-column run/workflow detail to a single column, let the header nav
     wrap instead of overflowing, and tighten table cells + page padding. */
  @media (max-width: 720px) {
    main { padding: var(--space-3); }
    header { flex-wrap: wrap; row-gap: var(--space-2); }
    .layout { grid-template-columns: 1fr; }
    th, td { padding: var(--space-2); }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="#items">attractor</a>
  <nav>
    <a id="nav-items" href="#items">Items</a>
    <a id="nav-runs" href="#runs">Runs</a>
    <a id="nav-workflows" href="#workflows">Workflows</a>
    <a id="nav-config" href="#config">Config</a>
  </nav>
  <button id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark" aria-label="Toggle theme">&#9790;</button>
</header>
<main>
  <section id="items-view">
    <div id="items-toolbar" class="toolbar">
      <select id="items-filter-source" title="source"><option value="">all sources</option></select>
      <select id="items-filter-type" title="type"><option value="">all types</option></select>
      <select id="items-filter-repo" title="repo"><option value="">all repos</option></select>
      <input id="items-filter-text" type="search" placeholder="filter title…">
      <label class="check"><input id="items-filter-progress" type="checkbox"> in progress</label>
      <select id="items-group" title="group by">
        <option value="">no grouping</option>
        <option value="repo">group by repo</option>
        <option value="source">group by source</option>
      </select>
    </div>
    <div id="items-warning" role="alert"></div>
    <div id="items-list"></div>
    <dialog id="run-picker" class="modal">
      <h3>run item</h3>
      <label>workflow <select id="run-picker-workflow"></select></label>
      <label>repo <input id="run-picker-repo" list="run-picker-repos" placeholder="owner/name"></label>
      <datalist id="run-picker-repos"></datalist>
      <p id="run-picker-error" class="banner error" hidden></p>
      <div class="modal-actions">
        <button type="button" id="run-picker-cancel">cancel</button>
        <button type="button" id="run-picker-run">run</button>
      </div>
    </dialog>
  </section>
  <section id="runs-view">
    <div id="run-counts" class="counts"></div>
    <section id="run-list"></section>
  </section>
  <section id="workflows-view"><div id="workflows-list"></div></section>
  <section id="config-view">
    <div id="config-status" role="alert"></div>
    <div id="config-body"></div>
    <div class="config-actions">
      <button type="button" id="config-save">save</button>
      <span id="config-dirty" class="muted"></span>
    </div>
  </section>
  <section id="workflow-view">
    <p><a href="#workflows">&larr; all workflows</a></p>
    <h2 id="workflow-title"></h2>
    <p class="muted">Run this workflow by picking an <a href="#items">item</a>.</p>
    <label class="workflow-expand"><input type="checkbox" id="workflow-expand"> expand sub-workflows</label>
    <div id="workflow-graph" class="graph-pane"></div>
  </section>
  <section id="run-view">
    <p><a href="#runs">&larr; all runs</a></p>
    <h2 id="run-title"></h2>
    <div id="run-failure"></div>
    <div class="layout">
      <div id="graph" class="graph-pane"></div>
      <div>
        <div id="node-pane" class="card"><p class="muted">Click a node to inspect it.</p></div>
        <div id="human-dock"></div>
      </div>
    </div>
    <section id="event-timeline">
      <h3>Events</h3>
      <div class="tl-controls">
        <select id="tl-kind" aria-label="filter events by kind"><option value="">all kinds</option></select>
        <input id="tl-text" placeholder="filter events…" aria-label="filter events by text">
      </div>
      <div id="tl-rows" class="timeline"></div>
    </section>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let es = null;                 // active EventSource
let currentRun = null;         // run id being viewed
let selectedNode = null;       // node id in the pane
const nodeLog = {};            // node id -> accumulated log html chunks
const nodeState = {};          // node id -> status class
const nodeTiming = {};         // node id -> {start, end} ISO ts from the stream
let dockTimer = null;
let runsTimer = null;          // fleet-list poll while the Runs view is open
let configLoaded = null;       // last GET /config doc (redacted) the view rendered
let linearClear = false;       // pending explicit Linear-key clear (Clear button)
let configDirty = false;       // Config view has unsaved edits (nav/unload guard)
let activeView = null;         // id of the section route() last showed
const timeline = [];           // run detail: {kind, ev} per streamed event (U3)

// EVENT_KINDS is every engine event kind the SSE stream carries (engine
// events.go). attachStream registers one dispatch per kind so the replay
// cursor stays authoritative for the whole stream and the U3 timeline sees
// them all — even kinds with no graph side-effect.
const EVENT_KINDS = [
  'pipeline_started', 'pipeline_completed', 'pipeline_failed',
  'stage_started', 'stage_completed', 'stage_failed', 'stage_retrying',
  'stage_progress', 'checkpoint_saved',
  'interview_started', 'interview_answered', 'interview_timeout', 'usage',
];

// TIMELINE_SKIP are kinds the U3 timeline does NOT log. stage_progress is
// emitted once per assistant token (acp.go / claudecode.go) — thousands per
// run; it is the inspector's live tail (U2), not a high-level timeline event.
// It still flows through the dispatch (paint + node-log side-effects and the
// replay cursor), it just never becomes a timeline row.
const TIMELINE_SKIP = new Set(['stage_progress']);

// STANDARD_CHECKS are the checks the current pipelines reference; the Repos
// panel surfaces them as fixed columns even when a repo sets none. The
// stored checks map stays open (config-screen-spec) — a repo may carry more.
const STANDARD_CHECKS = ['deps', 'typecheck', 'lint', 'test'];

// ---- theme -------------------------------------------------------------
// currentTheme resolves the effective palette: an explicit manual choice
// (data-theme) wins, else the OS preference.
function currentTheme() {
  const set = document.documentElement.getAttribute('data-theme');
  if (set) return set;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

// syncToggle points the toggle glyph at the palette it switches *to*.
function syncToggle() {
  const btn = $('theme-toggle');
  if (btn) btn.innerHTML = currentTheme() === 'dark' ? '&#9728;' : '&#9790;';
}

function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', next); } catch (e) { /* best-effort */ }
  document.documentElement.setAttribute('data-theme', next);
  syncToggle();
}

// showView switches the single visible top-level section by id, recording it
// so the route guard knows which view is being left.
function showView(name) {
  for (const sec of document.querySelectorAll('main > section')) {
    sec.style.display = sec.id === name ? 'block' : 'none';
  }
  activeView = name;
}

// confirmLeaveConfig guards against silently dropping unsaved Config edits.
// route() calls it before switching views; when leaving the Config view with
// pending edits for a different hash it prompts, and on cancel restores the
// address bar to #config without a reload (history.replaceState fires no
// hashchange), keeping the in-progress edits on screen.
function confirmLeaveConfig() {
  if (activeView !== 'config-view' || !configDirty) return true;
  if (location.hash === '#config') return true;   // staying on the view
  if (confirm('Discard unsaved config changes?')) { configDirty = false; return true; }
  history.replaceState(null, '', '#config');
  return false;
}

// ---- routing -----------------------------------------------------------
// TABS is the top-level tab registry: hash → nav-link id, view section id,
// and the enter handler that renders it. One place drives both route()'s
// dispatch and highlightNav()'s active marking, so adding a tab is a single
// entry rather than edits scattered across the two (web-ui-spec nav shell).
const TABS = {
  items:     { nav: 'nav-items',     view: 'items-view',     enter: showItems },
  runs:      { nav: 'nav-runs',      view: 'runs-view',      enter: showRuns },
  workflows: { nav: 'nav-workflows', view: 'workflows-view', enter: showWorkflows },
  config:    { nav: 'nav-config',    view: 'config-view',    enter: showConfig },
};

// teardownRun stops the run-detail stream + dock poll when leaving a run.
function teardownRun() {
  if (es) { es.close(); es = null; }
  if (dockTimer) { clearInterval(dockTimer); dockTimer = null; }
  currentRun = null;
}

// route dispatches on the URL hash. All navigation flows through the hash
// (nav tabs, run rows, back links), so one hashchange listener drives
// every view switch. An unknown tab falls back to Items (the default land).
function route() {
  if (!confirmLeaveConfig()) return;   // stay put on a cancelled leave
  stopRunsPoll();
  const m = location.hash.match(/^#run\/(.+)$/);
  if (m) { openRun(m[1]); return; }
  teardownRun();
  const wf = location.hash.match(/^#workflow\/(.+)$/);
  if (wf) { openWorkflow(decodeURIComponent(wf[1])); return; }
  const hash = location.hash.replace(/^#/, '');
  const name = TABS[hash] ? hash : 'items';
  const tab = TABS[name];
  highlightNav(name);
  showView(tab.view);
  tab.enter();
}

// highlightNav marks the active tab; run detail counts as the Runs tab.
function highlightNav(name) {
  for (const t in TABS) {
    const el = $(TABS[t].nav);
    if (el) el.classList.toggle('active', t === name);
  }
}

// ---- items view --------------------------------------------------------
// The candidate set is what each source returns for "assigned to me". The
// GET /items endpoint is single-source, so the view discovers the daemon's
// sources (GET /items/sources — never a hardcoded list, which would drift
// from config) and fetches each, merging client-side (web-ui-spec §Items
// view). itemsCache holds the merged set; renderItems draws from it so
// filters re-render without refetching.
let itemsCache = [];
let itemsRendered = false; // suppresses the loading flash on a background refresh
let itemsGen = 0;          // request generation; only the latest fetch renders

// showItems renders the Items view and refreshes it on every entry, so live
// status badges and newly-assigned items stay current (a stale, never-
// refreshing list defeats the view's purpose). The first entry shows a
// loading placeholder; a re-entry refetches in the background — keeping the
// current rows and the user's filter selections visible until fresh data
// lands. itemsGen guards out-of-order fetches: only the latest render wins.
function showItems() {
  fetchItems();
}

async function fetchItems() {
  const gen = ++itemsGen;
  const listEl = $('items-list');
  if (!itemsRendered) listEl.innerHTML = loadingState();
  let sources;
  try {
    const r = await fetch('/items/sources');
    if (!r.ok) throw new Error('status ' + r.status);
    sources = (await r.json()).sources || [];
  } catch (e) {
    if (gen !== itemsGen) return;   // superseded by a newer fetch
    // A refresh failure keeps the last-known list rather than wiping it; a
    // first-load failure has nothing to keep, so it shows the error inline.
    if (itemsRendered) {
      setItemsWarning('could not refresh items — showing the last-loaded set');
    } else {
      itemsCache = [];
      renderSourceWarning([]);
      listEl.innerHTML = '<p class="banner error">could not reach the daemon to load item sources</p>';
    }
    return;
  }
  // Fetch each source independently and record which failed, so a partial
  // outage (a source 500ing/rate-limited) is surfaced rather than silently
  // dropping assigned work — the one failure a triage view must not have
  // (review B1).
  const failed = [];
  const per = await Promise.all(sources.map(async (s) => {
    try {
      const r = await fetch(`/items?source=${encodeURIComponent(s)}&filter=assigned`);
      if (!r.ok) { failed.push(s); return []; }
      return (await r.json()).items || [];
    } catch (e) { failed.push(s); return []; }
  }));
  if (gen !== itemsGen) return;     // a newer fetch superseded this one
  itemsCache = per.flat();
  itemsRendered = true;
  renderSourceWarning(failed);
  populateItemFilters();
  renderItems();
}

// setItemsWarning shows an error banner above the list, or clears it when
// text is empty.
function setItemsWarning(text) {
  const el = $('items-warning');
  if (!el) return;
  el.textContent = text || '';
  el.className = text ? 'banner error' : '';
}

// renderSourceWarning surfaces sources that failed to load, naming them so
// the user reads the list as incomplete rather than as "nothing assigned".
// An empty list clears the banner.
function renderSourceWarning(failed) {
  setItemsWarning(failed.length
    ? `could not load: ${failed.join(', ')} — showing the remaining sources only`
    : '');
}

// itemRepo / itemSource / itemType read the fields the filters key on.
const itemRepo = (it) => (it.vars && it.vars.repo) || '';
const itemSource = (it) => (it.ref && it.ref.source) || '';
const itemType = (it) => (it.ref && it.ref.type) || '';

// populateItemFilters fills the source/type/repo selects with the distinct
// values present in the merged set, preserving the current selection.
function populateItemFilters() {
  fillOptions('items-filter-source', distinct(itemsCache.map(itemSource)));
  fillOptions('items-filter-type', distinct(itemsCache.map(itemType)));
  fillOptions('items-filter-repo', distinct(itemsCache.map(itemRepo)));
}

function distinct(values) {
  return [...new Set(values.filter(Boolean))].sort();
}

// fillOptions rebuilds a select's options below its first (all/none) option,
// keeping the current choice selected when it still exists.
function fillOptions(id, values) {
  const sel = $(id);
  if (!sel) return;
  const prev = sel.value;
  while (sel.options.length > 1) sel.remove(1);
  for (const v of values) {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  }
  sel.value = values.includes(prev) ? prev : '';
}

// applyFilters narrows the merged set by the toolbar controls (v1 narrows
// only; broadening the candidate set is v2 backend work — web-ui-spec
// §Items view).
function applyFilters(list) {
  const source = $('items-filter-source').value;
  const type = $('items-filter-type').value;
  const repo = $('items-filter-repo').value;
  const text = $('items-filter-text').value.trim().toLowerCase();
  const progressOnly = $('items-filter-progress').checked;
  return list.filter(it =>
    (!source || itemSource(it) === source) &&
    (!type || itemType(it) === type) &&
    (!repo || itemRepo(it) === repo) &&
    (!text || (it.title || '').toLowerCase().includes(text)) &&
    (!progressOnly || it.in_progress));
}

function renderItems() {
  const list = applyFilters(itemsCache);
  if (!list.length) { $('items-list').innerHTML = emptyState('no items'); return; }
  const groupBy = $('items-group').value;
  const key = { repo: itemRepo, source: itemSource }[groupBy];
  if (!key) { $('items-list').innerHTML = itemsTable(list); return; }
  const groups = new Map();
  for (const it of list) {
    const g = key(it) || '(none)';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(it);
  }
  $('items-list').innerHTML = [...groups.keys()].sort().map(g =>
    `<div class="group-head">${escapeHtml(g)}</div>${itemsTable(groups.get(g))}`).join('');
}

// itemsTable renders one table of item rows.
function itemsTable(list) {
  const rows = list.map(itemRowHtml).join('');
  return `<table>
    <thead><tr><th>title</th><th>source</th><th>type</th><th>repo</th><th>runs</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

// itemRowHtml builds one item row. Every field originates from an external
// source, so all are escaped for the HTML context; the title URL is also
// scheme-checked for the URL context (escapeHtml alone does not neutralise a
// javascript: href) and opened with rel=noopener noreferrer.
function itemRowHtml(it) {
  return `
    <tr>
      <td><a href="${escapeHtml(safeUrl(it.url || ''))}" target="_blank" rel="noopener noreferrer">${escapeHtml(it.title || '')}</a></td>
      <td class="muted">${escapeHtml(itemSource(it))}</td>
      <td class="muted">${escapeHtml(itemType(it))}</td>
      <td class="muted">${escapeHtml(itemRepo(it))}</td>
      <td>${itemBadges(it)}</td>
      <td>${itemRunButton(it)}</td>
    </tr>`;
}

// itemRunButton renders the per-row run trigger. The item ref + repo ride
// on data-* attributes (escaped) rather than an inline onclick, matching
// the page's no-inline-JS convention; a delegated click on #items-list
// opens the picker (web-ui-spec §Items view run action).
function itemRunButton(it) {
  const ref = it.ref || {};
  return `<button data-run` +
    ` data-run-source="${escapeHtml(ref.source || '')}"` +
    ` data-run-type="${escapeHtml(ref.type || '')}"` +
    ` data-run-id="${escapeHtml(ref.external_id || '')}"` +
    ` data-run-repo="${escapeHtml(itemRepo(it))}">run</button>`;
}

// safeUrl returns url only when it resolves to an http(s) scheme; a
// javascript:/data: URL (or anything unparseable) becomes '#', so an
// external item's URL cannot smuggle a script into the app origin (S1).
function safeUrl(url) {
  try {
    const proto = new URL(url, location.origin).protocol;
    return (proto === 'http:' || proto === 'https:') ? url : '#';
  } catch (e) { return '#'; }
}

// itemBadges renders the item's run annotation (web-ui-spec §Items view):
// a loud in-progress chip when a linked run is queued/running, then one
// status-tinted pill per linked run linking to #run/<id>.
function itemBadges(it) {
  const chip = it.in_progress ? '<span class="badge in-progress">in progress</span>' : '';
  const runs = (it.linked_runs || []).map(run => {
    const id = run.id || '';
    const status = escapeHtml(run.status || '');
    return `<a class="badge status ${status}" href="#run/${escapeHtml(id)}"` +
           ` title="${status}">${escapeHtml(id.slice(0, 8))}</a>`;
  }).join('');
  return chip + runs;
}

// ---- run-action picker -------------------------------------------------
// The picker turns an item into a run: pick a workflow from the catalog
// (GET /workflows), confirm the repo, POST /items/run (web-ui-spec §Items
// view). workflowsCache holds the catalog; runPickerRef holds the item
// being dispatched while the modal is open.
let workflowsCache = null;
let runPickerRef = null;

// fetchWorkflows loads the workflow catalog. GET /workflows returns
// [{name, path}]; path is the pipeline.dot POST /items/run wants. Only a
// non-empty successful catalog is cached — a transient failure or an empty
// result must NOT poison the cache, or one blip would wedge the picker at
// "no workflows" for the whole session. A fetch/HTTP failure throws so the
// caller can surface it and retry on the next open.
async function fetchWorkflows() {
  if (workflowsCache) return workflowsCache;
  const r = await fetch('/workflows');
  if (!r.ok) throw new Error('status ' + r.status);
  const list = await r.json();
  if (list.length) workflowsCache = list;
  return list;
}

// openRunPicker fills the modal from a run button's data-* attributes and
// the workflow catalog, then shows it. A PR item auto-fills its repo from
// vars.repo; other items start blank (the datalist suggests repos already
// seen). The backend maps the repo via repos.toml and 422s an unmapped one.
async function openRunPicker(btn) {
  runPickerRef = {
    source: btn.dataset.runSource,
    type: btn.dataset.runType,
    external_id: btn.dataset.runId,
  };
  // An item that carries its own repo (a PR, via vars.repo) has that repo
  // used by the backend regardless of this field, so show it read-only
  // rather than inviting a silently-ignored edit. Other items keep an
  // editable field (the datalist suggests known repos).
  const repoInput = $('run-picker-repo');
  const itemRepo = btn.dataset.runRepo || '';
  repoInput.value = itemRepo;
  repoInput.readOnly = !!itemRepo;
  repoInput.title = itemRepo ? 'repo comes from the item' : '';
  setRunError('');
  let wfs = [];
  try {
    wfs = await fetchWorkflows();
  } catch (e) {
    setRunError('could not load workflows — reopen to retry');
  }
  $('run-picker-workflow').innerHTML = wfs.length
    ? wfs.map(w => `<option value="${escapeHtml(w.path)}">${escapeHtml(w.name)}</option>`).join('')
    : '<option value="">no workflows</option>';
  fillRepoDatalist();
  $('run-picker').showModal();
}

// fillRepoDatalist suggests the repos present across the loaded items, so a
// non-PR item can be pointed at a known checkout without a repo-map endpoint.
function fillRepoDatalist() {
  const dl = $('run-picker-repos');
  if (!dl) return;
  dl.innerHTML = distinct(itemsCache.map(itemRepo))
    .map(r => `<option value="${escapeHtml(r)}"></option>`).join('');
}

// setRunError shows a picker error (a 422 from an unset/unmapped repo, a
// failed dispatch), or hides the line when empty.
function setRunError(text) {
  const el = $('run-picker-error');
  if (!el) return;
  el.textContent = text || '';
  el.hidden = !text;
}

// submitRun dispatches the picked item → POST /items/run {item_ref,
// pipeline, repo}. The backend resolves the repo (a PR auto-fills it, else
// the field) to the run's cwd and 422s an unset/unmapped one; on success it
// returns the new run id, which we navigate to via the hash router.
let runSubmitting = false;   // in-flight guard: one dispatch per confirm
async function submitRun() {
  if (!runPickerRef || runSubmitting) return;
  const pipeline = $('run-picker-workflow').value;
  if (!pipeline) { setRunError('no workflow selected'); return; }
  setRunError('');
  runSubmitting = true;
  const btn = $('run-picker-run');
  if (btn) btn.disabled = true;
  try {
    let r;
    try {
      r = await postJSON('/items/run', {
        item_ref: runPickerRef,
        pipeline,
        repo: $('run-picker-repo').value.trim(),
      });
    } catch (e) { setRunError('could not reach the daemon'); return; }
    if (!r.ok) { setRunError((await r.text()).trim() || `dispatch failed (${r.status})`); return; }
    const { id } = await r.json();
    $('run-picker').close();
    location.hash = `#run/${id}`;
  } finally {
    runSubmitting = false;
    if (btn) btn.disabled = false;
  }
}

// ---- workflows view ----------------------------------------------------
// The Workflows view browses the workflow catalog (GET /workflows) and,
// per entry, renders the definition's static graph (GET /workflows/{name}/
// graph → SVG). Read-only: no run, no SSE (web-ui-spec §Workflows view).
// showWorkflows lists the catalog; each name links to #workflow/<name>.
async function showWorkflows() {
  const listEl = $('workflows-list');
  listEl.innerHTML = loadingState();
  let wfs;
  try {
    wfs = await fetchWorkflows();   // reuses the run-picker's catalog cache
  } catch (e) {
    listEl.innerHTML = errorState('could not load workflows');
    return;
  }
  if (!wfs.length) { listEl.innerHTML = emptyState('no workflows'); return; }
  listEl.innerHTML = `<table>
    <thead><tr><th>workflow</th></tr></thead>
    <tbody>${wfs.map(w =>
      `<tr><td><a href="#workflow/${encodeURIComponent(w.name)}">${escapeHtml(w.name)}</a></td></tr>`
    ).join('')}</tbody></table>`;
}

// openWorkflow shows one workflow's static graph, rendered server-side from
// its definition (same renderer as the run graph, but no run). The SVG is
// injected as-is, matching loadGraph's trust of the server-rendered graph.
let currentWorkflow = null;

async function openWorkflow(name) {
  currentWorkflow = name;
  highlightNav('workflows');
  showView('workflow-view');
  $('workflow-title').textContent = name;
  await renderWorkflowGraph();
}

// renderWorkflowGraph (re)loads the current workflow's graph, honouring the
// "expand sub-workflows" toggle (?expand inlines each manager_loop child as
// a nested cluster). The SVG is injected as-is, matching loadGraph's trust
// of the server-rendered graph.
async function renderWorkflowGraph() {
  if (!currentWorkflow) return;
  const pane = $('workflow-graph');
  pane.innerHTML = loadingState();
  const expand = $('workflow-expand') && $('workflow-expand').checked ? '?expand=1' : '';
  try {
    const r = await fetch(`/workflows/${encodeURIComponent(currentWorkflow)}/graph${expand}`);
    pane.innerHTML = r.ok ? await r.text() : errorState('graph unavailable');
  } catch (e) { pane.innerHTML = errorState('graph unavailable'); }
}

// ---- runs fleet view ---------------------------------------------------
// The Runs view is a run-centric fleet list, poll-refreshed ~2.5s (the
// dock's pattern) so counts + needs-human stay live without a backend push
// (web-ui-spec W5 / §Liveness). runsRendered suppresses wiping the list on
// a transient poll blip: a first-load failure surfaces the error, a
// mid-poll failure keeps the last-good fleet visible.
let runsRendered = false;

// showRuns renders immediately then polls until the view is left.
function showRuns() {
  renderRuns();
  runsTimer = setInterval(renderRuns, 2500);
}

// stopRunsPoll halts the fleet poll; route() calls it on every navigation
// so the timer never outlives the Runs view.
function stopRunsPoll() {
  if (runsTimer) { clearInterval(runsTimer); runsTimer = null; }
}

async function renderRuns() {
  let runs = [];
  try {
    const r = await fetch('/pipelines');
    if (!r.ok) throw new Error('status ' + r.status);
    runs = (await r.json()).pipelines || [];
  } catch (e) {
    // A poll blip keeps the last-rendered fleet; only a first load with
    // nothing to keep surfaces the error.
    if (!runsRendered) $('run-list').innerHTML = errorState('server unreachable');
    return;
  }
  runsRendered = true;
  renderRunCounts(runs);
  if (!runs.length) { $('run-list').innerHTML = emptyState('no runs yet'); return; }
  const rows = runs.map(runRowHtml).join('');
  $('run-list').innerHTML = `<table>
    <thead><tr><th>run</th><th>workflow</th><th>item</th><th>status</th><th>started</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

// renderRunCounts fills the counts bar with the four fleet states
// (running/queued/needs-human/failed). needs-human comes from the summary's
// needs_human flag, not a status — a blocked run is still "running". An
// empty fleet clears the bar (.counts:empty then hides it).
function renderRunCounts(runs) {
  const el = $('run-counts');
  if (!runs.length) { el.innerHTML = ''; return; }
  const byStatus = (s) => runs.filter(p => p.status === s).length;
  el.innerHTML =
    countPill('running', byStatus('running')) +
    countPill('queued', byStatus('queued')) +
    countPill('needs-human', runs.filter(runNeedsHuman).length) +
    countPill('failed', byStatus('failed'));
}

// countPill renders one state count; a non-zero needs-human pill fills
// (loud) rather than outlines — the highest-attention treatment.
function countPill(state, n) {
  const loud = state === 'needs-human' && n ? ' loud' : '';
  return `<span class="count count-${state}${loud}">${n} ${escapeHtml(state)}</span>`;
}

// fmtDate renders an ISO timestamp as a compact relative time ("2m ago",
// "3h ago", "Jul 28") with the full local timestamp on hover. Empty or
// unparseable input yields a muted em dash rather than a raw nanosecond
// string.
function fmtDate(iso) {
  if (!iso) return '<span class="muted">—</span>';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return escapeHtml(iso);
  const secs = (Date.now() - d.getTime()) / 1000;
  let rel;
  if (secs < 0) rel = 'just now';
  else if (secs < 60) rel = Math.floor(secs) + 's ago';
  else if (secs < 3600) rel = Math.floor(secs / 60) + 'm ago';
  else if (secs < 86400) rel = Math.floor(secs / 3600) + 'h ago';
  else if (secs < 7 * 86400) rel = Math.floor(secs / 86400) + 'd ago';
  else rel = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const full = d.toLocaleString(undefined,
    { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  return `<span title="${escapeHtml(full)}">${escapeHtml(rel)}</span>`;
}

// fmtDuration renders a stage's elapsed time (web-ui-v2-spec U2). No start is
// the em-dash placeholder; a start with no end is a still-running stage;
// otherwise it is end-minus-start as "N.Ns" under a minute, "Nm SSs" above.
function fmtDuration(startIso, endIso) {
  if (!startIso) return '<span class="muted">—</span>';
  if (!endIso) return '<span class="muted">running…</span>';
  const ms = new Date(endIso).getTime() - new Date(startIso).getTime();
  if (isNaN(ms)) return '<span class="muted">—</span>';
  const secs = Math.max(0, ms) / 1000;
  if (secs < 60) return escapeHtml(secs.toFixed(1) + 's');
  const m = Math.floor(secs / 60), s = Math.floor(secs % 60);
  return escapeHtml(`${m}m ${String(s).padStart(2, '0')}s`);
}

// runRowHtml builds one fleet row: the run (id → #run/<id>) alongside its
// provenance backlinks (web-ui-spec W6) — the workflow it ran (→ #workflow/
// <name>) and the item it was dispatched for (→ #items). Every
// attacker-controlled field (workflow_name, item_ref, status come from the
// DOT source / external item) is escaped before it reaches innerHTML;
// navigation is pure-hash so no inline JS carries the id. A live blocked run
// carries the loud needs-human chip — the fleet's highest-attention flag.
function runRowHtml(p) {
  const chip = runNeedsHuman(p) ? '<span class="chip needs-human">needs human</span>' : '';
  const id = p.id || '';
  return `
    <tr>
      <td><a href="#run/${escapeHtml(id)}" title="${escapeHtml(id)}">${escapeHtml(id.slice(0, 8) || id)}</a></td>
      <td class="muted">${runWorkflowCell(p)}</td>
      <td class="muted">${runItemCell(p)}</td>
      <td><span class="status ${escapeHtml(p.status)}">${escapeHtml(p.status)}</span>${chip}</td>
      <td class="muted">${fmtDate(p.started_at)}</td>
      <td>${runCancelButton(p)}</td>
    </tr>`;
}

// runWorkflowCell links a run back to its workflow definition. workflow_name
// is the catalog dir the run was dispatched from — the exact handle
// #workflow/<name> resolves. A raw dot run (POST /pipelines) has none, so it
// falls back to the graph_name (the DOT digraph id) as plain text: there is
// no catalog entry to link to.
function runWorkflowCell(p) {
  const name = p.workflow_name || '';
  if (name) return `<a href="#workflow/${encodeURIComponent(name)}">${escapeHtml(name)}</a>`;
  return escapeHtml(p.graph_name || '');
}

// runItemCell links a run back to its source item. There is no per-item hash
// route in v1, so the link lands on the Items view (where the item's own row
// links back to this run — web-ui-spec §Views interlinking); the full ref is
// the title. A run with no item ref shows nothing.
function runItemCell(p) {
  const ref = p.item_ref || '';
  if (!ref) return '';
  return `<a href="#items" title="${escapeHtml(ref)}">${escapeHtml(ref)}</a>`;
}

// runCancelButton renders a cancel trigger for a live run only; a terminal
// run (completed/failed/cancelled) has nothing to cancel. The run id rides
// on a data-* attribute (escaped) rather than an inline onclick, matching
// the page's no-inline-JS convention; a delegated click on #run-list fires
// the cancel (web-ui-spec §Runs view).
function runCancelButton(p) {
  if (isTerminal(p)) return '';
  return `<button data-cancel data-cancel-id="${escapeHtml(p.id)}">cancel</button>`;
}

// isTerminal reports whether a run has finished. A terminal run offers no
// cancel, and cannot be waiting on a human — so cancelling a needs-human
// run clears its flag on the next poll rather than leaving it nagging.
function isTerminal(p) {
  return p.status === 'completed' || p.status === 'failed' || p.status === 'cancelled';
}

// runNeedsHuman gates the needs-human flag on the run still being live, so
// a finished run whose question was never formally answered (e.g. it was
// cancelled mid-wait) stops flagging in the fleet counts and rows.
function runNeedsHuman(p) {
  return !!p.needs_human && !isTerminal(p);
}

// cancelRun confirms then POSTs /pipelines/{id}/cancel. It does not
// optimistically mutate the row — the ~2.5s poll re-reflects the run's true
// state (cancellation is best-effort server-side), so a failed cancel
// simply shows the run still running on the next tick.
async function cancelRun(id) {
  if (!id || !confirm('Cancel this run?')) return;
  try {
    await postJSON(`/pipelines/${id}/cancel`, {});
  } catch (e) { /* transient; the next poll re-reflects the true state */ }
  renderRuns();
}

// ---- run view ----------------------------------------------------------
async function openRun(id) {
  teardownRun();
  currentRun = id;
  selectedNode = null;
  for (const k in nodeLog) delete nodeLog[k];
  for (const k in nodeState) delete nodeState[k];
  for (const k in nodeTiming) delete nodeTiming[k];
  timeline.length = 0;
  highlightNav('runs');
  showView('run-view');
  $('run-title').textContent = id;
  $('run-failure').innerHTML = '';
  if ($('tl-text')) $('tl-text').value = '';
  if ($('tl-kind')) $('tl-kind').value = '';
  renderTimeline();
  $('node-pane').innerHTML = '<p class="muted">Click a node to inspect it.</p>';
  await loadGraph(id);
  attachStream(id);
  if (dockTimer) clearInterval(dockTimer);
  refreshDock();
  dockTimer = setInterval(refreshDock, 3000);
}

async function loadGraph(id) {
  try {
    const r = await fetch(`/pipelines/${id}/graph`);
    $('graph').innerHTML = r.ok ? await r.text() : errorState('graph unavailable');
  } catch (e) { $('graph').innerHTML = errorState('graph unavailable'); return; }
  // Make each graphviz node clickable; its DOT id lives in <title>.
  $('graph').querySelectorAll('g.node').forEach(g => {
    const id = g.querySelector('title')?.textContent;
    if (!id) return;
    g.addEventListener('click', () => selectNode(id));
    if (nodeState[id]) paintNode(id, nodeState[id]);
  });
}

// paintNode colours a graphviz node's shape by status.
function paintNode(id, cls) {
  nodeState[id] = cls;
  const g = [...$('graph').querySelectorAll('g.node')]
    .find(g => g.querySelector('title')?.textContent === id);
  if (!g) return;
  const color = { running: 'var(--state-running)', completed: 'var(--state-success)',
                  failed: 'var(--state-failed)', retrying: 'var(--state-retrying)' }[cls];
  g.classList.toggle('pulse', cls === 'running');
  g.querySelectorAll('polygon, ellipse, path').forEach(shape => {
    if (color) shape.setAttribute('stroke', color);
  });
}

function attachStream(id) {
  if (es) es.close();
  es = new EventSource(`/pipelines/${id}/events`);
  // Idempotent replay: every (re)connect replays the run's full history
  // from the start before live events. `applied` counts events already
  // handled for this run; `pos` is the position within the current
  // connection's stream (reset on each open). Events at or below `applied`
  // were seen on an earlier connection, so skip them — otherwise a mid-run
  // reconnect re-appends every node-log chunk.
  let applied = 0, pos = 0;
  es.onopen = () => { pos = 0; };
  const on = (kind, fn) => es.addEventListener(kind, e => {
    pos++;
    if (pos <= applied) return;
    applied = pos;
    fn(JSON.parse(e.data));
  });
  // Record each stage's start/end from the stream so the inspector can show
  // elapsed time without a timing field on GET …/stages/{node}.
  const timing = (id) => (nodeTiming[id] = nodeTiming[id] || {});
  // On a terminal event, close the stream. The server ends the SSE
  // connection for finished runs, so leaving it open lets EventSource
  // reconnect every few seconds and replay the whole history again,
  // duplicating node-log chunks each time.
  const done = () => { if (es) es.close(); renderDock([]); refreshDock(); };
  // Every kind is registered through one table so a single dispatch point
  // handles the run (kinds with no side-effect map to null). Registering all
  // of them keeps the applied/pos replay cursor authoritative for the whole
  // stream — the U3 timeline recorder hangs off this same dispatch.
  const HANDLERS = {
    stage_started:   ev => { timing(ev.node_id).start = ev.ts; paintNode(ev.node_id, 'running'); },
    stage_completed: ev => { timing(ev.node_id).end = ev.ts; paintNode(ev.node_id, 'completed'); },
    stage_failed:    ev => { timing(ev.node_id).end = ev.ts; paintNode(ev.node_id, 'failed'); },
    stage_retrying:  ev => paintNode(ev.node_id, 'retrying'),
    stage_progress:  ev => appendProgress(ev),
    pipeline_completed: done,
    pipeline_failed:    ev => { $('run-failure').innerHTML = failureBannerHtml(ev.message); done(); },
  };
  // Every event runs its kind's side-effect (if any) and — unless it is a
  // high-frequency kind (TIMELINE_SKIP) — lands in the U3 timeline. One
  // dispatch keeps the applied/pos cursor authoritative for both.
  for (const kind of EVENT_KINDS) {
    const fn = HANDLERS[kind];
    const record = !TIMELINE_SKIP.has(kind);
    on(kind, ev => { if (record) recordTimelineEvent(kind, ev); if (fn) fn(ev); });
  }
  es.onerror = () => { /* transient; EventSource retries on its own */ };
}

// appendProgress records assistant_delta / tool_call chunks per node.
function appendProgress(ev) {
  const node = ev.node_id; if (!node) return;
  const kind = ev.detail && ev.detail.kind;
  let html = '';
  if (kind === 'assistant_delta') html = escapeHtml(ev.message || '');
  else if (kind === 'tool_call') {
    const name = (ev.detail && ev.detail.tool_name) || 'tool';
    html = `<span class="tool">[${escapeHtml(name)}] ${escapeHtml(ev.message || '')}</span>\n`;
  } else if (ev.message) html = escapeHtml(ev.message) + '\n';
  if (!html) return;
  (nodeLog[node] = nodeLog[node] || []).push(html);
  if (node === selectedNode) {
    const log = $('node-log');
    if (log) { log.innerHTML += html; log.scrollTop = log.scrollHeight; }
  }
}

// recordTimelineEvent appends one streamed event to the run's event log and
// its row to the timeline (web-ui-v2-spec U3). Appending a single row keeps a
// run of N events at O(N) total work — a full renderTimeline() rebuild per
// event would be O(N^2) and freeze the main thread on any real run.
function recordTimelineEvent(kind, ev) {
  timeline.push({ kind, ev });
  appendTimelineRow(kind, ev);
}

// appendTimelineRow adds one event's row to #tl-rows when it passes the active
// filter, clearing the empty-state placeholder on the first row and following
// the tail. Full-rebuild paths (filter change, run reset) go through
// renderTimeline instead.
function appendTimelineRow(kind, ev) {
  const rows = $('tl-rows');
  if (!rows) return;
  if (!eventMatchesFilter(kind, ev, timelineFilter())) return;
  if (rows.querySelector('.state')) rows.innerHTML = '';
  rows.insertAdjacentHTML('beforeend', timelineRowHtml(kind, ev));
  rows.scrollTop = rows.scrollHeight;
}

// timelineFilter reads the active kind + text filter from the controls.
function timelineFilter() {
  return { kind: $('tl-kind')?.value || '', text: $('tl-text')?.value || '' };
}

// renderTimeline rebuilds #tl-rows from the recorded timeline through the
// active filter. Used on a filter change or run reset — a live event appends a
// single row (appendTimelineRow) instead. An empty result distinguishes "no
// events yet" from "filtered everything out".
function renderTimeline() {
  const rows = $('tl-rows');
  if (!rows) return;
  const f = timelineFilter();
  const html = timeline
    .filter(e => eventMatchesFilter(e.kind, e.ev, f))
    .map(e => timelineRowHtml(e.kind, e.ev))
    .join('');
  rows.innerHTML = html || emptyState(timeline.length ? 'no events match the filter' : 'no events yet');
}

// toolCallHtml renders one persisted tool_calls/*.json payload (web-ui-v2-spec
// U2): the tool name as a collapsible summary over the pretty-printed payload.
// Every field is attacker-controlled, so both label and body are escaped.
function toolCallHtml(raw) {
  const name = raw.tool_name || raw.tool || raw.hook_name || 'tool';
  let body;
  try { body = JSON.stringify(raw, null, 2); } catch (e) { body = String(raw); }
  return `<details class="tool-call"><summary>${escapeHtml(name)}</summary>` +
         `<pre>${escapeHtml(body)}</pre></details>`;
}

// eventMatchesFilter is the U3 timeline filter predicate. An empty kind keeps
// any kind; a kind keeps only that kind. An empty text keeps any event; text
// matches case-insensitively against the message and node id. Both conditions
// must hold, so kind + text narrow together.
function eventMatchesFilter(kind, ev, filter) {
  if (filter.kind && kind !== filter.kind) return false;
  const q = (filter.text || '').toLowerCase();
  if (!q) return true;
  const hay = `${ev.message || ''} ${ev.node_id || ''}`.toLowerCase();
  return hay.includes(q);
}

// failureBannerHtml renders the run header's failure reason prominently
// (web-ui-v2-spec U3): the reason is why the run failed and is the first thing
// a debugger needs. An empty reason renders nothing — a healthy run shows no
// banner. The reason is attacker-controlled and escaped.
function failureBannerHtml(reason) {
  if (!reason) return '';
  return `<p class="banner error run-failure">${escapeHtml(reason)}</p>`;
}

// timelineRowHtml renders one run event as a timeline row (web-ui-v2-spec U3):
// relative timestamp (full ISO on hover, via fmtDate), a kind badge, the node
// id when the event has one, and the message. Every field is attacker-
// controlled — kind, node and message are all escaped inert.
function timelineRowHtml(kind, ev) {
  const node = ev.node_id ? `<span class="tl-node">${escapeHtml(ev.node_id)}</span>` : '';
  const msg = ev.message ? `<span class="tl-msg">${escapeHtml(ev.message)}</span>` : '';
  return `<div class="tl-row">` +
    `<span class="tl-time">${fmtDate(ev.ts)}</span>` +
    `<span class="badge tl-kind">${escapeHtml(kind)}</span>` +
    node + msg + `</div>`;
}

// stageDetailHtml builds the U2 inspector panel from a stage's detail
// (GET …/stages/{node}) and its timing (start/end from the event stream).
// It surfaces status, elapsed time, prompt, response and each tool call, then
// the live-tail #node-log container seeded with any chunks already streamed.
// Every stage field is attacker-controlled and escaped. An empty status.json
// (stage still running) reads as "running", not blank.
function stageDetailHtml(id, detail, timing, logHtml) {
  const status = detail.status || 'running';
  const calls = (detail.tool_calls || []).map(toolCallHtml).join('');
  const section = (title, body) => body
    ? `<h4>${title}</h4><pre class="stage-text">${escapeHtml(body)}</pre>` : '';
  return `
    <h3>${escapeHtml(id)}</h3>
    <div class="stage-meta">
      <span class="badge status ${escapeHtml(status)}">${escapeHtml(status)}</span>
      <span class="muted">${fmtDuration(timing.start, timing.end)}</span>
    </div>
    ${section('Prompt', detail.prompt)}
    ${section('Response', detail.response)}
    ${calls ? `<h4>Tool calls</h4>${calls}` : ''}
    <h4>Output</h4>
    <div id="node-log">${logHtml || ''}</div>`;
}

// selectNode opens the U2 inspector for a node: fetch its stage detail
// (GET …/stages/{node}) and render it. selectedNode guards the race where a
// later click resolves before an earlier one, so a slow fetch never overwrites
// a newer selection. The live tail keeps flowing into #node-log via
// appendProgress once the panel is in place.
async function selectNode(id) {
  selectedNode = id;
  const pane = $('node-pane');
  if (pane) pane.innerHTML = loadingState();
  let detail;
  try {
    const r = await fetch(`/pipelines/${currentRun}/stages/${id}`);
    if (!r.ok) throw new Error(String(r.status));
    detail = await r.json();
  } catch (e) {
    if (selectedNode === id && pane) pane.innerHTML = errorState('stage detail unavailable');
    return;
  }
  if (selectedNode !== id) return;          // a later click won the race
  if (pane) pane.innerHTML = stageDetailHtml(id, detail, nodeTiming[id] || {}, (nodeLog[id] || []).join(''));
  const log = $('node-log'); if (log) log.scrollTop = log.scrollHeight;
}

// ---- config view -------------------------------------------------------
// The Config view edits the whole daemon-owned config doc (config-screen-
// spec C4): hand-built panels over GET /config, saved back whole via
// PUT /config. showConfig refetches on every entry (no cache — a stale or
// failure-cached config is worse than a reload) so edits made elsewhere and
// the true redaction state always show.
async function showConfig(warnings) {
  const body = $('config-body');
  body.innerHTML = loadingState();
  setConfigStatus('');
  let doc;
  try {
    const r = await fetch('/config');
    if (!r.ok) throw new Error('status ' + r.status);
    doc = await r.json();
  } catch (e) {
    body.innerHTML = errorState('could not load config');
    return;
  }
  configLoaded = doc;
  renderConfig(doc, warnings);
}

// renderConfig paints the panels from the loaded doc. Each panel is a pure
// name→HTML function so it is unit-testable via the node vm harness. Soft
// save-warnings (from a preceding PUT) are threaded to the Repos panel so
// they surface inline on the offending rows as well as in the top banner.
function renderConfig(doc, warnings) {
  linearClear = false;
  $('config-body').innerHTML =
    reposPanelHtml(doc.repos, warnings, doc.vm_images) + linearPanelHtml(doc.linear, linearClear) + providersPanelHtml(doc);
  setConfigDirty(false);
}

// setConfigStatus shows a save result above the panels: an error (structural
// rejection — nothing saved), a warning (soft — saved with caveats), or ok.
// Empty text clears it.
function setConfigStatus(text, kind) {
  const el = $('config-status');
  if (!el) return;
  el.textContent = text || '';
  el.className = text ? 'banner ' + (kind || '') : '';
}

// reposPanelHtml renders the Repos panel: one editable row per registered
// repo — owner/name, checkout path, and the standard check commands — plus
// an add-repo control. Every stored value is external to the HTML context,
// so all are escaped. The row inputs carry data-* hooks the save collector
// scrapes.
function reposPanelHtml(repos, warnings, vmImages) {
  const names = Object.keys(repos || {}).sort();
  // Empty-state hint spans every column (owner/name + path + runner + image +
  // each standard check + the remove control) so a fresh config reads as "none
  // yet, add one" rather than a bare header (config-screen-spec C5).
  const cols = 5 + STANDARD_CHECKS.length;
  const rows = names.length
    ? names.map(name => repoRowHtml(name, repos[name] || {}, repoWarning(name, warnings), vmImages)).join('')
    : `<tr data-empty-hint><td class="muted" colspan="${cols}">No repos registered — add one.</td></tr>`;
  return `<section class="config-panel card" id="config-repos">
    <h3>Repos</h3>
    <p class="muted">Registered repos and their check commands — the run-form dropdown and the check backbone read these.</p>
    <table>
      <thead><tr><th>owner/name</th><th>path</th><th>runner</th><th>image</th>${
        STANDARD_CHECKS.map(c => `<th>${escapeHtml(c)}</th>`).join('')}<th></th></tr></thead>
      <tbody id="config-repos-rows">${rows}</tbody>
    </table>
    <p><button type="button" data-repo-add>add repo</button></p>
  </section>`;
}

// repoRowHtml renders one repo row. An empty name/path (the add-repo case)
// yields a blank editable row. A non-empty warning (a soft save-warning for
// this repo, e.g. an unresolved path) surfaces inline under the path input
// so the reject-vs-warn distinction lands on the offending row, not only in
// the top banner (config-screen-spec C5).
function repoRowHtml(name, rc, warning, vmImages) {
  const checks = rc.checks || {};
  const checkCells = STANDARD_CHECKS.map(c =>
    `<td><input data-check="${escapeHtml(c)}" value="${escapeHtml(checks[c] || '')}"></td>`).join('');
  const warn = warning
    ? `<div class="config-note" data-repo-warning>⚠ ${escapeHtml(warning)}</div>` : '';
  const runner = rc.runner || '';
  return `<tr data-repo-row>
    <td><input data-repo-name value="${escapeHtml(name)}" placeholder="owner/name"></td>
    <td><input data-repo-path value="${escapeHtml(rc.path || '')}" placeholder="/path/to/checkout">${warn}</td>
    <td>${runnerSelectHtml(runner)}</td>
    <td>${imageSelectHtml((rc.vm && rc.vm.image) || '', runner, vmImages)}</td>
    ${checkCells}
    <td><button type="button" data-repo-remove title="remove repo">&times;</button></td>
  </tr>`;
}

// runnerSelectHtml renders the per-repo runner (launcher placement) select: a
// blank "(default)" — leave the daemon --runner default — plus the fixed
// direct|local|vm placements, the declared one selected. data-repo-runner is
// the save-collector hook and the change handler that toggles the row's image
// select (per-repo VM config, VM4).
function runnerSelectHtml(runner) {
  const opts = ['', 'direct', 'local', 'vm'].map(v =>
    `<option value="${escapeHtml(v)}"${v === runner ? ' selected' : ''}>${v || '(default)'}</option>`).join('');
  return `<select data-repo-runner>${opts}</select>`;
}

// imageSelectHtml renders the per-repo VM image select: a blank "(default)"
// image plus each registered vm_images name, the declared one selected. It is
// only meaningful when the runner is vm, so it is disabled otherwise (the save
// collector likewise drops the image off-vm). Names are external → escaped.
// isNonVMPlacement reports an EXPLICIT non-vm runner (direct|local), where a
// vm.image is meaningless. An unset runner is not one — it inherits the
// daemon default, which may be vm (per-repo VM config, VM4).
function isNonVMPlacement(runner) {
  return runner === 'direct' || runner === 'local';
}

function imageSelectHtml(image, runner, vmImages) {
  const names = Object.keys(vmImages || {}).sort();
  // The registry is nix/CLI-managed and drifts independently of the config, so
  // a repo may be pinned to an image no longer registered — still a valid
  // persisted ref (dispatch falls back to default). Union it in so the select
  // represents and round-trips the stored value instead of collapsing it to
  // (default) and wiping the pin on save (per-repo VM config, VM4).
  if (image && !names.includes(image)) names.push(image);
  const opts = [''].concat(names).map(v =>
    `<option value="${escapeHtml(v)}"${v === image ? ' selected' : ''}>${v ? escapeHtml(v) : '(default)'}</option>`).join('');
  // Editable unless an explicit non-vm placement — an unset runner inherits
  // the daemon default (which may be vm), so a pin is meaningful there too.
  const dis = isNonVMPlacement(runner) ? ' disabled' : '';
  return `<select data-repo-image${dis}>${opts}</select>`;
}

// repoWarning finds the soft save-warning for a repo, matching the backend's
// `repo %q:` prefix (config Validate) so the quoted name delimits the match
// — a same-prefixed sibling ("a/bc") does not steal "a/b"'s warning. Returns
// the warning string, or '' when none applies.
function repoWarning(name, warnings) {
  const prefix = `repo "${name}":`;
  return (warnings || []).find(w => String(w).startsWith(prefix)) || '';
}

// linearPanelHtml renders the Linear secret panel: the key's set/unset
// state (never the value — GET /config redacts it), a secret input that
// replaces the stored key only when non-empty, and a Clear control shown
// only when a key is stored (nothing to clear otherwise). armedClear
// reflects a pending Clear: the input is disabled, the note announces the
// clear, and the control flips to an undo — so arming is a re-render, not a
// one-way DOM mutation.
function linearPanelHtml(linear, armedClear) {
  const set = !!(linear && linear.api_key_set);
  const armed = set && !!armedClear;
  return `<section class="config-panel card" id="config-linear">
    <h3>Linear</h3>
    <p class="muted">API key for the Linear item source — status <strong>${set ? 'set' : 'unset'}</strong>. The stored key is never shown.</p>
    <label>API key <input type="password" id="config-linear-key"${armed ? ' disabled' : ''} placeholder="${
      set ? 'leave blank to keep the stored key' : 'enter a key'}"></label>
    <p>${set ? `<button type="button" data-linear-clear>${armed ? 'keep key' : 'clear key'}</button> ` : ''}<span id="config-linear-note" class="config-note">${
      armed ? 'key will be cleared on save' : ''}</span></p>
  </section>`;
}

// providersPanelHtml renders the Providers panel: the default-provider
// choice plus an editable row per provider (backend / command / model_env).
// Providers are startup-built, so a restart note flags that edits apply
// only after the daemon restarts (config-screen-spec effect timing).
function providersPanelHtml(doc) {
  const providers = (doc && doc.providers) || {};
  const def = (doc && doc.default_provider) || '';
  const names = Object.keys(providers).sort();
  const options = names.map(n =>
    `<option value="${escapeHtml(n)}"${n === def ? ' selected' : ''}>${escapeHtml(n)}</option>`).join('');
  // Empty-state hint spans provider + backend + command + model_env + the
  // remove control (C5 empty states).
  const rows = names.length
    ? names.map(n => providerRowHtml(n, providers[n] || {})).join('')
    : `<tr data-empty-hint><td class="muted" colspan="5">No providers configured — add one.</td></tr>`;
  return `<section class="config-panel card" id="config-providers">
    <h3>Providers</h3>
    <p class="muted">Agent backends the router dispatches to.</p>
    <p class="config-note">Editing providers takes effect only after a daemon restart.</p>
    <label>default provider
      <select id="config-default-provider"><option value=""${def ? '' : ' selected'}>(none — simulate bare runs)</option>${options}</select>
    </label>
    <table>
      <thead><tr><th>provider</th><th>backend</th><th>command</th><th>model_env</th><th></th></tr></thead>
      <tbody id="config-providers-rows">${rows}</tbody>
    </table>
    <p><button type="button" data-provider-add>add provider</button></p>
  </section>`;
}

// providerRowHtml renders one provider row; a blank name is the add case.
function providerRowHtml(name, p) {
  return `<tr data-provider-row>
    <td><input data-provider-name value="${escapeHtml(name)}" placeholder="name"></td>
    <td><input data-provider-backend value="${escapeHtml(p.backend || '')}" placeholder="acp|claudecode|simulation"></td>
    <td><input data-provider-command value="${escapeHtml(p.command || '')}"></td>
    <td><input data-provider-model-env value="${escapeHtml(p.model_env || '')}"></td>
    <td><button type="button" data-provider-remove title="remove provider">&times;</button></td>
  </tr>`;
}

// onConfigClick handles every panel's delegated add/remove/clear — the
// panels are innerHTML so a single listener on the view drives each row's
// control (matching the items/run-list convention).
function onConfigClick(e) {
  if (e.target.closest('button[data-repo-add]')) {
    const rows = $('config-repos-rows');
    if (rows) {
      rows.querySelectorAll('tr[data-empty-hint]').forEach(r => r.remove());
      rows.insertAdjacentHTML('beforeend', repoRowHtml('', {}, '', (configLoaded && configLoaded.vm_images) || {}));
    }
    return;
  }
  const rmRepo = e.target.closest('button[data-repo-remove]');
  if (rmRepo) { rmRepo.closest('tr[data-repo-row]').remove(); return; }
  if (e.target.closest('button[data-provider-add]')) {
    const rows = $('config-providers-rows');
    if (rows) {
      rows.querySelectorAll('tr[data-empty-hint]').forEach(r => r.remove());
      rows.insertAdjacentHTML('beforeend', providerRowHtml('', {}));
    }
    return;
  }
  const rmProv = e.target.closest('button[data-provider-remove]');
  if (rmProv) { rmProv.closest('tr[data-provider-row]').remove(); return; }
  if (e.target.closest('button[data-linear-clear]')) {
    // Toggle the pending clear and re-render just the Linear panel from the
    // redacted load state, so arming is reversible ("keep key" un-arms) and
    // in-progress repo/provider edits elsewhere are left untouched.
    linearClear = !linearClear;
    setConfigDirty(true);
    const panel = $('config-linear');
    if (panel && configLoaded) panel.outerHTML = linearPanelHtml(configLoaded.linear, linearClear);
  }
}

// onConfigChange handles delegated select changes: a runner select flipping
// to/from vm enables/disables that row's image select (the image is only
// meaningful under a vm runner — dispatch resolution §2). It also marks the
// view dirty, since select changes don't fire the input listener in every
// browser.
function onConfigChange(e) {
  setConfigDirty(true);
  const runnerSel = e.target.closest('select[data-repo-runner]');
  if (!runnerSel) return;
  const img = runnerSel.closest('tr[data-repo-row]')?.querySelector('select[data-repo-image]');
  if (img) img.disabled = isNonVMPlacement(runnerSel.value);
}

// setConfigDirty tracks unsaved edits so the user sees the view has pending
// changes; a successful save (or a fresh render) clears it.
function setConfigDirty(dirty) {
  configDirty = dirty;
  const el = $('config-dirty');
  if (el) el.textContent = dirty ? 'unsaved changes' : '';
}

// collectConfig scrapes the panels' inputs into a plain form object. Non-
// standard checks a repo may carry (e.g. e2e) are not shown as columns, so
// they are seeded from the loaded doc keyed by the row's current name and
// preserved on save — only the four standard checks are edited here.
function collectConfig() {
  const loaded = (configLoaded && configLoaded.repos) || {};
  const repos = [...document.querySelectorAll('#config-repos-rows tr[data-repo-row]')].map(tr => {
    const name = tr.querySelector('[data-repo-name]').value.trim();
    const checks = { ...((loaded[name] && loaded[name].checks) || {}) };
    tr.querySelectorAll('input[data-check]').forEach(inp => {
      const v = inp.value.trim();
      if (v) checks[inp.dataset.check] = v; else delete checks[inp.dataset.check];
    });
    return {
      name, path: tr.querySelector('[data-repo-path]').value.trim(), checks,
      runner: tr.querySelector('[data-repo-runner]').value,
      image: tr.querySelector('[data-repo-image]').value,
    };
  });
  const providers = [...document.querySelectorAll('#config-providers-rows tr[data-provider-row]')].map(tr => ({
    name: tr.querySelector('[data-provider-name]').value.trim(),
    backend: tr.querySelector('[data-provider-backend]').value.trim(),
    command: tr.querySelector('[data-provider-command]').value.trim(),
    model_env: tr.querySelector('[data-provider-model-env]').value.trim(),
  }));
  return {
    defaultProvider: $('config-default-provider').value,
    providers, repos,
    linearKey: $('config-linear-key').value,
    linearClear,
  };
}

// buildPutBody reshapes the collected form into the PUT /config Document:
// provider/repo rows become maps (blank-name rows dropped), and the Linear
// secret follows secret-merge — an empty key is sent empty (preserve), a
// value replaces, an armed clear sets api_key_clear (the distinct clear).
function buildPutBody(form) {
  const providers = {};
  for (const p of form.providers) {
    if (!p.name) continue;
    providers[p.name] = { backend: p.backend, command: p.command, model_env: p.model_env };
  }
  const repos = {};
  for (const r of form.repos) {
    if (!r.name) continue;
    const rc = { path: r.path, checks: r.checks || {} };
    // A declared runner rides as a field; an unset runner emits no key,
    // keeping an untouched config byte-unchanged. The vm.image pin is kept
    // unless the runner is an EXPLICIT non-vm placement — an unset runner
    // inherits the daemon default, which may be vm, so the pin stays a valid
    // value there (dispatch resolves the image on the effective runner —
    // spec §Dispatch resolution). Dropping it on a blank runner would wipe a
    // legitimate pin.
    if (r.runner) rc.runner = r.runner;
    if (r.image && r.runner !== 'direct' && r.runner !== 'local') rc.vm = { image: r.image };
    repos[r.name] = rc;
  }
  const linear = { api_key: form.linearKey || '' };
  if (form.linearClear) linear.api_key_clear = true;
  // vm_images is deliberately not sent: it is server-owned (nix/CLI-managed),
  // the server preserves it across a PUT that omits it, and echoing a stale
  // GET snapshot would revert a concurrent registry edit (per-repo VM config,
  // VM4).
  return { default_provider: form.defaultProvider || '', providers, repos, linear };
}

// saveMessage classifies the PUT /config response into a banner: a 422 is a
// structural rejection (nothing saved), a 200 with warnings saved softly, a
// clean 200 saved, anything else a generic failure.
function saveMessage(status, body) {
  if (status === 200) {
    const warnings = (body && body.warnings) || [];
    if (warnings.length) return { kind: 'warn', text: 'Saved with warnings: ' + warnings.join('; ') };
    return { kind: 'ok', text: 'Saved.' };
  }
  if (status === 422 && body && body.error) return { kind: 'error', text: body.error };
  return { kind: 'error', text: `Save failed (${status}).` };
}

// saveConfig PUTs the whole doc. A structural rejection (422) keeps the
// user's edits on screen — nothing was saved, so re-reading would discard
// them. A success re-reads from the server (reflecting redaction and
// clearing the pending-clear/dirty state) before showing the result.
let configSaving = false;
async function saveConfig() {
  if (!configLoaded || configSaving) return;   // no save before a successful load
  configSaving = true;
  const btn = $('config-save');
  if (btn) btn.disabled = true;
  setConfigStatus('saving…', '');
  try {
    let r;
    try {
      r = await putJSON('/config', buildPutBody(collectConfig()));
    } catch (e) { setConfigStatus('could not reach the daemon', 'error'); return; }
    let body = {};
    try { body = await r.json(); } catch (e) { /* an error body may not be JSON */ }
    const msg = saveMessage(r.status, body);
    // Re-render from server truth (reflects redaction, clears dirty), carrying
    // the soft warnings so they land inline on the offending repo rows too.
    if (r.status === 200) await showConfig((body && body.warnings) || []);
    setConfigStatus(msg.text, msg.kind);
  } finally {
    configSaving = false;
    if (btn) btn.disabled = false;
  }
}

// ---- wait.human dock ---------------------------------------------------
async function refreshDock() {
  if (!currentRun) return;
  try {
    const r = await fetch(`/pipelines/${currentRun}/questions`);
    renderDock((await r.json()).questions || []);
  } catch (e) { /* transient; retried on next tick */ }
}

// renderDock builds the wait.human dock via DOM + listeners rather than
// interpolating question text into an HTML string: option labels can
// contain quotes that would otherwise break an inline onclick attribute.
function renderDock(questions) {
  const dock = $('human-dock');
  dock.textContent = '';
  if (!questions.length) return;
  const h = document.createElement('h3'); h.textContent = 'open questions';
  dock.appendChild(h);
  questions.forEach(q => {
    const box = document.createElement('div'); box.className = 'q';
    const label = document.createElement('div');
    label.textContent = (q.text || '') + ' ';
    const who = document.createElement('span'); who.className = 'muted';
    who.textContent = '(' + (q.node_id || '') + ')';
    label.appendChild(who);
    box.appendChild(label);
    if ((q.options || []).length) {
      q.options.forEach(o => {
        const b = document.createElement('button');
        b.textContent = o.label;
        b.addEventListener('click', () => answer(q.id, { key: o.key, label: o.label }));
        box.appendChild(b); box.appendChild(document.createTextNode(' '));
      });
    } else {
      const input = document.createElement('input'); input.placeholder = 'answer';
      const send = document.createElement('button'); send.textContent = 'send';
      send.addEventListener('click', () => answer(q.id, { text: input.value }));
      box.appendChild(input); box.appendChild(document.createTextNode(' ')); box.appendChild(send);
    }
    dock.appendChild(box);
  });
}

// postJSON POSTs a JSON body and returns the raw Response, leaving status
// handling to the caller.
function postJSON(url, body) {
  return fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}

// putJSON PUTs a JSON body and returns the raw Response (the Config view's
// whole-doc save), leaving status handling to the caller.
function putJSON(url, body) {
  return fetch(url, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}

async function answer(qid, body) {
  await postJSON(`/pipelines/${currentRun}/questions/${qid}/answer`, body);
  refreshDock();
}

// ---- shared placeholders -----------------------------------------------
// One visual language for the three non-content states every list/pane can
// land in (web-ui-v2-spec U1): an empty result, an in-flight load, and a
// failure — each reads differently. Pure helpers returning inert markup; the
// message is escaped because some carry backend/error text.
function emptyState(msg) {
  return `<p class="state state-empty">${escapeHtml(msg)}</p>`;
}
function loadingState(msg) {
  return `<p class="state state-loading pulse" aria-busy="true">${escapeHtml(msg || 'loading…')}</p>`;
}
function errorState(msg) {
  return `<p class="state state-error" role="alert">${escapeHtml(msg)}</p>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---- boot --------------------------------------------------------------
window.addEventListener('load', () => {
  syncToggle();
  // Toolbar controls re-render from the cached merged set — no refetch.
  for (const id of ['items-filter-source', 'items-filter-type', 'items-filter-repo',
                    'items-filter-progress', 'items-group']) {
    $(id)?.addEventListener('change', renderItems);
  }
  $('items-filter-text')?.addEventListener('input', renderItems);
  $('workflow-expand')?.addEventListener('change', renderWorkflowGraph);
  // Event-timeline filters (web-ui-v2-spec U3): seed the kind dropdown from the
  // known kinds, then re-render on either control changing.
  const kindSel = $('tl-kind');
  if (kindSel) for (const k of EVENT_KINDS) kindSel.insertAdjacentHTML('beforeend', `<option value="${k}">${k}</option>`);
  $('tl-kind')?.addEventListener('change', renderTimeline);
  $('tl-text')?.addEventListener('input', renderTimeline);
  // Delegated run trigger: item rows are innerHTML, so a single listener on
  // the list opens the picker for whichever row's run button was clicked.
  $('items-list')?.addEventListener('click', e => {
    const btn = e.target.closest('button[data-run]');
    if (btn) openRunPicker(btn);
  });
  // Delegated cancel trigger: run rows are innerHTML (and re-rendered every
  // poll tick), so a single listener on the list handles whichever row's
  // cancel button was clicked.
  $('run-list')?.addEventListener('click', e => {
    const btn = e.target.closest('button[data-cancel]');
    if (btn) cancelRun(btn.dataset.cancelId);
  });
  // Delegated Config controls: panels are innerHTML, so one listener on the
  // view handles add/remove/clear for every row; a second marks the view
  // dirty on any field edit.
  $('config-view')?.addEventListener('click', onConfigClick);
  $('config-view')?.addEventListener('input', () => setConfigDirty(true));
  $('config-view')?.addEventListener('change', onConfigChange);
  $('config-save')?.addEventListener('click', saveConfig);
  $('run-picker-cancel')?.addEventListener('click', () => $('run-picker').close());
  $('run-picker-run')?.addEventListener('click', submitRun);
  // A full unload (reload / close / external nav) bypasses the hash router,
  // so guard it too: the browser shows its native leave prompt when the
  // Config view has unsaved edits.
  window.addEventListener('beforeunload', (e) => {
    if (activeView === 'config-view' && configDirty) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('hashchange', route);
  route();
});
</script>
