    // Plan-at-gate (U5): a gate reviews the output of the node before it, so
    // show that node's produced text inline — the user sees what they approve.
    const preceding = gatePreceding[q.node_id];
    if (preceding) box.appendChild(gatePlanPanel(preceding));
    if ((q.options || []).length) {
      // Optional feedback attached to the choice — especially "why" on reject.
      // Rides the answer as text (server AnswerPayload.Text -> $context.human.note).
      const note = document.createElement('textarea');
      note.className = 'gate-note'; note.rows = 2;
      note.placeholder = 'optional note (e.g. why you’re revising)';
      const opts = document.createElement('div'); opts.className = 'q-opts';
      q.options.forEach(o => {
        const b = document.createElement('button');
        b.textContent = o.label;
        b.addEventListener('click', () => answer(q.id, gateAnswer(o, null, note.value)));
        opts.appendChild(b); opts.appendChild(document.createTextNode(' '));
      });
      box.appendChild(note);
      box.appendChild(opts);
    } else {
      const input = document.createElement('input'); input.placeholder = 'answer';
      const send = document.createElement('button'); send.textContent = 'send';
      send.addEventListener('click', () => answer(q.id, gateAnswer(null, input.value)));
      box.appendChild(input); box.appendChild(document.createTextNode(' ')); box.appendChild(send);
    }
    dock.appendChild(box);
  });
}

// gatePlanPanel renders a collapsible showing the output of the node a gate
// reviews (plan-at-gate, U5). The body is lazy-filled from GET …/stages/{node}
// so the dock poll doesn't refetch it every tick; the node id names it.
function gatePlanPanel(nodeId) {
  const det = document.createElement('details'); det.className = 'gate-plan';
  const sum = document.createElement('summary');
  sum.textContent = 'Show ' + nodeId + ' output';
  const pre = document.createElement('pre');
  pre.className = 'stage-text overflow-x-auto'; pre.textContent = 'Loading…';
  det.appendChild(sum); det.appendChild(pre);
  let loaded = false;
  det.addEventListener('toggle', () => {
    if (!det.open || loaded) return;
    loaded = true;
    loadGatePlan(nodeId, pre);
  });
  return det;
}

// loadGatePlan fills a plan panel's body with the node's produced text — its
// response, falling back to the prose reconstructed from the event stream
// (VM runs keep stage files on the guest's disk, so the daemon's stages
// endpoint 404s; the streamed events are the only daemon-side copy), then
// the prompt, then a plain note. Every field is attacker-controlled and
// lands via textContent (inert).
async function loadGatePlan(nodeId, pre) {
  const streamed = (nodeProse[nodeId] || []).join('');
  try {
    const r = await fetch(`/pipelines/${currentRun}/stages/${nodeId}`);
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json();
    pre.textContent = d.response || streamed || d.prompt ||
      '(no output captured for this node)';
  } catch (e) {
    pre.textContent = streamed || 'output unavailable';
  }
}

// postJSON POSTs a JSON body and returns the raw Response, leaving status
// handling to the caller.
function postJSON(url, body) {
  return fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}

// putJSON PUTs a JSON body and returns the raw Response (the Config view's
// whole-doc save), leaving status handling to the caller.
function putJSON(url, body) {
  return fetch(url, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}

// gateAnswer builds the answer POST body (server AnswerPayload). A chosen
// option carries key+label (→ AnswerChoice); free text carries text only
// (→ AnswerText). Values ride as plain data, never interpolated into markup —
// the reason renderDock builds the dock via DOM rather than an HTML string.
function gateAnswer(option, text, note) {
  if (option) {
    const payload = { key: option.key, label: option.label };
    // An optional note rides a choice as text; omitted when blank so a plain
    // approval stays a bare key+label payload.
    if (note) payload.text = note;
    return payload;
  }
  return { text: text || '' };
}

async function answer(qid, body) {
  // Capture the human's choice for the feed's answer bubble: a chosen option
  // carries key+label with the note as text; free text carries text only. The
  // event stream's interview_answered records no answer content, so this live
  // capture is the only source of the note (a replayed run derives just the
  // chosen option label from the edge it took).
  feAnswers[qid] = body.label
    ? { label: body.label, note: body.text || '' }
    : { label: body.text || 'answered', note: '' };
  await postJSON(`/pipelines/${currentRun}/questions/${qid}/answer`, body);
  refreshDock();
}

// ---- shared placeholders -----------------------------------------------
// One visual language for the three non-content states every list/pane can
// land in (web-ui-v2-spec U1): an empty result, an in-flight load, and a
// failure — each reads differently. Pure helpers returning inert markup; the
// message is escaped because some carry backend/error text.
// stateBadge renders a run-state pill: the Tailwind Plus badge shape
// (badges.html — inline-flex, rounded, inset ring) carrying its per-state
// colour through the existing `.status.<state>` token rule, so one colour maps
// to each run state and light/dark tracks (ui-tailwind-spec T6a). The ring
// inherits `currentColor` (the state colour), tinted; the surface stays
// neutral. label defaults to the state word; href turns it into a link (the
// Items view tints a run-id link by its run state). All three are escaped.
function stateBadge(status, label, href) {
  const s = escapeHtml(status || '');
  const text = escapeHtml(label != null ? label : (status || ''));
  const cls = `status ${s} inline-flex items-center rounded-md bg-surface-1 ` +
    `px-2 py-1 text-sm font-medium ring-1 ring-inset ring-current/25`;
  return href
    ? `<a class="${cls}" href="${escapeHtml(href)}" title="${s}">${text}</a>`
    : `<span class="${cls}">${text}</span>`;
}
function emptyState(msg) {
  return `<p class="state state-empty">${escapeHtml(msg)}</p>`;
}
// emptyPanel is the Tailwind Plus empty-state (empty-state.html) remapped to
// the UI tokens: a centred icon, heading and optional subtext for a primary
// empty view (the Items and Runs lists). The stock gray icon/subtext become
// text-muted and the heading text-ink so light/dark tracks. Both strings are
// escaped. Minor placeholders keep the one-line emptyState.
function emptyPanel(title, sub) {
  return `<div class="state-empty text-center">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" class="mx-auto size-12 text-muted">
      <path d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <h3 class="mt-2 text-sm font-semibold text-ink">${escapeHtml(title)}</h3>
    ${sub ? `<p class="mt-1 text-sm text-muted">${escapeHtml(sub)}</p>` : ''}
  </div>`;
}
function loadingState(msg) {
  return `<p class="state state-loading pulse" aria-busy="true">${escapeHtml(msg || 'loading…')}</p>`;
}
function errorState(msg) {
  return `<p class="state state-error" role="alert">${escapeHtml(msg)}</p>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---- boot --------------------------------------------------------------
window.addEventListener('load', () => {
  syncToggle();
  // Toolbar controls re-render from the cached merged set — no refetch.
  for (const id of ['items-filter-source', 'items-filter-type', 'items-filter-repo',
                    'items-filter-progress', 'items-group']) {
    $(id)?.addEventListener('change', renderItems);
  }
  $('items-filter-text')?.addEventListener('input', renderItems);
  // Fleet filter toolbar (web-ui-v2-spec U7): reflect the toolbar into the
  // hash (shareable) and re-render the cached fleet — no refetch, matching the
  // items toolbar.
  for (const id of ['runs-filter-status', 'runs-filter-workflow', 'runs-filter-repo', 'runs-filter-origin']) {
    $(id)?.addEventListener('change', onRunsFilterChange);
  }
  $('runs-filter-text')?.addEventListener('input', onRunsFilterChange);
  $('workflow-expand')?.addEventListener('change', renderWorkflowGraph);
  // Re-render the current run's graph with the chosen graphviz layout engine.
  $('graph-engine')?.addEventListener('change', () => { if (currentRun) loadGraph(currentRun); });
  // Event-timeline filters (web-ui-v2-spec U3): seed the kind dropdown from the
  // known kinds, then re-render on either control changing.
  const kindSel = $('tl-kind');
  if (kindSel) for (const k of EVENT_KINDS) kindSel.insertAdjacentHTML('beforeend', `<option value="${k}">${k}</option>`);
  $('tl-kind')?.addEventListener('change', renderTimeline);
  $('tl-text')?.addEventListener('input', renderTimeline);
  // R2 feed: the crumb toggles kind filters + resets scope; the feed itself
  // scopes on a node chip, expands checks, and unclamps a prose bubble. All
  // delegated — the feed is innerHTML, re-rendered on every event.
  $('feed-crumb')?.addEventListener('click', e => {
    const kind = e.target.closest('[data-feed-kind]');
    if (kind) { toggleFeedKind(kind.dataset.feedKind); return; }
    const scope = e.target.closest('[data-feed-scope]');
    if (scope) { e.preventDefault(); setFeedScope(''); }
  });
  $('feed')?.addEventListener('click', e => {
    const chip = e.target.closest('.fe-chip[data-node]');
    if (chip) { setFeedScope(chip.dataset.node); selectNode(chip.dataset.node); return; }
    const out = e.target.closest('.fe-out-toggle');
    if (out) { toggleCheck(out.dataset.node, Number(out.dataset.attempt), out.dataset.act); return; }
    const more = e.target.closest('.fe-more');
    if (more) {
      const box = more.closest('.fe-prose');
      box.classList.toggle('open');
      more.textContent = box.classList.contains('open') ? 'show less' : 'show more';
    }
  });
  // Follow the newest entry while live, unless the operator scrolled up.
  window.addEventListener('scroll', () => {
    feedFollow = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
  }, { passive: true });
  // Delegated run trigger: item rows are innerHTML, so a single listener on
  // the list opens the picker for whichever row's run button was clicked.
  $('items-list')?.addEventListener('click', e => {
    const btn = e.target.closest('button[data-run]');
    if (btn) openRunPicker(btn);
  });
  // Delegated cancel trigger: run rows are innerHTML (and re-rendered every
  // poll tick), so a single listener on the list handles whichever row's
  // cancel button was clicked.
  $('run-list')?.addEventListener('click', e => {
    const btn = e.target.closest('button[data-cancel]');
    if (btn) cancelRun(btn.dataset.cancelId);
  });
  // Delegated run-detail controls: re-run reopens the Run modal prefilled from
  // the current run's summary; re-run-from-failure POSTs …/restart.
  $('run-actions')?.addEventListener('click', e => {
    const rerun = e.target.closest('button[data-rerun]');
    if (rerun) { openRunForm(rerunOpts(currentRunSummary)); return; }
    const restart = e.target.closest('button[data-restart]');
    if (restart) restartRun(restart.dataset.runId);
  });
  // Delegated Config controls: panels are innerHTML, so one listener on the
  // view handles add/remove/clear for every row; a second marks the view
  // dirty on any field edit.
  $('config-view')?.addEventListener('click', onConfigClick);
  $('config-view')?.addEventListener('input', () => setConfigDirty(true));
  $('config-view')?.addEventListener('change', onConfigChange);
  $('config-save')?.addEventListener('click', saveConfig);
  // Delegated Workflows-view run trigger: rows are innerHTML, so one listener
  // opens the form standalone for whichever row's run button was clicked.
  $('workflows-list')?.addEventListener('click', e => {
    const btn = e.target.closest('button[data-run-workflow]');
    if (btn) openRunForWorkflow(btn.dataset.runWorkflow);
  });
  $('run-form-workflow')?.addEventListener('change', onWorkflowChange);
  $('run-form-cancel')?.addEventListener('click', () => $('run-form').close());
  $('run-form-run')?.addEventListener('click', submitRun);
  // A full unload (reload / close / external nav) bypasses the hash router,
  // so guard it too: the browser shows its native leave prompt when the
  // Config view has unsaved edits.
  window.addEventListener('beforeunload', (e) => {
    if (activeView === 'config-view' && configDirty) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('hashchange', route);
  route();
});
</script>
</body>
</html>
