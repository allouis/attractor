<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>attractor</title>
<!-- tailwind:inject -->  <!-- serveUI replaces this with the compiled Tailwind stylesheet -->

<script data-theme-preload>
  // Apply the persisted theme before first paint to avoid a flash of the
  // wrong palette. Absent a stored choice, the CSS media query drives it.
  (function () {
    try {
      const t = localStorage.getItem('theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* localStorage may be unavailable; fall back to OS pref */ }
  })();
</script>
<style>
  /* Design tokens (web-ui-spec W1). Every view consumes tokens only — no
     ad-hoc colours/sizes. Light is the base :root; dark values arrive via
     the data-theme override (manual toggle) and prefers-color-scheme. */
  :root {
    /* surface + text ramp */
    --surface-0: #ffffff;   /* page background */
    --surface-1: #f6f8fa;   /* raised panels */
    --surface-2: #eaeef2;   /* inset / hover */
    --text: #1f2328;
    --text-muted: #656d76;
    --border: #d0d7de;
    --accent: #0969da;
    /* spacing scale */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    /* type scale */
    --font-sm: 12px;
    --font-base: 14px;
    --font-lg: 18px;
    /* semantic state palette — the load-bearing colour decision.
       needs-human is deliberately the highest-attention hue. */
    --state-queued: #64748b;
    --state-running: #2563eb;
    --state-success: #16a34a;
    --state-failed: #dc2626;
    --state-needs-human: #d97706;
    --state-retrying: #ea580c;
    --state-cancelled: #94a3b8;
    /* Ink for text sitting on a filled needs-human (amber) fill. Amber is
       light in both themes, so this stays dark and is NOT overridden below —
       it clears WCAG AA on the amber fill in light and dark alike. */
    --attention-ink: #1f2328;
  }
  /* Dark tokens. Duplicated across an explicit override and the media
     query so a manual choice always wins over the OS preference:
       no data-theme        -> follow prefers-color-scheme
       data-theme="dark"     -> dark regardless of OS
       data-theme="light"    -> stay on the light :root base */
  :root[data-theme="dark"] {
    --surface-0: #0d1117;
    --surface-1: #161b22;
    --surface-2: #21262d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --border: #30363d;
    --accent: #4493f8;
    --state-queued: #94a3b8;
    --state-running: #60a5fa;
    --state-success: #4ade80;
    --state-failed: #f87171;
    --state-needs-human: #fbbf24;
    --state-retrying: #fb923c;
    --state-cancelled: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface-0: #0d1117;
      --surface-1: #161b22;
      --surface-2: #21262d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --border: #30363d;
      --accent: #4493f8;
      --state-queued: #94a3b8;
      --state-running: #60a5fa;
      --state-success: #4ade80;
      --state-failed: #f87171;
      --state-needs-human: #fbbf24;
      --state-retrying: #fb923c;
      --state-cancelled: #64748b;
    }
  }
  * { box-sizing: border-box; }
  body { font: var(--font-base)/1.5 system-ui, sans-serif; margin: 0; color: var(--text); background: var(--surface-0); }
  /* Header/nav layout is Tailwind (ui-tailwind-spec T1); these rules keep the
     link colour, underline reset, tap padding and the JS-toggled active
     underline that utilities don't express. */
  header a { color: inherit; text-decoration: none; }
  nav a { color: var(--text-muted); padding: var(--space-2) 0; border-bottom: 2px solid transparent; }
  nav a.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: var(--space-3) var(--space-4); }
  /* One view visible at a time; the router shows the routed section. */
  main > section { display: none; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border); }
  th { color: var(--text-muted); font-weight: 600; }
  a { color: var(--accent); }
  .status { font-weight: 600; text-transform: capitalize; }
  .status.completed { color: var(--state-success); }
  .status.failed { color: var(--state-failed); }
  .status.cancelled { color: var(--state-cancelled); }
  .status.running { color: var(--state-running); }
  .status.retrying { color: var(--state-retrying); }
  .status.queued { color: var(--state-queued); }
  /* Runs fleet counts (web-ui-spec W5): outlined state-tinted pills that
     answer "how many running / queued / needs-human / failed" at a glance.
     needs-human is the load-bearing state, so when non-zero it fills rather
     than outlines — the highest-attention treatment. */
  .counts { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
  .counts:empty { display: none; }
  .count { font-size: var(--font-sm); font-weight: 600; padding: var(--space-1) var(--space-3);
           border-radius: 999px; border: 1px solid var(--border); color: var(--text-muted); }
  .count-running { color: var(--state-running); border-color: var(--state-running); }
  .count-queued { color: var(--state-queued); border-color: var(--state-queued); }
  .count-failed { color: var(--state-failed); border-color: var(--state-failed); }
  .count-needs-human { color: var(--state-needs-human); border-color: var(--state-needs-human); }
  .count.loud { background: var(--state-needs-human); color: var(--attention-ink);
                border-color: var(--state-needs-human); }
  /* Per-row needs-human flag: same loud amber fill, carried on the run row. */
  .chip.needs-human { display: inline-block; font-size: var(--font-sm); font-weight: 600;
           padding: 0 var(--space-2); border-radius: 999px; margin-left: var(--space-2);
           background: var(--state-needs-human); color: var(--attention-ink); }
  /* Origin provenance tag (web-ui-v2-spec U7): a quiet label for how a run
     was launched — item / workflow / manual. Muted by default; the item
     origin gets a faint tint since a dispatched run is the common case. */
  .origin { font-size: var(--font-sm); text-transform: uppercase; letter-spacing: .03em;
            color: var(--text-muted); }
  .origin.origin-item { color: var(--text); }
  /* Items filter/group toolbar. Controls consume tokens; they wrap on
     narrow viewports rather than overflow. */
  .toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center;
             margin-bottom: var(--space-3); }
  .toolbar select, .toolbar input { font: inherit; padding: var(--space-1) var(--space-2);
             min-height: 2.5rem; color: var(--text); background: var(--surface-1);
             border: 1px solid var(--border); border-radius: 6px; }
  .toolbar .check { display: inline-flex; align-items: center; gap: var(--space-1);
             color: var(--text-muted); }
  .group-head { margin: var(--space-4) 0 var(--space-1); color: var(--text-muted); font-size: var(--font-sm);
             text-transform: uppercase; letter-spacing: .04em; }
  .group-head:first-child { margin-top: 0; }
  /* Warning banner: a partial-source outage must be visible, not silent. */
  .banner { padding: var(--space-2) var(--space-3); border-radius: 6px; margin-bottom: var(--space-3);
            border: 1px solid var(--border); background: var(--surface-1); }
  .banner.error { color: var(--state-failed); border-color: var(--state-failed); }
  .banner.ok { color: var(--state-success); border-color: var(--state-success); }
  .banner.warn { color: var(--state-needs-human); border-color: var(--state-needs-human); }
  /* A blocked run is the loudest header state: it needs a human right now, so
     it fills (amber) rather than tints (web-ui-v2-spec U5). */
  .banner.blocked { background: var(--state-needs-human); color: var(--attention-ink);
                    border-color: var(--state-needs-human); font-weight: 600; }
  /* Item badges: a linked-run pill (status-tinted, links to #run/<id>) and
     the deliberately loud in-progress chip. */
  .badge { display: inline-block; font-size: var(--font-sm); font-weight: 600;
           padding: 0 var(--space-2); border-radius: 999px; border: 1px solid var(--border);
           text-decoration: none; margin-right: var(--space-1); }
  .badge.in-progress { color: var(--state-running); border-color: var(--state-running); }
  .layout { display: grid; grid-template-columns: 1fr 360px; gap: var(--space-4); align-items: start; }
  /* Shared graph-pane sizing: the run-detail graph and the static workflow
     graph both render server-side SVG and size identically. */
.workflow-expand { display: inline-block; margin: 0 0 var(--space-3); color: var(--text-muted); font-size: .9em; cursor: pointer; }
  .graph-pane svg { max-width: 100%; height: auto; }
  #graph g.node { cursor: pointer; }
  /* Card primitive (web-ui-v2-spec U1): a bordered, padded surface for a
     grouped chunk of content — the node inspector and each config panel. */
  .card { border: 1px solid var(--border); border-radius: 6px; padding: var(--space-3);
          background: var(--surface-1); }
  #node-pane { min-height: 120px; }
  #node-pane h3 { margin: 0 0 var(--space-2); }
  #node-log { white-space: pre-wrap; font: var(--font-sm)/1.45 ui-monospace, monospace;
              margin-top: var(--space-2); max-height: 320px; overflow: auto; }
  #node-pane h4 { margin: var(--space-3) 0 var(--space-1); font-size: var(--font-sm); }
  .stage-meta { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); }
  .stage-text { margin: 0; padding: var(--space-2); background: var(--surface-2); border-radius: 6px;
                white-space: pre-wrap; font: var(--font-sm)/1.45 ui-monospace, monospace;
                max-height: 320px; overflow: auto; }
  .tool { color: var(--text-muted); }
  .tool-call summary { cursor: pointer; color: var(--text-muted); }
  .tool-call pre { margin: var(--space-1) 0 0; padding: var(--space-2);
                   background: var(--surface-2); border-radius: 6px;
                   font: var(--font-sm)/1.45 ui-monospace, monospace;
                   white-space: pre-wrap; overflow: auto; }
  #human-dock { margin-top: var(--space-4); }
  #human-dock .q { border: 1px solid var(--state-needs-human); border-radius: 6px;
                   padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2); }
  /* Event timeline (web-ui-v2-spec U3): the full, filterable run event log —
     a scrollable feed under the graph so the whole history is one glance. */
  #event-timeline { margin-top: var(--space-4); }
  #event-timeline h3 { margin: 0 0 var(--space-2); }
  .tl-controls { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-2); }
  .tl-controls select, .tl-controls input { min-height: 2.5rem; }
  .tl-controls input { flex: 1; }
  .timeline { border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1);
              max-height: 360px; overflow: auto; font: var(--font-sm)/1.45 ui-monospace, monospace; }
  .tl-row { display: flex; align-items: baseline; gap: var(--space-2);
            padding: var(--space-1) var(--space-3); border-bottom: 1px solid var(--border); }
  .tl-row:last-child { border-bottom: 0; }
  .tl-time { color: var(--text-muted); white-space: nowrap; }
  .tl-kind { flex: none; }
  .tl-node { color: var(--text-muted); }
  .tl-msg { white-space: pre-wrap; word-break: break-word; }
  /* Run diff + artifacts (web-ui-v2-spec U4). The diff renders line-by-line;
     add/del reuse the state tokens so they read in both themes. The artifact
     browser is a list of clickable file rows over GET …/artifacts. */
  .run-actions { display: flex; gap: var(--space-2); margin: var(--space-2) 0; }
  .run-actions:empty { display: none; }
  #run-diff, #run-artifacts { margin-top: var(--space-4); }
  #run-diff h3, #run-artifacts h3 { margin: 0 0 var(--space-2); }
  .diff { border: 1px solid var(--border); border-radius: 6px; background: var(--surface-1);
          max-height: 480px; overflow: auto; font: var(--font-sm)/1.45 ui-monospace, monospace; }
  .diff-line { display: block; white-space: pre-wrap; word-break: break-word;
               padding: 0 var(--space-3); border-left: 3px solid transparent; }
  .diff-add { color: var(--state-success); border-left-color: var(--state-success);
              background: color-mix(in srgb, var(--state-success) 10%, transparent); }
  .diff-del { color: var(--state-failed); border-left-color: var(--state-failed);
              background: color-mix(in srgb, var(--state-failed) 10%, transparent); }
  .diff-hunk { color: var(--text-muted); background: var(--surface-2); }
  .diff-file { color: var(--text-muted); font-weight: 600; }
  .artifacts { border: 1px solid var(--border); border-radius: 6px;
               background: var(--surface-1); overflow: hidden; }
  .artifact-dir { padding: var(--space-1) var(--space-3); color: var(--text-muted);
                  font-size: var(--font-sm); background: var(--surface-2); }
  .artifact-row { display: flex; justify-content: space-between; gap: var(--space-3);
                  width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border);
                  border-radius: 0; background: transparent;
                  font: var(--font-sm)/1.45 ui-monospace, monospace; }
  .artifact-row:last-child { border-bottom: 0; }
  .artifact-name { word-break: break-all; }
  #run-artifact-view { margin-top: var(--space-2); }
  .pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .muted { color: var(--text-muted); }
  /* Shared empty/loading/error placeholder (web-ui-v2-spec U1). Centred,
     padded, and colour-coded so a failure never reads like an empty list. */
  .state { color: var(--text-muted); text-align: center; padding: var(--space-5) 0; }
  .state-error { color: var(--state-failed); }
  button { font: inherit; padding: var(--space-1) var(--space-3); min-height: 2.5rem; cursor: pointer;
           background: var(--surface-1); color: var(--text); border: 1px solid var(--border); border-radius: 6px; }
  button:hover { background: var(--surface-2); }
  /* Reusable modal (web-ui-v2-spec U1): a token-styled <dialog>. The
     run-action picker is the first user; new dialogs get the look for free. */
  .modal { color: var(--text); background: var(--surface-0);
                border: 1px solid var(--border); border-radius: 8px;
                padding: var(--space-4); min-width: 320px; max-width: min(560px, 92vw); }
  .modal::backdrop { background: rgba(0, 0, 0, .4); }
  .modal h3 { margin: 0 0 var(--space-3); }
  .modal label { display: block; margin-bottom: var(--space-3); color: var(--text-muted); }
  .modal select, .modal input { font: inherit; width: 100%; min-height: 2.5rem; margin-top: var(--space-1);
                color: var(--text); background: var(--surface-1);
                border: 1px solid var(--border); border-radius: 6px; padding: var(--space-1) var(--space-2); }
  .modal-actions { display: flex; justify-content: flex-end; gap: var(--space-2); }
  /* Config view (config-screen-spec C4): hand-built panels over the whole
     config doc. Panels share the table/banner/button primitives; inputs
     consume tokens like the toolbar controls. */
  .config-panel { margin-bottom: var(--space-4); }
  .config-panel h3 { margin: 0 0 var(--space-1); }
  .config-panel .muted { margin-top: 0; }
  .config-panel input, .config-panel select { font: inherit; width: 100%; min-height: 2.5rem;
             color: var(--text); background: var(--surface-1);
             border: 1px solid var(--border); border-radius: 6px; padding: var(--space-1) var(--space-2); }
  .config-note { color: var(--state-needs-human); font-size: var(--font-sm); }
  .config-actions { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-4); }
  /* Responsive (web-ui-v2-spec U1): on a narrow viewport collapse the
     two-column run/workflow detail to a single column and tighten table cells
     + page padding. Header wrap is Tailwind now (ui-tailwind-spec T1). */
  @media (max-width: 720px) {
    main { padding: var(--space-3); }
    .layout { grid-template-columns: 1fr; }
    th, td { padding: var(--space-2); }
  }
</style>
</head>
<body>
<header class="sticky top-0 z-20 flex flex-wrap items-center justify-between gap-2 border-b border-line bg-surface-0 px-4 py-3 font-semibold">
  <a class="brand mr-5" href="#items">attractor</a>
  <nav class="flex flex-wrap grow gap-4 font-normal">
    <a id="nav-items" href="#items">Items</a>
    <a id="nav-runs" href="#runs">Runs</a>
    <a id="nav-workflows" href="#workflows">Workflows</a>
    <a id="nav-config" href="#config">Config</a>
  </nav>
  <button id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark" aria-label="Toggle theme" class="font-normal">&#9790;</button>
</header>
<main>
  <section id="items-view">
    <div id="items-toolbar" class="toolbar">
      <select id="items-filter-source" title="source"><option value="">all sources</option></select>
      <select id="items-filter-type" title="type"><option value="">all types</option></select>
      <select id="items-filter-repo" title="repo"><option value="">all repos</option></select>
      <input id="items-filter-text" type="search" placeholder="filter title…">
      <label class="check"><input id="items-filter-progress" type="checkbox"> in progress</label>
      <select id="items-group" title="group by">
        <option value="">no grouping</option>
        <option value="repo">group by repo</option>
        <option value="source">group by source</option>
      </select>
    </div>
    <div id="items-warning" role="alert"></div>
    <div id="items-list"></div>
    <dialog id="run-form" class="modal">
      <h3>run workflow</h3>
      <label>workflow <select id="run-form-workflow"></select></label>
      <div id="run-var-fields"></div>
      <p id="run-form-error" class="banner error" hidden></p>
      <div class="modal-actions">
        <button type="button" id="run-form-cancel">cancel</button>
        <button type="button" id="run-form-run">run</button>
      </div>
    </dialog>
  </section>
  <section id="runs-view">
    <div id="run-counts" class="counts"></div>
    <div id="runs-toolbar" class="toolbar">
      <select id="runs-filter-status" title="status">
        <option value="">all statuses</option>
        <option value="running">running</option>
        <option value="needs-human">needs human</option>
        <option value="queued">queued</option>
        <option value="completed">completed</option>
        <option value="failed">failed</option>
        <option value="cancelled">cancelled</option>
      </select>
      <select id="runs-filter-workflow" title="workflow"><option value="">all workflows</option></select>
      <select id="runs-filter-repo" title="repo"><option value="">all repos</option></select>
      <select id="runs-filter-origin" title="started by">
        <option value="">any origin</option>
        <option value="item">item</option>
        <option value="workflow">workflow</option>
        <option value="manual">manual</option>
      </select>
      <input id="runs-filter-text" type="search" placeholder="filter runs…">
    </div>
    <section id="run-list"></section>
  </section>
  <section id="workflows-view"><div id="workflows-list"></div></section>
  <section id="config-view">
    <div id="config-status" role="alert"></div>
    <div id="config-body"></div>
    <div class="config-actions">
      <button type="button" id="config-save">save</button>
      <span id="config-dirty" class="muted"></span>
    </div>
  </section>
  <section id="workflow-view">
    <p><a href="#workflows">&larr; all workflows</a></p>
    <h2 id="workflow-title"></h2>
    <p class="muted">Run this workflow by picking an <a href="#items">item</a>.</p>
    <label class="workflow-expand"><input type="checkbox" id="workflow-expand"> expand sub-workflows</label>
    <div id="workflow-graph" class="graph-pane"></div>
  </section>
  <section id="run-view">
    <p><a href="#runs">&larr; all runs</a></p>
    <h2 id="run-title"></h2>
    <div id="run-actions" class="run-actions"></div>
    <div id="run-blocked"></div>
    <div id="run-failure"></div>
    <div class="layout">
      <div>
        <label class="flex items-center gap-2 mb-2 text-muted text-sm">
          layout
          <select id="graph-engine" class="min-h-10 px-2 rounded border border-line bg-surface-1 text-base">
            <option value="dot">dot</option>
            <option value="neato">neato</option>
            <option value="fdp">fdp</option>
            <option value="sfdp">sfdp</option>
            <option value="circo">circo</option>
            <option value="twopi">twopi</option>
          </select>
        </label>
        <div id="graph" class="graph-pane"></div>
      </div>
      <div>
        <div id="node-pane" class="card min-w-0"><p class="muted">Click a node to inspect it.</p></div>
        <div id="human-dock"></div>
      </div>
    </div>
    <section id="run-diff">
      <h3>Diff</h3>
      <div id="run-diff-body" class="diff min-w-0"></div>
    </section>
    <section id="run-artifacts">
      <h3>Artifacts</h3>
      <div id="run-artifacts-list" class="artifacts"></div>
      <div id="run-artifact-view"></div>
    </section>
    <section id="event-timeline">
      <h3>Events</h3>
      <div class="tl-controls">
        <select id="tl-kind" aria-label="filter events by kind"><option value="">all kinds</option></select>
        <input id="tl-text" placeholder="filter events…" aria-label="filter events by text">
      </div>
      <div id="tl-rows" class="timeline"></div>
    </section>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let es = null;                 // active EventSource
let currentRun = null;         // run id being viewed
let selectedNode = null;       // node id in the pane
const nodeLog = {};            // node id -> accumulated log html chunks
const nodeState = {};          // node id -> status class
const nodeTiming = {};         // node id -> {start, end} ISO ts from the stream
let dockTimer = null;
let runsTimer = null;          // fleet-list poll while the Runs view is open
let configLoaded = null;       // last GET /config doc (redacted) the view rendered
let linearClear = false;       // pending explicit Linear-key clear (Clear button)
let configDirty = false;       // Config view has unsaved edits (nav/unload guard)
let activeView = null;         // id of the section route() last showed
const timeline = [];           // run detail: {kind, ev} per streamed event (U3)

// EVENT_KINDS is every engine event kind the SSE stream carries (engine
// events.go). attachStream registers one dispatch per kind so the replay
// cursor stays authoritative for the whole stream and the U3 timeline sees
// them all — even kinds with no graph side-effect.
const EVENT_KINDS = [
  'pipeline_started', 'pipeline_completed', 'pipeline_failed',
  'stage_started', 'stage_completed', 'stage_failed', 'stage_retrying',
  'stage_progress', 'checkpoint_saved',
  'interview_started', 'interview_answered', 'interview_timeout', 'usage',
];

// TIMELINE_SKIP are kinds the U3 timeline does NOT log. stage_progress is
// emitted once per assistant token (acp.go / claudecode.go) — thousands per
// run; it is the inspector's live tail (U2), not a high-level timeline event.
// It still flows through the dispatch (paint + node-log side-effects and the
// replay cursor), it just never becomes a timeline row.
const TIMELINE_SKIP = new Set(['stage_progress']);

// TIMELINE_MAX caps the retained event log so a long-running or looping run
// can't grow the array + DOM without bound. Past the cap the oldest events are
// dropped — a debugger cares about the recent window, above all the failure.
const TIMELINE_MAX = 2000;

// STANDARD_CHECKS are the checks the current pipelines reference; the Repos
// panel surfaces them as fixed columns even when a repo sets none. The
// stored checks map stays open (config-screen-spec) — a repo may carry more.
const STANDARD_CHECKS = ['deps', 'typecheck', 'lint', 'test'];

// ---- theme -------------------------------------------------------------
// currentTheme resolves the effective palette: an explicit manual choice
// (data-theme) wins, else the OS preference.
function currentTheme() {
  const set = document.documentElement.getAttribute('data-theme');
  if (set) return set;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

// syncToggle points the toggle glyph at the palette it switches *to*.
function syncToggle() {
  const btn = $('theme-toggle');
  if (btn) btn.innerHTML = currentTheme() === 'dark' ? '&#9728;' : '&#9790;';
}

function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('theme', next); } catch (e) { /* best-effort */ }
  document.documentElement.setAttribute('data-theme', next);
  syncToggle();
}

// showView switches the single visible top-level section by id, recording it
// so the route guard knows which view is being left.
function showView(name) {
  for (const sec of document.querySelectorAll('main > section')) {
    sec.style.display = sec.id === name ? 'block' : 'none';
  }
  activeView = name;
}

// confirmLeaveConfig guards against silently dropping unsaved Config edits.
// route() calls it before switching views; when leaving the Config view with
// pending edits for a different hash it prompts, and on cancel restores the
// address bar to #config without a reload (history.replaceState fires no
// hashchange), keeping the in-progress edits on screen.
function confirmLeaveConfig() {
  if (activeView !== 'config-view' || !configDirty) return true;
  if (location.hash === '#config') return true;   // staying on the view
  if (confirm('Discard unsaved config changes?')) { configDirty = false; return true; }
  history.replaceState(null, '', '#config');
  return false;
}

// ---- routing -----------------------------------------------------------
// TABS is the top-level tab registry: hash → nav-link id, view section id,
// and the enter handler that renders it. One place drives both route()'s
// dispatch and highlightNav()'s active marking, so adding a tab is a single
// entry rather than edits scattered across the two (web-ui-spec nav shell).
const TABS = {
  items:     { nav: 'nav-items',     view: 'items-view',     enter: showItems },
  runs:      { nav: 'nav-runs',      view: 'runs-view',      enter: showRuns },
  workflows: { nav: 'nav-workflows', view: 'workflows-view', enter: showWorkflows },
  config:    { nav: 'nav-config',    view: 'config-view',    enter: showConfig },
};

// teardownRun stops the run-detail stream + dock poll when leaving a run.
function teardownRun() {
  if (es) { es.close(); es = null; }
  if (dockTimer) { clearInterval(dockTimer); dockTimer = null; }
  currentRun = null;
}

// route dispatches on the URL hash. All navigation flows through the hash
// (nav tabs, run rows, back links), so one hashchange listener drives
// every view switch. An unknown tab falls back to Items (the default land).
function route() {
  if (!confirmLeaveConfig()) return;   // stay put on a cancelled leave
  stopRunsPoll();
  const m = location.hash.match(/^#run\/(.+)$/);
  if (m) { openRun(m[1]); return; }
  teardownRun();
  const wf = location.hash.match(/^#workflow\/(.+)$/);
  if (wf) { openWorkflow(decodeURIComponent(wf[1])); return; }
  // Strip a query suffix (#runs?status=…) before the tab lookup: the Runs
  // view carries its filter state in the hash (web-ui-v2-spec U7 deep links).
  const hash = location.hash.replace(/^#/, '').replace(/\?.*$/, '');
  const name = TABS[hash] ? hash : 'items';
  const tab = TABS[name];
  highlightNav(name);
  showView(tab.view);
  tab.enter();
}

// highlightNav marks the active tab; run detail counts as the Runs tab.
function highlightNav(name) {
  for (const t in TABS) {
    const el = $(TABS[t].nav);
    if (el) el.classList.toggle('active', t === name);
  }
}

// ---- items view --------------------------------------------------------
// The candidate set is what each source returns for "assigned to me". The
// GET /items endpoint is single-source, so the view discovers the daemon's
// sources (GET /items/sources — never a hardcoded list, which would drift
// from config) and fetches each, merging client-side (web-ui-spec §Items
// view). itemsCache holds the merged set; renderItems draws from it so
// filters re-render without refetching.
let itemsCache = [];
let itemsRendered = false; // suppresses the loading flash on a background refresh
let itemsGen = 0;          // request generation; only the latest fetch renders

// showItems renders the Items view and refreshes it on every entry, so live
// status badges and newly-assigned items stay current (a stale, never-
// refreshing list defeats the view's purpose). The first entry shows a
// loading placeholder; a re-entry refetches in the background — keeping the
// current rows and the user's filter selections visible until fresh data
// lands. itemsGen guards out-of-order fetches: only the latest render wins.
function showItems() {
  fetchItems();
}

async function fetchItems() {
  const gen = ++itemsGen;
  const listEl = $('items-list');
  if (!itemsRendered) listEl.innerHTML = loadingState();
  let sources;
  try {
    const r = await fetch('/items/sources');
    if (!r.ok) throw new Error('status ' + r.status);
    sources = (await r.json()).sources || [];
  } catch (e) {
    if (gen !== itemsGen) return;   // superseded by a newer fetch
    // A refresh failure keeps the last-known list rather than wiping it; a
    // first-load failure has nothing to keep, so it shows the error inline.
    if (itemsRendered) {
      setItemsWarning('could not refresh items — showing the last-loaded set');
    } else {
      itemsCache = [];
      renderSourceWarning([]);
      listEl.innerHTML = '<p class="banner error">could not reach the daemon to load item sources</p>';
    }
    return;
  }
  // Fetch each source independently and record which failed, so a partial
  // outage (a source 500ing/rate-limited) is surfaced rather than silently
  // dropping assigned work — the one failure a triage view must not have
  // (review B1).
  const failed = [];
  const per = await Promise.all(sources.map(async (s) => {
    try {
      const r = await fetch(`/items?source=${encodeURIComponent(s)}&filter=assigned`);
      if (!r.ok) { failed.push(s); return []; }
      return (await r.json()).items || [];
    } catch (e) { failed.push(s); return []; }
  }));
  if (gen !== itemsGen) return;     // a newer fetch superseded this one
  itemsCache = per.flat();
  itemsRendered = true;
  renderSourceWarning(failed);
  populateItemFilters();
  renderItems();
}

// setItemsWarning shows an error banner above the list, or clears it when
// text is empty.
function setItemsWarning(text) {
  const el = $('items-warning');
  if (!el) return;
  el.textContent = text || '';
  el.className = text ? 'banner error' : '';
}

// renderSourceWarning surfaces sources that failed to load, naming them so
// the user reads the list as incomplete rather than as "nothing assigned".
// An empty list clears the banner.
function renderSourceWarning(failed) {
  setItemsWarning(failed.length
    ? `could not load: ${failed.join(', ')} — showing the remaining sources only`
    : '');
}

// itemRepo / itemSource / itemType read the fields the filters key on.
const itemRepo = (it) => (it.vars && it.vars.repo) || '';
const itemSource = (it) => (it.ref && it.ref.source) || '';
const itemType = (it) => (it.ref && it.ref.type) || '';

// populateItemFilters fills the source/type/repo selects with the distinct
// values present in the merged set, preserving the current selection.
function populateItemFilters() {
  fillOptions('items-filter-source', distinct(itemsCache.map(itemSource)));
  fillOptions('items-filter-type', distinct(itemsCache.map(itemType)));
  fillOptions('items-filter-repo', distinct(itemsCache.map(itemRepo)));
}

function distinct(values) {
  return [...new Set(values.filter(Boolean))].sort();
}

// fillOptions rebuilds a select's options below its first (all/none) option,
// keeping the current choice selected when it still exists.
function fillOptions(id, values) {
  const sel = $(id);
  if (!sel) return;
  const prev = sel.value;
  while (sel.options.length > 1) sel.remove(1);
  for (const v of values) {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  }
  sel.value = values.includes(prev) ? prev : '';
}

// applyFilters narrows the merged set by the toolbar controls (v1 narrows
// only; broadening the candidate set is v2 backend work — web-ui-spec
// §Items view).
function applyFilters(list) {
  const source = $('items-filter-source').value;
  const type = $('items-filter-type').value;
  const repo = $('items-filter-repo').value;
  const text = $('items-filter-text').value.trim().toLowerCase();
  const progressOnly = $('items-filter-progress').checked;
  return list.filter(it =>
    (!source || itemSource(it) === source) &&
    (!type || itemType(it) === type) &&
    (!repo || itemRepo(it) === repo) &&
    (!text || (it.title || '').toLowerCase().includes(text)) &&
    (!progressOnly || it.in_progress));
}

function renderItems() {
  const list = applyFilters(itemsCache);
  if (!list.length) { $('items-list').innerHTML = emptyPanel('No items', 'Items appear here as work is discovered.'); return; }
  const groupBy = $('items-group').value;
  const key = { repo: itemRepo, source: itemSource }[groupBy];
  if (!key) { $('items-list').innerHTML = itemsTable(list); return; }
  const groups = new Map();
  for (const it of list) {
    const g = key(it) || '(none)';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(it);
  }
  $('items-list').innerHTML = [...groups.keys()].sort().map(g =>
    `<div class="group-head">${escapeHtml(g)}</div>${itemsTable(groups.get(g))}`).join('');
}

// itemsTable renders one table of item rows.
function itemsTable(list) {
  const rows = list.map(itemRowHtml).join('');
  return `<table>
    <thead><tr><th>title</th><th>source</th><th>type</th><th>repo</th><th>runs</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

// itemRowHtml builds one item row. Every field originates from an external
// source, so all are escaped for the HTML context; the title URL is also
// scheme-checked for the URL context (escapeHtml alone does not neutralise a
// javascript: href) and opened with rel=noopener noreferrer.
function itemRowHtml(it) {
  return `
    <tr>
      <td><a href="${escapeHtml(safeUrl(it.url || ''))}" target="_blank" rel="noopener noreferrer">${escapeHtml(it.title || '')}</a></td>
      <td class="muted">${escapeHtml(itemSource(it))}</td>
      <td class="muted">${escapeHtml(itemType(it))}</td>
      <td class="muted">${escapeHtml(itemRepo(it))}</td>
      <td>${itemBadges(it)}</td>
      <td>${itemRunButton(it)}</td>
    </tr>`;
}

// itemRunButton renders the per-row run trigger. The item ref rides on data-*
// attributes (escaped) rather than an inline onclick, matching the page's
// no-inline-JS convention; a delegated click on #items-list opens the run
// form, which looks the item's vars up in the cache to prefill (run-workflow-
// spec §"The Run modal").
function itemRunButton(it) {
  const ref = it.ref || {};
  return `<button data-run` +
    ` data-run-source="${escapeHtml(ref.source || '')}"` +
    ` data-run-type="${escapeHtml(ref.type || '')}"` +
    ` data-run-id="${escapeHtml(ref.external_id || '')}">run</button>`;
}

// safeUrl returns url only when it resolves to an http(s) scheme; a
// javascript:/data: URL (or anything unparseable) becomes '#', so an
// external item's URL cannot smuggle a script into the app origin (S1).
function safeUrl(url) {
  try {
    const proto = new URL(url, location.origin).protocol;
    return (proto === 'http:' || proto === 'https:') ? url : '#';
  } catch (e) { return '#'; }
}

// itemBadges renders the item's run annotation (web-ui-spec §Items view):
// a loud in-progress chip when a linked run is queued/running, then one
// status-tinted pill per linked run linking to #run/<id>.
function itemBadges(it) {
  const chip = it.in_progress ? '<span class="badge in-progress">in progress</span>' : '';
  const runs = (it.linked_runs || []).map(run => {
    const id = run.id || '';
    return stateBadge(run.status, id.slice(0, 8), `#run/${id}`);
  }).join('');
  return chip + runs;
}

// ---- run form ----------------------------------------------------------
// One modal, two entry points (run-workflow-spec §"The Run modal"): from an
// item row (item_ref set, fields prefilled from the item) or from the
// Workflows view (blank, standalone). Both funnel through the single admission
// endpoint POST /workflows/{name}/run. workflowsCache/reposCache hold the two
// dropdown sources; runFormRef is the item link (null for standalone) and
// runFormPrefill/runFormRepos the state a workflow change rebuilds fields from.
let workflowsCache = null;
let reposCache = null;
let runFormRef = null;
let runFormPrefill = {};
let runFormRepos = [];

// buildVarFields renders the Run modal's body: one field per var a workflow
// declares (run-workflow-spec §"The input contract"), prefilled from `prefill`
// (an item's vars, or {} for a standalone launch) and editable. `repo` is
// special — it is both a declared var and the cwd resolver, so it renders as
// the registered-repo dropdown, not a text input; every other var is a text
// field. Values are inert data, escaped before they reach markup.
function buildVarFields(vars, prefill, repos) {
  prefill = prefill || {};
  return (vars || []).map(v => {
    if (v === 'repo') {
      const opts = ['<option value="">choose a repo…</option>'].concat(
        (repos || []).map(r => {
          const sel = r.name === prefill.repo ? ' selected' : '';
          return `<option value="${escapeHtml(r.name)}"${sel}>${escapeHtml(r.name)}</option>`;
        })).join('');
      return `<label>${escapeHtml(v)} <select class="run-var" data-var="repo">${opts}</select></label>`;
    }
    return `<label>${escapeHtml(v)} ` +
      `<input class="run-var" data-var="${escapeHtml(v)}" value="${escapeHtml(prefill[v] || '')}"></label>`;
  }).join('');
}

// runFieldBody assembles the modal's field body for a workflow's declared
// vars: one field each (repo → the dropdown), with `repo` synthesized in front
// when the workflow doesn't declare it, because it is always the cwd resolver.
// A var-less standalone launch trails the item-driven note. `hasItem` marks an
// item-linked open (its vars prefill the fields and supply the run's context).
function runFieldBody(vars, prefill, repos, hasItem) {
  vars = vars || [];
  const fieldVars = vars.includes('repo') ? vars : ['repo', ...vars];
  return buildVarFields(fieldVars, prefill, repos) + needsItemNote(vars, hasItem);
}

// needsItemNote warns that a workflow is item-driven: with no fillable var (only
// the synthesized `repo`) it reads its context from a seeded item at runtime
// (router → item.type), which a standalone launch cannot supply. Returns the
// note markup for that case, else '' (real vars to fill, or an item is linked).
function needsItemNote(vars, hasItem) {
  const fillable = (vars || []).filter(v => v !== 'repo');
  if (fillable.length || hasItem) return '';
  return `<p class="state state-empty">no inputs — this workflow needs an ` +
    `<a href="#items">item</a> to run.</p>`;
}

// varsFromFields reshapes the modal's field nodes into the {var:value} map the
// run POST carries. An empty field is omitted — not sent as "" — so a var the
// human leaves blank never overlays (and blanks) the value item_ref prefilled
// server-side; values are trimmed. Pure over the node list for testability.
function varsFromFields(fields) {
  const vars = {};
  for (const f of fields) {
    const value = f.value.trim();
    if (value) vars[f.dataset.var] = value;
  }
  return vars;
}

// missingRequired lists the declared vars the run can't satisfy: every vars=
// key is required (the engine fails a fresh run on an unseeded one), so an empty
// field blocks submit — unless the linked item prefills it server-side, in which
// case a blank field is fine (varsFromFields drops it and the item base fills
// the gap). Pure over the field nodes + the item prefill, for testability.
function missingRequired(fields, prefill) {
  prefill = prefill || {};
  const missing = [];
  for (const f of fields) {
    if (!f.value.trim() && !prefill[f.dataset.var]) missing.push(f.dataset.var);
  }
  return missing;
}

// collectVars reads the live modal fields via varsFromFields.
function collectVars() {
  return varsFromFields($('run-var-fields').querySelectorAll('.run-var'));
}

// workflowRunButton is the Workflows view's per-row Run action: the workflow
// name rides a data-* attribute (escaped), matching the item-row button's
// no-inline-JS convention; a delegated click opens the form standalone.
function workflowRunButton(name) {
  return `<button data-run-workflow="${escapeHtml(name)}">run</button>`;
}

// fetchWorkflows loads the workflow catalog. GET /workflows returns
// [{name, path}]; the run form keys the admission URL on name. Only a
// non-empty successful catalog is cached — a transient failure or an empty
// result must NOT poison the cache, or one blip would wedge the form at
// "no workflows" for the whole session. A fetch/HTTP failure throws so the
// caller can surface it and retry on the next open.
async function fetchWorkflows() {
  if (workflowsCache) return workflowsCache;
  const r = await fetch('/workflows');
  if (!r.ok) throw new Error('status ' + r.status);
  const list = await r.json();
  if (list.length) workflowsCache = list;
  return list;
}

// fetchRepos loads the registered-repo list backing the repo dropdown (GET
// /repos → [{name, path}], run-workflow-spec §Endpoints). Cached like the
// catalog; an empty list does not poison the cache (a repo added via the
// Config screen shows up on the next open without a session reload).
async function fetchRepos() {
  if (reposCache) return reposCache;
  const r = await fetch('/repos');
  if (!r.ok) throw new Error('status ' + r.status);
  const list = await r.json();
  if (list.length) reposCache = list;
  return list;
}

// fetchWorkflowDetail loads one workflow's declared vars (GET /workflows/{name}
// → {name, path, goal, vars}), the form the modal renders.
async function fetchWorkflowDetail(name) {
  const r = await fetch(`/workflows/${encodeURIComponent(name)}`);
  if (!r.ok) throw new Error('status ' + r.status);
  return r.json();
}

// openRunForm is the shared entry: load the catalog + repo list, populate the
// workflow dropdown (optionally pre-selecting one), then build the fields for
// the selection. opts.itemRef links an item (its vars prefill the fields);
// opts.workflowName pre-selects a workflow (the standalone entry).
async function openRunForm(opts) {
  opts = opts || {};
  runFormRef = opts.itemRef || null;
  runFormPrefill = opts.prefill || {};
  setRunFormError('');
  let wfs = [];
  try {
    wfs = await fetchWorkflows();
  } catch (e) {
    setRunFormError('could not load workflows — reopen to retry');
  }
  try {
    runFormRepos = await fetchRepos();
  } catch (e) {
    runFormRepos = [];
    setRunFormError('could not load repos — reopen to retry');
  }
  $('run-form-workflow').innerHTML = wfs.length
    ? wfs.map(w => {
        const sel = w.name === opts.workflowName ? ' selected' : '';
        return `<option value="${escapeHtml(w.name)}"${sel}>${escapeHtml(w.name)}</option>`;
      }).join('')
    : '<option value="">no workflows</option>';
  await onWorkflowChange();
  $('run-form').showModal();
}

// onWorkflowChange rebuilds the field body for the selected workflow: fetch its
// declared vars, then hand them to runFieldBody (repo synthesized, item note for
// a var-less standalone launch).
async function onWorkflowChange() {
  const name = $('run-form-workflow').value;
  const container = $('run-var-fields');
  if (!name) { container.innerHTML = ''; return; }
  container.innerHTML = loadingState();
  let detail;
  try {
    detail = await fetchWorkflowDetail(name);
  } catch (e) {
    container.innerHTML = errorState('could not load workflow inputs');
    return;
  }
  const vars = (detail && detail.vars) || [];
  container.innerHTML = runFieldBody(vars, runFormPrefill, runFormRepos, !!runFormRef);
}

// openRunPicker opens the form for an item row: the item_ref rides the run
// button's data-* attributes, and the item's own vars (looked up in the cache)
// prefill each field — a PR's repo auto-selects via vars.repo.
function openRunPicker(btn) {
  const ref = {
    source: btn.dataset.runSource,
    type: btn.dataset.runType,
    external_id: btn.dataset.runId,
  };
  const it = itemsCache.find(x => x.ref &&
    x.ref.source === ref.source && x.ref.type === ref.type &&
    x.ref.external_id === ref.external_id);
  return openRunForm({ itemRef: ref, prefill: (it && it.vars) || {} });
}

// openRunForWorkflow opens the form standalone (no item): a blank var body for
// the chosen workflow, repo picked from the dropdown.
function openRunForWorkflow(name) {
  return openRunForm({ workflowName: name });
}

// setRunFormError shows a form error (a 422 from an unset/unmapped repo or a
// failed vars= check, a load failure), or hides the line when empty.
function setRunFormError(text) {
  const el = $('run-form-error');
  if (!el) return;
  el.textContent = text || '';
  el.hidden = !text;
}

// submitRun dispatches the form → POST /workflows/{name}/run {repo, vars,
// item_ref?}. The repo field doubles as the top-level cwd resolver; item_ref,
// when set, gives the daemon the item vars to base the run on. The backend
// 422s an unset/unmapped repo or a failed vars= check; on success it returns
// the new run id, which we navigate to via the hash router.
let runSubmitting = false;   // in-flight guard: one dispatch per confirm
async function submitRun() {
  if (runSubmitting) return;
  const name = $('run-form-workflow').value;
  if (!name) { setRunFormError('no workflow selected'); return; }
  // Client-side required-var block: empty declared inputs the item can't supply.
  // The daemon's vars= admission is the backstop; this saves a doomed round-trip.
  const fields = $('run-var-fields').querySelectorAll('.run-var');
  const missing = missingRequired(fields, runFormPrefill);
  if (missing.length) { setRunFormError('missing required input: ' + missing.join(', ')); return; }
  const vars = collectVars();
  setRunFormError('');
  runSubmitting = true;
  const btn = $('run-form-run');
  if (btn) btn.disabled = true;
  try {
    let r;
    try {
      r = await postJSON(`/workflows/${encodeURIComponent(name)}/run`, {
        repo: vars.repo || '',
        vars,
        item_ref: runFormRef || undefined,
      });
    } catch (e) { setRunFormError('could not reach the daemon'); return; }
    if (!r.ok) { setRunFormError((await r.text()).trim() || `run failed (${r.status})`); return; }
    const { id } = await r.json();
    $('run-form').close();
    location.hash = `#run/${id}`;
  } finally {
    runSubmitting = false;
    if (btn) btn.disabled = false;
  }
}

// ---- workflows view ----------------------------------------------------
// The Workflows view browses the workflow catalog (GET /workflows), links each
// entry to its static graph (GET /workflows/{name}/graph → SVG), and offers a
// per-row Run action (run-workflow-spec §"Standalone launch") that opens the
// run form blank for that workflow. showWorkflows lists the catalog.
async function showWorkflows() {
  const listEl = $('workflows-list');
  listEl.innerHTML = loadingState();
  let wfs;
  try {
    wfs = await fetchWorkflows();   // reuses the run form's catalog cache
  } catch (e) {
    listEl.innerHTML = errorState('could not load workflows');
    return;
  }
  if (!wfs.length) { listEl.innerHTML = emptyState('no workflows'); return; }
  listEl.innerHTML = `<table>
    <thead><tr><th>workflow</th><th></th></tr></thead>
    <tbody>${wfs.map(w =>
      `<tr><td><a href="#workflow/${encodeURIComponent(w.name)}">${escapeHtml(w.name)}</a></td>` +
      `<td>${workflowRunButton(w.name)}</td></tr>`
    ).join('')}</tbody></table>`;
}

// openWorkflow shows one workflow's static graph, rendered server-side from
// its definition (same renderer as the run graph, but no run). The SVG is
// injected as-is, matching loadGraph's trust of the server-rendered graph.
let currentWorkflow = null;

async function openWorkflow(name) {
  currentWorkflow = name;
  highlightNav('workflows');
  showView('workflow-view');
  $('workflow-title').textContent = name;
  await renderWorkflowGraph();
}

// renderWorkflowGraph (re)loads the current workflow's graph, honouring the
// "expand sub-workflows" toggle (?expand inlines each manager_loop child as
// a nested cluster). The SVG is injected as-is, matching loadGraph's trust
// of the server-rendered graph.
async function renderWorkflowGraph() {
  if (!currentWorkflow) return;
  const pane = $('workflow-graph');
  pane.innerHTML = loadingState();
  const expand = $('workflow-expand') && $('workflow-expand').checked ? '?expand=1' : '';
  try {
    const r = await fetch(`/workflows/${encodeURIComponent(currentWorkflow)}/graph${expand}`);
    pane.innerHTML = r.ok ? await r.text() : errorState('graph unavailable');
  } catch (e) { pane.innerHTML = errorState('graph unavailable'); }
}

// ---- runs fleet view ---------------------------------------------------
// The Runs view is a run-centric fleet list, poll-refreshed ~2.5s (the
// dock's pattern) so counts + needs-human stay live without a backend push
// (web-ui-spec W5 / §Liveness). runsRendered suppresses wiping the list on
// a transient poll blip: a first-load failure surfaces the error, a
// mid-poll failure keeps the last-good fleet visible.
let runsRendered = false;
// runsCache holds the last-fetched fleet so a toolbar change re-renders
// (filter, group) without a refetch — the items view's cache pattern.
let runsCache = [];
// runsToolbarSeeded gates the one-shot deep-link seed: on view entry the
// toolbar is filled from the hash once (after its dynamic options exist),
// then user edits and polls take over.
let runsToolbarSeeded = false;

// showRuns fetches immediately then polls until the view is left. Entry
// re-arms the deep-link seed so a shared #runs?…​ hash fills the toolbar.
function showRuns() {
  runsToolbarSeeded = false;
  fetchRuns();
  runsTimer = setInterval(fetchRuns, 2500);
}

// stopRunsPoll halts the fleet poll; route() calls it on every navigation
// so the timer never outlives the Runs view.
function stopRunsPoll() {
  if (runsTimer) { clearInterval(runsTimer); runsTimer = null; }
}

// fetchRuns polls the fleet into runsCache then renders. A transient blip
// keeps the last-good fleet visible (runsRendered); only a first-load
// failure with nothing to keep surfaces the error.
async function fetchRuns() {
  let runs;
  try {
    const r = await fetch('/pipelines');
    if (!r.ok) throw new Error('status ' + r.status);
    runs = (await r.json()).pipelines || [];
  } catch (e) {
    if (!runsRendered) $('run-list').innerHTML = errorState('server unreachable');
    return;
  }
  runsCache = runs;
  runsRendered = true;
  renderFleet();
}

// renderFleet draws the counts bar and run table from runsCache. Split from
// the fetch so toolbar controls re-render the cached fleet without a refetch.
// Counts summarise the whole fleet (unfiltered — they are the overview); the
// table shows the toolbar-narrowed subset (web-ui-v2-spec U7).
function renderFleet() {
  const all = runsCache;
  renderRunCounts(all);
  populateRunFilters(all);
  // Deep-link seed: once per view entry, after the dynamic options exist so a
  // shared repo/workflow value sticks (web-ui-v2-spec U7).
  if (!runsToolbarSeeded) { seedRunsToolbar(runsFilterFromHash(location.hash)); runsToolbarSeeded = true; }
  if (!all.length) { $('run-list').innerHTML = emptyPanel('No runs yet', 'Dispatch a workflow to see runs here.'); return; }
  const runs = applyRunFilters(all);
  if (!runs.length) { $('run-list').innerHTML = emptyPanel('No matching runs', 'No runs match the current filter.'); return; }
  $('run-list').innerHTML = runsTableHtml(runs);
}

// --- shared responsive data-table shell (ui-tailwind-spec T2/T3) ------------
// The Runs list and the Config repos/providers tables share one shape: a real
// table at ≥sm, collapsed to stacked cards below (header hidden; each row a
// bordered card carrying its own field labels). These helpers hold that shape
// in one place so the three lists stay in lockstep.

// CARD_ROW_CLASS is the <tr> class: a bordered card <sm, a plain row ≥sm.
const CARD_ROW_CLASS = 'block rounded border border-line bg-surface-1 p-3 mb-3 sm:table-row sm:rounded-none sm:border-0 sm:bg-transparent sm:p-0 sm:mb-0';

// cardCell wraps one field as a <td>: label/value stacked <sm (label hidden at
// ≥sm, where the table header carries it), a real cell ≥sm. `muted` tints the
// value like the secondary columns. border-0 drops the inherited per-cell
// separator inside the card, restored as a row border at sm.
const cardCell = (label, inner, muted) =>
  `<td class="${muted ? 'muted ' : ''}block border-0 sm:table-cell sm:border-b"><span class="block text-muted text-sm sm:hidden">${label}</span>${inner}</td>`;

// dataTable renders the shared shell: headInner is the header <tr>; bodyId is
// the optional save-collector hook the config panels scrape.
function dataTable(headInner, rowsHtml, bodyId) {
  const id = bodyId ? ` id="${bodyId}"` : '';
  return `<table class="block sm:table w-full">
    <thead class="hidden sm:table-header-group">${headInner}</thead>
    <tbody${id} class="block sm:table-row-group">${rowsHtml}</tbody></table>`;
}

// runsTableHtml renders the fleet as a table of runRowHtml rows. Mobile-first
// responsive (ui-tailwind-spec T3): the wide table clips the `by` column on a
// phone, so at <640px it collapses to stacked cards (block table sub-elements,
// header hidden — each row carries its own field labels) and restores to a real
// table at sm.
function runsTableHtml(runs) {
  const rows = runs.map(runRowHtml).join('');
  const head = '<tr><th>run</th><th>workflow</th><th>item</th><th>repo</th><th>by</th><th>status</th><th>started</th><th></th></tr>';
  return dataTable(head, rows);
}

// runsFilter reads the toolbar into the shape runMatchesFilter expects.
function runsFilter() {
  return {
    status: $('runs-filter-status')?.value || '',
    workflow: $('runs-filter-workflow')?.value || '',
    repo: $('runs-filter-repo')?.value || '',
    origin: $('runs-filter-origin')?.value || '',
    text: ($('runs-filter-text')?.value || '').trim().toLowerCase(),
  };
}

// applyRunFilters narrows the fleet by the toolbar selections.
function applyRunFilters(list) {
  const filter = runsFilter();
  return list.filter(p => runMatchesFilter(p, filter));
}

// populateRunFilters fills the workflow/repo selects with the distinct values
// present in the fleet, preserving the current selection (fillOptions). The
// status/origin selects are fixed enums, seeded in the markup.
function populateRunFilters(runs) {
  fillOptions('runs-filter-workflow', distinct(runs.map(p => p.workflow_name || '')));
  fillOptions('runs-filter-repo', distinct(runs.map(runRepo)));
}

// runsFilterFromHash / runsFilterToHash make a narrowed fleet deep-linkable
// (web-ui-v2-spec U7): the filter lives in the Runs hash query so the view is
// shareable and bookmarkable. text rides on `q`; keys serialise in a fixed
// order and omit empties, so from→to is stable (the round-trip reproduces the
// hash). Hand-rolled on encodeURIComponent — no URLSearchParams dependency.
const RUNS_HASH_KEYS = [['status', 'status'], ['workflow', 'workflow'], ['repo', 'repo'], ['origin', 'origin'], ['q', 'text']];

function runsFilterFromHash(hash) {
  const out = { status: '', workflow: '', repo: '', origin: '', text: '' };
  const qi = hash.indexOf('?');
  if (qi < 0) return out;
  for (const pair of hash.slice(qi + 1).split('&')) {
    if (!pair) continue;
    const eq = pair.indexOf('=');
    const key = eq < 0 ? pair : pair.slice(0, eq);
    const val = eq < 0 ? '' : decodeURIComponent(pair.slice(eq + 1));
    const entry = RUNS_HASH_KEYS.find(e => e[0] === key);
    if (entry) out[entry[1]] = val;
  }
  return out;
}

function runsFilterToHash(filter) {
  const parts = [];
  for (const [key, field] of RUNS_HASH_KEYS) {
    const v = filter[field];
    if (v) parts.push(`${key}=${encodeURIComponent(v)}`);
  }
  return parts.length ? `runs?${parts.join('&')}` : 'runs';
}

// seedRunsToolbar writes a parsed filter into the toolbar controls. Dynamic
// selects (workflow/repo) must be populated first for a value to stick, so
// renderFleet seeds once per view entry after populateRunFilters.
function seedRunsToolbar(f) {
  const set = (id, v) => { const el = $(id); if (el) el.value = v; };
  set('runs-filter-status', f.status);
  set('runs-filter-workflow', f.workflow);
  set('runs-filter-repo', f.repo);
  set('runs-filter-origin', f.origin);
  set('runs-filter-text', f.text);
}

// onRunsFilterChange reflects the current toolbar into the address bar (so the
// narrowed fleet is shareable) then re-renders. replaceState fires no
// hashchange, so it updates the URL without a re-route/refetch.
function onRunsFilterChange() {
  history.replaceState(null, '', '#' + runsFilterToHash(runsFilter()));
  renderFleet();
}

// renderRunCounts fills the counts bar with the four fleet states
// (running/queued/needs-human/failed). needs-human comes from the summary's
// needs_human flag, not a status — a blocked run is still "running". An
// empty fleet clears the bar (.counts:empty then hides it).
function renderRunCounts(runs) {
  const el = $('run-counts');
  if (!runs.length) { el.innerHTML = ''; return; }
  const byStatus = (s) => runs.filter(p => p.status === s).length;
  el.innerHTML =
    countPill('running', byStatus('running')) +
    countPill('queued', byStatus('queued')) +
    countPill('needs-human', runs.filter(runNeedsHuman).length) +
    countPill('failed', byStatus('failed'));
}

// countPill renders one state count; a non-zero needs-human pill fills
// (loud) rather than outlines — the highest-attention treatment.
function countPill(state, n) {
  const loud = state === 'needs-human' && n ? ' loud' : '';
  return `<span class="count count-${state}${loud}">${n} ${escapeHtml(state)}</span>`;
}

// fmtDate renders an ISO timestamp as a compact relative time ("2m ago",
// "3h ago", "Jul 28") with the full local timestamp on hover. Empty or
// unparseable input yields a muted em dash rather than a raw nanosecond
// string.
function fmtDate(iso) {
  if (!iso) return '<span class="muted">—</span>';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return escapeHtml(iso);
  const secs = (Date.now() - d.getTime()) / 1000;
  let rel;
  if (secs < 0) rel = 'just now';
  else if (secs < 60) rel = Math.floor(secs) + 's ago';
  else if (secs < 3600) rel = Math.floor(secs / 60) + 'm ago';
  else if (secs < 86400) rel = Math.floor(secs / 3600) + 'h ago';
  else if (secs < 7 * 86400) rel = Math.floor(secs / 86400) + 'd ago';
  else rel = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  const full = d.toLocaleString(undefined,
    { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  return `<span title="${escapeHtml(full)}">${escapeHtml(rel)}</span>`;
}

// fmtDuration renders a stage's elapsed time (web-ui-v2-spec U2). No start is
// the em-dash placeholder; a start with no end is a still-running stage;
// otherwise it is end-minus-start as "N.Ns" under a minute, "Nm SSs" above.
function fmtDuration(startIso, endIso) {
  if (!startIso) return '<span class="muted">—</span>';
  if (!endIso) return '<span class="muted">running…</span>';
  const ms = new Date(endIso).getTime() - new Date(startIso).getTime();
  if (isNaN(ms)) return '<span class="muted">—</span>';
  const secs = Math.max(0, ms) / 1000;
  if (secs < 60) return escapeHtml(secs.toFixed(1) + 's');
  const m = Math.floor(secs / 60), s = Math.floor(secs % 60);
  return escapeHtml(`${m}m ${String(s).padStart(2, '0')}s`);
}

// runRowHtml builds one fleet row: the run (id → #run/<id>) alongside its
// provenance (web-ui-spec W6, web-ui-v2-spec U7) — the workflow it ran (→
// #workflow/<name>), the item it was dispatched for (→ #items), the repo it
// touched, and its origin (item/workflow/manual). Every attacker-controlled
// field (workflow_name, item_ref, repo, status come from the DOT source /
// external item) is escaped before it reaches innerHTML;
// navigation is pure-hash so no inline JS carries the id. A live blocked run
// carries the loud needs-human chip — the fleet's highest-attention flag.
function runRowHtml(p) {
  const chip = runNeedsHuman(p) ? '<span class="chip needs-human">needs human</span>' : '';
  const id = p.id || '';
  return `
    <tr class="${CARD_ROW_CLASS}">
      ${cardCell('run', `<a href="#run/${escapeHtml(id)}" title="${escapeHtml(id)}">${escapeHtml(id.slice(0, 8) || id)}</a>`)}
      ${cardCell('workflow', runWorkflowCell(p), true)}
      ${cardCell('item', runItemCell(p), true)}
      ${cardCell('repo', runRepoCell(p), true)}
      ${cardCell('by', runOriginCell(p), true)}
      ${cardCell('status', `${stateBadge(p.status)}${chip}`)}
      ${cardCell('started', fmtDate(p.started_at), true)}
      ${cardCell('', runCancelButton(p))}
    </tr>`;
}

// runWorkflowCell links a run back to its workflow definition. workflow_name
// is the catalog dir the run was dispatched from — the exact handle
// #workflow/<name> resolves. A raw dot run (POST /pipelines) has none, so it
// falls back to the graph_name (the DOT digraph id) as plain text: there is
// no catalog entry to link to.
function runWorkflowCell(p) {
  const name = p.workflow_name || '';
  if (name) return `<a href="#workflow/${encodeURIComponent(name)}">${escapeHtml(name)}</a>`;
  return escapeHtml(p.graph_name || '');
}

// runItemCell links a run back to its source item. There is no per-item hash
// route in v1, so the link lands on the Items view (where the item's own row
// links back to this run — web-ui-spec §Views interlinking); the full ref is
// the title. A run with no item ref shows nothing.
function runItemCell(p) {
  const ref = p.item_ref || '';
  if (!ref) return '';
  return `<a href="#items" title="${escapeHtml(ref)}">${escapeHtml(ref)}</a>`;
}

// runOrigin classifies how a run was launched (web-ui-v2-spec U7 provenance,
// the "started-by" facet). The daemon has no user identity — tailnet = trust,
// per-user auth is a v2 non-goal — so origin, not a person, is what the fleet
// can honestly attribute: an item dispatch, a workflow run, or a raw manual
// submission. A dispatch also carries a workflow, so item wins.
function runOrigin(p) {
  if (p.item_ref) return 'item';
  if (p.workflow_name) return 'workflow';
  return 'manual';
}

// runRepo labels the repo a run touched: the dispatched owner/name when known
// (summary `repo`, stamped at submit), else the cwd's last path segment so a
// raw-dot run against a checkout still shows something recognisable. Empty
// when neither is known.
function runRepo(p) {
  if (p.repo) return p.repo;
  const cwd = (p.cwd || '').replace(/\/+$/, '');
  if (!cwd) return '';
  return cwd.slice(cwd.lastIndexOf('/') + 1);
}

// runRepoCell renders the repo provenance cell; every value is escaped (repo
// and cwd both originate from external items / DOT source). No repo is the
// muted placeholder, matching the fleet's other empty cells.
function runRepoCell(p) {
  const repo = runRepo(p);
  if (!repo) return '<span class="muted">—</span>';
  return `<span title="${escapeHtml(repo)}">${escapeHtml(repo)}</span>`;
}

// runOriginCell renders the origin provenance cell. The origin is a fixed
// enum (item/workflow/manual), carried in an origin-<kind> class for styling.
function runOriginCell(p) {
  const o = runOrigin(p);
  return `<span class="origin origin-${o}">${o}</span>`;
}

// runMatchesFilter narrows the polled fleet client-side (web-ui-v2-spec U7),
// mirroring eventMatchesFilter. status is exact except the needs-human
// pseudo-status, which keys the run's live-blocked flag (needs_human is
// orthogonal to status — a blocked run is still "running"). workflow / repo /
// origin are exact; text matches case-insensitively across id, item ref,
// workflow and repo. All clauses AND together; an empty filter matches all.
function runMatchesFilter(p, filter) {
  if (filter.status) {
    const ok = filter.status === 'needs-human' ? runNeedsHuman(p) : p.status === filter.status;
    if (!ok) return false;
  }
  if (filter.workflow && (p.workflow_name || '') !== filter.workflow) return false;
  if (filter.repo && runRepo(p) !== filter.repo) return false;
  if (filter.origin && runOrigin(p) !== filter.origin) return false;
  const q = (filter.text || '').toLowerCase();
  if (!q) return true;
  const hay = `${p.id || ''} ${p.item_ref || ''} ${p.workflow_name || ''} ${runRepo(p)}`.toLowerCase();
  return hay.includes(q);
}

// runCancelButton renders a cancel trigger for a live run only; a terminal
// run (completed/failed/cancelled) has nothing to cancel. The run id rides
// on a data-* attribute (escaped) rather than an inline onclick, matching
// the page's no-inline-JS convention; a delegated click on #run-list fires
// the cancel (web-ui-spec §Runs view).
function runCancelButton(p) {
  if (isTerminal(p)) return '';
  return `<button data-cancel data-cancel-id="${escapeHtml(p.id)}">cancel</button>`;
}

// isTerminal reports whether a run has finished. A terminal run offers no
// cancel, and cannot be waiting on a human — so cancelling a needs-human
// run clears its flag on the next poll rather than leaving it nagging.
function isTerminal(p) {
  return p.status === 'completed' || p.status === 'failed' || p.status === 'cancelled';
}

// runActionsHtml renders the run-detail control buttons (web-ui-v2-spec U6). A
// terminal run with a known workflow offers re-run (reopens the Run modal
// prefilled to resubmit workflow+vars+repo); a failed run additionally offers
// re-run-from-failure (POST …/restart, resume from checkpoint) — but only when
// the daemon reports the run resumable (a reloaded shell or a local/vm run
// cannot resume; re-running from failure there would crash or silently re-run
// every side-effecting node). A live run offers neither — cancel lives in the
// fleet. The run id rides a data-* attr (escaped), fired by a delegated click,
// matching the cancel-button convention.
function runActionsHtml(summary) {
  summary = summary || {};
  const id = escapeHtml(summary.id || '');
  const buttons = [];
  if (isTerminal(summary) && summary.workflow_name) {
    buttons.push(`<button data-rerun data-run-id="${id}">re-run</button>`);
  }
  if (summary.status === 'failed' && summary.resumable) {
    buttons.push(`<button data-restart data-run-id="${id}">re-run from failure</button>`);
  }
  return buttons.join(' ');
}

// parseRef rebuilds the structured item ref from a run's opaque
// source:type:external_id tag (items.ItemRef.String). The external id may hold
// its own ':' so the remainder is rejoined; a missing or short tag yields null
// (a standalone re-run links no item).
function parseRef(tag) {
  const parts = (tag || '').split(':');
  if (parts.length < 3 || !parts[0] || !parts[1] || !parts.slice(2).join(':')) return null;
  return { source: parts[0], type: parts[1], external_id: parts.slice(2).join(':') };
}

// rerunOpts reshapes a run summary into the openRunForm options a re-run
// resubmits (web-ui-v2-spec U6): the workflow to pre-select, the launch vars as
// the field prefill, and the linked item ref (null when standalone). repo falls
// back to the summary's repo when the vars map omits it.
function rerunOpts(summary) {
  summary = summary || {};
  const prefill = Object.assign({}, summary.vars);
  if (!prefill.repo && summary.repo) prefill.repo = summary.repo;
  return {
    workflowName: summary.workflow_name,
    prefill,
    itemRef: parseRef(summary.item_ref),
  };
}

// runNeedsHuman gates the needs-human flag on the run still being live, so
// a finished run whose question was never formally answered (e.g. it was
// cancelled mid-wait) stops flagging in the fleet counts and rows.
function runNeedsHuman(p) {
  return !!p.needs_human && !isTerminal(p);
}

// cancelRun confirms then POSTs /pipelines/{id}/cancel. It does not
// optimistically mutate the row — the ~2.5s poll re-reflects the run's true
// state (cancellation is best-effort server-side), so a failed cancel
// simply shows the run still running on the next tick.
async function cancelRun(id) {
  if (!id || !confirm('Cancel this run?')) return;
  try {
    await postJSON(`/pipelines/${id}/cancel`, {});
  } catch (e) { /* transient; the next poll re-reflects the true state */ }
  fetchRuns();
}

// ---- run view ----------------------------------------------------------
async function openRun(id) {
  teardownRun();
  currentRun = id;
  selectedNode = null;
  for (const k in nodeLog) delete nodeLog[k];
  for (const k in nodeState) delete nodeState[k];
  for (const k in nodeTiming) delete nodeTiming[k];
  timeline.length = 0;
  highlightNav('runs');
  showView('run-view');
  $('run-title').textContent = id;
  $('run-failure').innerHTML = '';
  $('run-blocked').innerHTML = '';
  if ($('tl-text')) $('tl-text').value = '';
  if ($('tl-kind')) $('tl-kind').value = '';
  renderTimeline();
  $('node-pane').innerHTML = '<p class="muted">Click a node to inspect it.</p>';
  $('run-artifact-view').innerHTML = '';
  $('run-actions').innerHTML = '';
  loadRunActions(id);
  await loadGraph(id);
  attachStream(id);
  loadArtifacts();
  if (dockTimer) clearInterval(dockTimer);
  refreshDock();
  dockTimer = setInterval(refreshDock, 3000);
}

// loadRunActions fetches the run summary and renders the run-detail controls
// (re-run / re-run-from-failure). Stored so a delegated click can rebuild the
// Run modal without re-fetching. A load failure leaves the header actionless
// rather than blocking the run view.
let currentRunSummary = null;
async function loadRunActions(id) {
  try {
    const r = await fetch(`/pipelines/${id}`);
    if (!r.ok) return;
    currentRunSummary = await r.json();
  } catch (e) { return; }
  if (currentRun !== id) return;   // navigated away while fetching
  $('run-actions').innerHTML = runActionsHtml(currentRunSummary);
}

// restartRun confirms then POSTs /pipelines/{id}/restart (re-run-from-failure).
// On success it reopens the run so the graph and stream re-attach to the
// resumed run; the poll/stream re-reflect the true state on failure.
async function restartRun(id) {
  if (!id || !confirm('Re-run this run from where it failed?')) return;
  try {
    const r = await postJSON(`/pipelines/${id}/restart`, {});
    if (!r.ok) return;
  } catch (e) { return; }
  openRun(id);
}

async function loadGraph(id) {
  // The layout dropdown forwards a graphviz engine; dot is the default, so it
  // needs no query param (the server treats absent/unknown as dot).
  const engine = $('graph-engine')?.value;
  const q = engine && engine !== 'dot' ? `?engine=${encodeURIComponent(engine)}` : '';
  try {
    const r = await fetch(`/pipelines/${id}/graph${q}`);
    $('graph').innerHTML = r.ok ? await r.text() : errorState('graph unavailable');
  } catch (e) { $('graph').innerHTML = errorState('graph unavailable'); return; }
  // Make each graphviz node clickable; its DOT id lives in <title>.
  $('graph').querySelectorAll('g.node').forEach(g => {
    const id = g.querySelector('title')?.textContent;
    if (!id) return;
    g.addEventListener('click', () => selectNode(id));
    if (nodeState[id]) paintNode(id, nodeState[id]);
  });
}

// paintNode colours a graphviz node's shape by status.
function paintNode(id, cls) {
  nodeState[id] = cls;
  const g = [...$('graph').querySelectorAll('g.node')]
    .find(g => g.querySelector('title')?.textContent === id);
  if (!g) return;
  const color = { running: 'var(--state-running)', completed: 'var(--state-success)',
                  failed: 'var(--state-failed)', retrying: 'var(--state-retrying)' }[cls];
  g.classList.toggle('pulse', cls === 'running');
  g.querySelectorAll('polygon, ellipse, path').forEach(shape => {
    // Inline style, not a presentation attribute: the graph restyle sets a
    // default node stroke via the stylesheet, which an attribute would lose to.
    if (color) shape.style.stroke = color;
  });
}

function attachStream(id) {
  if (es) es.close();
  es = new EventSource(`/pipelines/${id}/events`);
  // Idempotent replay: every (re)connect replays the run's full history
  // from the start before live events. `applied` counts events already
  // handled for this run; `pos` is the position within the current
  // connection's stream (reset on each open). Events at or below `applied`
  // were seen on an earlier connection, so skip them — otherwise a mid-run
  // reconnect re-appends every node-log chunk.
  let applied = 0, pos = 0;
  es.onopen = () => { pos = 0; };
  const on = (kind, fn) => es.addEventListener(kind, e => {
    pos++;
    if (pos <= applied) return;
    applied = pos;
    fn(JSON.parse(e.data));
  });
  // Record each stage's start/end from the stream so the inspector can show
  // elapsed time without a timing field on GET …/stages/{node}.
  const timing = (id) => (nodeTiming[id] = nodeTiming[id] || {});
  // On a terminal event, close the stream. The server ends the SSE
  // connection for finished runs, so leaving it open lets EventSource
  // reconnect every few seconds and replay the whole history again,
  // duplicating node-log chunks each time.
  // On a terminal event, stop the dock poll too: the server clears a finished
  // run's questions, so one final refreshDock reconciles to empty and the
  // interval would otherwise poll a dead run forever in an open tab.
  const done = () => {
    if (es) es.close();
    if (dockTimer) { clearInterval(dockTimer); dockTimer = null; }
    renderDock([]); refreshDock();
  };
  // Every kind is registered through one table so a single dispatch point
  // handles the run (kinds with no side-effect map to null). Registering all
  // of them keeps the applied/pos replay cursor authoritative for the whole
  // stream — the U3 timeline recorder hangs off this same dispatch.
  const HANDLERS = {
    stage_started:   ev => { timing(ev.node_id).start = ev.ts; paintNode(ev.node_id, 'running'); },
    stage_completed: ev => { timing(ev.node_id).end = ev.ts; paintNode(ev.node_id, 'completed'); },
    stage_failed:    ev => { timing(ev.node_id).end = ev.ts; paintNode(ev.node_id, 'failed'); },
    stage_retrying:  ev => paintNode(ev.node_id, 'retrying'),
    stage_progress:  ev => appendProgress(ev),
    pipeline_completed: () => { done(); loadArtifacts(); },
    pipeline_failed:    ev => { $('run-failure').innerHTML = failureBannerHtml(ev.message); done(); loadArtifacts(); },
    // Gate events drive the dock live (U5): a run blocks (interview_started) or
    // resumes (answered/timeout) between polls, so refresh the dock + banner
    // the moment the stream says so rather than waiting for the poll fallback.
    interview_started:  () => refreshDock(),
    interview_answered: () => refreshDock(),
    interview_timeout:  () => refreshDock(),
  };
  // Every event runs its kind's side-effect (if any) and — unless it is a
  // high-frequency kind (TIMELINE_SKIP) — lands in the U3 timeline. One
  // dispatch keeps the applied/pos cursor authoritative for both.
  for (const kind of EVENT_KINDS) {
    const fn = HANDLERS[kind];
    const record = !TIMELINE_SKIP.has(kind);
    on(kind, ev => { if (record) recordTimelineEvent(kind, ev); if (fn) fn(ev); });
  }
  es.onerror = () => { /* transient; EventSource retries on its own */ };
}

// appendProgress records assistant_delta / tool_call chunks per node.
function appendProgress(ev) {
  const node = ev.node_id; if (!node) return;
  const kind = ev.detail && ev.detail.kind;
  let html = '';
  if (kind === 'assistant_delta') html = escapeHtml(ev.message || '');
  else if (kind === 'tool_call') {
    const name = (ev.detail && ev.detail.tool_name) || 'tool';
    html = `<span class="tool">[${escapeHtml(name)}] ${escapeHtml(ev.message || '')}</span>\n`;
  } else if (ev.message) html = escapeHtml(ev.message) + '\n';
  if (!html) return;
  (nodeLog[node] = nodeLog[node] || []).push(html);
  if (node === selectedNode) {
    const log = $('node-log');
    if (log) { log.innerHTML += html; log.scrollTop = log.scrollHeight; }
  }
}

// recordTimelineEvent appends one streamed event to the run's event log and
// its row to the timeline (web-ui-v2-spec U3). Appending a single row keeps a
// run of N events at O(N) total work — a full renderTimeline() rebuild per
// event would be O(N^2) and freeze the main thread on any real run.
function recordTimelineEvent(kind, ev) {
  timeline.push({ kind, ev });
  if (timeline.length > TIMELINE_MAX) {
    // Over the cap: drop the oldest and rebuild the (now bounded) window. This
    // is the only O(TIMELINE_MAX) path and it fires at most once per event once
    // capped — still bounded, never the unbounded O(N) of the pre-cap rebuild.
    timeline.shift();
    renderTimeline();
    return;
  }
  appendTimelineRow(kind, ev);
}

// appendTimelineRow adds one event's row to #tl-rows when it passes the active
// filter, clearing the empty-state placeholder on the first row and following
// the tail. Full-rebuild paths (filter change, run reset) go through
// renderTimeline instead.
function appendTimelineRow(kind, ev) {
  const rows = $('tl-rows');
  if (!rows) return;
  if (!eventMatchesFilter(kind, ev, timelineFilter())) return;
  if (rows.querySelector('.state')) rows.innerHTML = '';
  rows.insertAdjacentHTML('beforeend', timelineRowHtml(kind, ev));
  rows.scrollTop = rows.scrollHeight;
}

// timelineFilter reads the active kind + text filter from the controls.
function timelineFilter() {
  return { kind: $('tl-kind')?.value || '', text: $('tl-text')?.value || '' };
}

// renderTimeline rebuilds #tl-rows from the recorded timeline through the
// active filter. Used on a filter change or run reset — a live event appends a
// single row (appendTimelineRow) instead. An empty result distinguishes "no
// events yet" from "filtered everything out".
function renderTimeline() {
  const rows = $('tl-rows');
  if (!rows) return;
  const f = timelineFilter();
  const html = timeline
    .filter(e => eventMatchesFilter(e.kind, e.ev, f))
    .map(e => timelineRowHtml(e.kind, e.ev))
    .join('');
  rows.innerHTML = html || emptyState(timeline.length ? 'no events match the filter' : 'no events yet');
}

// toolCallHtml renders one persisted tool_calls/*.json payload (web-ui-v2-spec
// U2): the tool name as a collapsible summary over the pretty-printed payload.
// Every field is attacker-controlled, so both label and body are escaped.
function toolCallHtml(raw) {
  const name = raw.tool_name || raw.tool || raw.hook_name || 'tool';
  let body;
  try { body = JSON.stringify(raw, null, 2); } catch (e) { body = String(raw); }
