  return `<details class="tool-call"><summary>${escapeHtml(name)}</summary>` +
         `<pre class="overflow-x-auto">${escapeHtml(body)}</pre></details>`;
}

// eventMatchesFilter is the U3 timeline filter predicate. An empty kind keeps
// any kind; a kind keeps only that kind. An empty text keeps any event; text
// matches case-insensitively against the message and node id. Both conditions
// must hold, so kind + text narrow together.
function eventMatchesFilter(kind, ev, filter) {
  if (filter.kind && kind !== filter.kind) return false;
  const q = (filter.text || '').toLowerCase();
  if (!q) return true;
  const hay = `${ev.message || ''} ${ev.node_id || ''}`.toLowerCase();
  return hay.includes(q);
}

// failureBannerHtml renders the run header's failure reason prominently
// (web-ui-v2-spec U3): the reason is why the run failed and is the first thing
// a debugger needs. An empty reason renders nothing — a healthy run shows no
// banner. The reason is attacker-controlled and escaped.
function failureBannerHtml(reason) {
  if (!reason) return '';
  return `<p class="banner error run-failure">${escapeHtml(reason)}</p>`;
}

// blockedBannerHtml renders the loud run-header banner for a run waiting on a
// human (web-ui-v2-spec U5). Distinct from the failure banner: a blocked run
// is not failed, it needs an answer. No open questions → no banner. The count
// tells the teammate how many gates are open; question text is not inlined
// here (it lives in the dock), so nothing attacker-controlled reaches the DOM,
// but the count is escaped for symmetry with the other banners.
function blockedBannerHtml(questions) {
  const n = (questions || []).length;
  if (!n) return '';
  const noun = n === 1 ? 'answer' : 'answers';
  return `<p class="banner blocked" role="alert">Waiting on you — ${escapeHtml(String(n))} open ${noun}.</p>`;
}

// timelineRowHtml renders one run event as a timeline row (web-ui-v2-spec U3):
// relative timestamp (full ISO on hover, via fmtDate), a kind badge, the node
// id when the event has one, and the message. Every field is attacker-
// controlled — kind, node and message are all escaped inert.
function timelineRowHtml(kind, ev) {
  const node = ev.node_id ? `<span class="tl-node">${escapeHtml(ev.node_id)}</span>` : '';
  const msg = ev.message ? `<span class="tl-msg">${escapeHtml(ev.message)}</span>` : '';
  return `<div class="tl-row">` +
    `<span class="tl-time">${fmtDate(ev.ts)}</span>` +
    `<span class="badge tl-kind">${escapeHtml(kind)}</span>` +
    node + msg + `</div>`;
}

// isDiffPath reports whether an artifact path looks like a produced diff (U4):
// a .diff/.patch suffix or a file literally named "diff". Used to auto-render
// the run's change without a fixed server-side diff artifact.
function isDiffPath(path) {
  const name = String(path).split('/').pop();
  return /\.(diff|patch)$/.test(name) || name === 'diff';
}

// fmtBytes renders a byte count as a short human-readable size.
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  const units = ['KB', 'MB', 'GB'];
  let u = -1;
  do { n /= 1024; u++; } while (n >= 1024 && u < units.length - 1);
  return n.toFixed(1) + ' ' + units[u];
}

// artifactListHtml renders the U4 artifact browser: one clickable row per file,
// carrying its logs-root-relative path (data-path, read by the click handler)
// and a human size. Directories are structural — shown as headers, not
// clickable rows. Paths are attacker-controlled (a run writes arbitrary names)
// and escaped. An empty listing renders an empty state.
function artifactListHtml(entries) {
  entries = entries || [];
  if (!entries.length) return emptyState('No artifacts produced yet.');
  return entries.map(e => {
    const path = escapeHtml(e.path);
    if (e.is_dir) return `<div class="artifact-dir">${path}/</div>`;
    return `<button class="artifact-row" data-path="${path}">` +
      `<span class="artifact-name">${path}</span>` +
      `<span class="artifact-size muted">${escapeHtml(fmtBytes(e.size))}</span></button>`;
  }).join('');
}

// diffHtml renders a unified diff (U4) line-by-line: added lines get a
// diff-add class, removed lines diff-del, hunk headers (@@) diff-hunk, and
// context lines render plain. File-header lines (+++/---) are treated as hunk
// chrome, not source add/remove, so they don't paint green/red. Every line is
// escaped — a diff body is arbitrary source and thus attacker-controlled. Empty
// input renders nothing, so a run that produced no diff shows a clean empty
// state rather than a stray box.
function diffHtml(text) {
  const lines = String(text || '').replace(/\n$/, '').split('\n');
  if (lines.length === 1 && lines[0] === '') return '';
  return lines.map(line => {
    let cls = 'diff-ctx';
    if (line.startsWith('@@')) cls = 'diff-hunk';
    else if (line.startsWith('+++') || line.startsWith('---')) cls = 'diff-file';
    else if (line.startsWith('+')) cls = 'diff-add';
    else if (line.startsWith('-')) cls = 'diff-del';
    return `<span class="diff-line ${cls}">${escapeHtml(line)}</span>`;
  }).join('');
}

// stageDetailHtml builds the U2 inspector panel from a stage's detail
// (GET …/stages/{node}) and its timing (start/end from the event stream).
// It surfaces status, elapsed time, prompt, response and each tool call, then
// the live-tail #node-log container seeded with any chunks already streamed.
// Every stage field is attacker-controlled and escaped. An empty status.json
// (stage still running) reads as "running", not blank.
function stageDetailHtml(id, detail, timing, logHtml) {
  const status = detail.status || 'running';
  const calls = (detail.tool_calls || []).map(toolCallHtml).join('');
  const section = (title, body) => body
    ? `<h4>${title}</h4><pre class="stage-text overflow-x-auto">${escapeHtml(body)}</pre>` : '';
  return `
    <h3>${escapeHtml(id)}</h3>
    <div class="stage-meta">
      ${stateBadge(status)}
      <span class="muted">${fmtDuration(timing.start, timing.end)}</span>
    </div>
    ${section('Prompt', detail.prompt)}
    ${section('Response', detail.response)}
    ${calls ? `<h4>Tool calls</h4>${calls}` : ''}
    <h4>Output</h4>
    <div id="node-log" class="overflow-x-auto">${logHtml || ''}</div>`;
}

// selectNode opens the U2 inspector for a node: fetch its stage detail
// (GET …/stages/{node}) and render it. selectedNode guards the race where a
// later click resolves before an earlier one, so a slow fetch never overwrites
// a newer selection. The live tail keeps flowing into #node-log via
// appendProgress once the panel is in place.
async function selectNode(id) {
  selectedNode = id;
  const pane = $('node-pane');
  if (pane) pane.innerHTML = loadingState();
  let detail;
  try {
    const r = await fetch(`/pipelines/${currentRun}/stages/${id}`);
    if (!r.ok) throw new Error(String(r.status));
    detail = await r.json();
  } catch (e) {
    if (selectedNode === id && pane) pane.innerHTML = errorState('stage detail unavailable');
    return;
  }
  if (selectedNode !== id) return;          // a later click won the race
  if (pane) pane.innerHTML = stageDetailHtml(id, detail, nodeTiming[id] || {}, (nodeLog[id] || []).join(''));
  const log = $('node-log'); if (log) log.scrollTop = log.scrollHeight;
}

// ARTIFACT_RENDER_CAP bounds how much artifact text the run detail renders
// inline (U4). A multi-megabyte diff or log would freeze the tab, so anything
// larger is skipped (diff) or truncated (inline view) — the raw file is still
// downloadable via GET …/artifacts/{path}.
const ARTIFACT_RENDER_CAP = 512 * 1024;

// artifactURL percent-encodes each path segment (U4) so a file whose name
// holds #, ?, %, or a space stays reachable, while the / separators between
// segments survive for the server's {path...} match.
function artifactURL(path) {
  return String(path).split('/').map(encodeURIComponent).join('/');
}

// loadArtifacts fills the U4 Diff + Artifacts regions for the current run. It
// lists the run's logs tree (GET …/artifacts), renders the browser, then
// auto-fetches the first diff-looking file and paints it in the Diff region.
// Everything degrades to an empty/error state — a run with no artifacts yet
// reads clean, not broken. Wiring the click handler here (not at boot) keeps it
// bound to the freshly-rendered list.
async function loadArtifacts() {
  if (!currentRun) return;
  const run = currentRun;                 // guard: a run switch mid-fetch must
  const stale = () => currentRun !== run; // not paint this run into the shared DOM
  const listEl = $('run-artifacts-list');
  const diffEl = $('run-diff-body');
  if (listEl) listEl.innerHTML = loadingState();
  if (diffEl) diffEl.innerHTML = '';
  let entries;
  try {
    const r = await fetch(`/pipelines/${run}/artifacts`);
    if (!r.ok) throw new Error(String(r.status));
    entries = (await r.json()).entries || [];
  } catch (e) {
    if (listEl && !stale()) listEl.innerHTML = errorState('artifacts unavailable');
    return;
  }
  if (stale()) return;
  if (listEl) {
    listEl.innerHTML = artifactListHtml(entries);
    listEl.onclick = e => {
      const row = e.target.closest && e.target.closest('.artifact-row');
      if (row) viewArtifact(row.getAttribute('data-path'));
    };
  }
  const diff = entries.find(e => !e.is_dir && isDiffPath(e.path));
  if (!diffEl) return;
  if (!diff) { diffEl.innerHTML = emptyState('This run produced no diff.'); return; }
  if (diff.size > ARTIFACT_RENDER_CAP) {
    diffEl.innerHTML = emptyState(`Diff too large to render inline (${fmtBytes(diff.size)}). ` +
      `Open it from Artifacts below.`);
    return;
  }
  try {
    const r = await fetch(`/pipelines/${run}/artifacts/${artifactURL(diff.path)}`);
    if (!r.ok) throw new Error(String(r.status));
    const text = await r.text();
    if (!stale()) diffEl.innerHTML = diffHtml(text);
  } catch (e) {
    if (!stale()) diffEl.innerHTML = errorState('diff unavailable');
  }
}

// viewArtifact fetches a single artifact and shows it inline (U4): a diff-looking
// file renders coloured, anything else as escaped text. The body is
// attacker-controlled, so it is never inserted raw.
async function viewArtifact(path) {
  if (!currentRun) return;
  const run = currentRun;
  const view = $('run-artifact-view');
  if (!view) return;
  view.innerHTML = loadingState();
  let body;
  try {
    const r = await fetch(`/pipelines/${run}/artifacts/${artifactURL(path)}`);
    if (!r.ok) throw new Error(String(r.status));
    body = await r.text();
  } catch (e) {
    if (currentRun === run) view.innerHTML = errorState('could not load ' + escapeHtml(path));
    return;
  }
  if (currentRun !== run) return;         // a run switch won the race
  let note = '';
  if (body.length > ARTIFACT_RENDER_CAP) {
    note = `<p class="muted">Showing the first ${fmtBytes(ARTIFACT_RENDER_CAP)} of ` +
      `${fmtBytes(body.length)} — truncated.</p>`;
    body = body.slice(0, ARTIFACT_RENDER_CAP);
  }
  const inner = isDiffPath(path)
    ? `<div class="diff min-w-0">${diffHtml(body)}</div>`
    : `<pre class="stage-text overflow-x-auto">${escapeHtml(body)}</pre>`;
  view.innerHTML = `<h4>${escapeHtml(path)}</h4>${note}${inner}`;
}

// ---- config view -------------------------------------------------------
// The Config view edits the whole daemon-owned config doc (config-screen-
// spec C4): hand-built panels over GET /config, saved back whole via
// PUT /config. showConfig refetches on every entry (no cache — a stale or
// failure-cached config is worse than a reload) so edits made elsewhere and
// the true redaction state always show.
async function showConfig(warnings) {
  const body = $('config-body');
  body.innerHTML = loadingState();
  setConfigStatus('');
  let doc;
  try {
    const r = await fetch('/config');
    if (!r.ok) throw new Error('status ' + r.status);
    doc = await r.json();
  } catch (e) {
    body.innerHTML = errorState('could not load config');
    return;
  }
  configLoaded = doc;
  renderConfig(doc, warnings);
}

// renderConfig paints the panels from the loaded doc. Each panel is a pure
// name→HTML function so it is unit-testable via the node vm harness. Soft
// save-warnings (from a preceding PUT) are threaded to the Repos panel so
// they surface inline on the offending rows as well as in the top banner.
function renderConfig(doc, warnings) {
  linearClear = false;
  $('config-body').innerHTML =
    reposPanelHtml(doc.repos, warnings, doc.vm_images) + linearPanelHtml(doc.linear, linearClear) + providersPanelHtml(doc);
  setConfigDirty(false);
}

// setConfigStatus shows a save result above the panels: an error (structural
// rejection — nothing saved), a warning (soft — saved with caveats), or ok.
// Empty text clears it.
function setConfigStatus(text, kind) {
  const el = $('config-status');
  if (!el) return;
  el.textContent = text || '';
  el.className = text ? 'banner ' + (kind || '') : '';
}

// reposPanelHtml renders the Repos panel: one editable row per registered
// repo — owner/name, checkout path, and the standard check commands — plus
// an add-repo control. Every stored value is external to the HTML context,
// so all are escaped. The row inputs carry data-* hooks the save collector
// scrapes.
function reposPanelHtml(repos, warnings, vmImages) {
  const names = Object.keys(repos || {}).sort();
  // Empty-state hint spans every column (owner/name + path + runner + image +
  // each standard check + the remove control) so a fresh config reads as "none
  // yet, add one" rather than a bare header (config-screen-spec C5).
  const cols = 5 + STANDARD_CHECKS.length;
  const rows = names.length
    ? names.map(name => repoRowHtml(name, repos[name] || {}, repoWarning(name, warnings), vmImages)).join('')
    : `<tr data-empty-hint><td class="muted" colspan="${cols}">No repos registered — add one.</td></tr>`;
  // Mobile-first responsive (ui-tailwind-spec T2): the wide table overflows a
  // phone, so at <640px it collapses to stacked cards (block table sub-elements,
  // header hidden — each row carries its own field labels) and restores to a
  // real table at sm.
  const head = `<tr><th>owner/name</th><th>path</th><th>runner</th><th>image</th>${
    STANDARD_CHECKS.map(c => `<th>${escapeHtml(c)}</th>`).join('')}<th></th></tr>`;
  return `<section class="config-panel card" id="config-repos">
    <h3>Repos</h3>
    <p class="muted">Registered repos and their check commands — the run-form dropdown and the check backbone read these.</p>
    ${dataTable(head, rows, 'config-repos-rows')}
    <p><button type="button" data-repo-add>add repo</button></p>
  </section>`;
}

// repoRowHtml renders one repo row. An empty name/path (the add-repo case)
// yields a blank editable row. A non-empty warning (a soft save-warning for
// this repo, e.g. an unresolved path) surfaces inline under the path input
// so the reject-vs-warn distinction lands on the offending row, not only in
// the top banner (config-screen-spec C5).
function repoRowHtml(name, rc, warning, vmImages) {
  const checks = rc.checks || {};
  const checkCells = STANDARD_CHECKS.map(c =>
    cardCell(escapeHtml(c), `<input class="w-full sm:w-auto" data-check="${escapeHtml(c)}" value="${escapeHtml(checks[c] || '')}">`)).join('');
  const warn = warning
    ? `<div class="config-note" data-repo-warning>⚠ ${escapeHtml(warning)}</div>` : '';
  const runner = rc.runner || '';
  return `<tr data-repo-row class="${CARD_ROW_CLASS}">
    ${cardCell('owner/name', `<input class="w-full sm:w-auto" data-repo-name value="${escapeHtml(name)}" placeholder="owner/name">`)}
    ${cardCell('path', `<input class="w-full sm:w-auto" data-repo-path value="${escapeHtml(rc.path || '')}" placeholder="/path/to/checkout">${warn}`)}
    ${cardCell('runner', runnerSelectHtml(runner))}
    ${cardCell('image', imageSelectHtml((rc.vm && rc.vm.image) || '', runner, vmImages))}
    ${checkCells}
    ${cardCell('', '<button type="button" data-repo-remove title="remove repo">&times;</button>')}
  </tr>`;
}

// runnerSelectHtml renders the per-repo runner (launcher placement) select: a
// blank "(default)" — leave the daemon --runner default — plus the fixed
// direct|local|vm placements, the declared one selected. data-repo-runner is
// the save-collector hook and the change handler that toggles the row's image
// select (per-repo VM config, VM4).
function runnerSelectHtml(runner) {
  const opts = ['', 'direct', 'local', 'vm'].map(v =>
    `<option value="${escapeHtml(v)}"${v === runner ? ' selected' : ''}>${v || '(default)'}</option>`).join('');
  return `<select class="w-full sm:w-auto" data-repo-runner>${opts}</select>`;
}

// imageSelectHtml renders the per-repo VM image select: a blank "(default)"
// image plus each registered vm_images name, the declared one selected. It is
// only meaningful when the runner is vm, so it is disabled otherwise (the save
// collector likewise drops the image off-vm). Names are external → escaped.
// isNonVMPlacement reports an EXPLICIT non-vm runner (direct|local), where a
// vm.image is meaningless. An unset runner is not one — it inherits the
// daemon default, which may be vm (per-repo VM config, VM4).
function isNonVMPlacement(runner) {
  return runner === 'direct' || runner === 'local';
}

function imageSelectHtml(image, runner, vmImages) {
  const names = Object.keys(vmImages || {}).sort();
  // The registry is nix/CLI-managed and drifts independently of the config, so
  // a repo may be pinned to an image no longer registered — still a valid
  // persisted ref (dispatch falls back to default). Union it in so the select
  // represents and round-trips the stored value instead of collapsing it to
  // (default) and wiping the pin on save (per-repo VM config, VM4).
  if (image && !names.includes(image)) names.push(image);
  const opts = [''].concat(names).map(v =>
    `<option value="${escapeHtml(v)}"${v === image ? ' selected' : ''}>${v ? escapeHtml(v) : '(default)'}</option>`).join('');
  // Editable unless an explicit non-vm placement — an unset runner inherits
  // the daemon default (which may be vm), so a pin is meaningful there too.
  const dis = isNonVMPlacement(runner) ? ' disabled' : '';
  return `<select class="w-full sm:w-auto" data-repo-image${dis}>${opts}</select>`;
}

// repoWarning finds the soft save-warning for a repo, matching the backend's
// `repo %q:` prefix (config Validate) so the quoted name delimits the match
// — a same-prefixed sibling ("a/bc") does not steal "a/b"'s warning. Returns
// the warning string, or '' when none applies.
function repoWarning(name, warnings) {
  const prefix = `repo "${name}":`;
  return (warnings || []).find(w => String(w).startsWith(prefix)) || '';
}

// linearPanelHtml renders the Linear secret panel: the key's set/unset
// state (never the value — GET /config redacts it), a secret input that
// replaces the stored key only when non-empty, and a Clear control shown
// only when a key is stored (nothing to clear otherwise). armedClear
// reflects a pending Clear: the input is disabled, the note announces the
// clear, and the control flips to an undo — so arming is a re-render, not a
// one-way DOM mutation.
function linearPanelHtml(linear, armedClear) {
  const set = !!(linear && linear.api_key_set);
  const armed = set && !!armedClear;
  return `<section class="config-panel card" id="config-linear">
    <h3>Linear</h3>
    <p class="muted">API key for the Linear item source — status <strong>${set ? 'set' : 'unset'}</strong>. The stored key is never shown.</p>
    <label>API key <input type="password" id="config-linear-key"${armed ? ' disabled' : ''} placeholder="${
      set ? 'leave blank to keep the stored key' : 'enter a key'}"></label>
    <p>${set ? `<button type="button" data-linear-clear>${armed ? 'keep key' : 'clear key'}</button> ` : ''}<span id="config-linear-note" class="config-note">${
      armed ? 'key will be cleared on save' : ''}</span></p>
  </section>`;
}

// providersPanelHtml renders the Providers panel: the default-provider
// choice plus an editable row per provider (backend / command / model_env).
// Providers are startup-built, so a restart note flags that edits apply
// only after the daemon restarts (config-screen-spec effect timing).
function providersPanelHtml(doc) {
  const providers = (doc && doc.providers) || {};
  const def = (doc && doc.default_provider) || '';
  const names = Object.keys(providers).sort();
  const options = names.map(n =>
    `<option value="${escapeHtml(n)}"${n === def ? ' selected' : ''}>${escapeHtml(n)}</option>`).join('');
  // Empty-state hint spans provider + backend + command + model_env + the
  // remove control (C5 empty states).
  const rows = names.length
    ? names.map(n => providerRowHtml(n, providers[n] || {})).join('')
    : `<tr data-empty-hint><td class="muted" colspan="5">No providers configured — add one.</td></tr>`;
  return `<section class="config-panel card" id="config-providers">
    <h3>Providers</h3>
    <p class="muted">Agent backends the router dispatches to.</p>
    <p class="config-note">Editing providers takes effect only after a daemon restart.</p>
    <label>default provider
      <select id="config-default-provider"><option value=""${def ? '' : ' selected'}>(none — simulate bare runs)</option>${options}</select>
    </label>
    ${dataTable('<tr><th>provider</th><th>backend</th><th>command</th><th>model_env</th><th></th></tr>', rows, 'config-providers-rows')}
    <p><button type="button" data-provider-add>add provider</button></p>
  </section>`;
}

// providerRowHtml renders one provider row; a blank name is the add case.
function providerRowHtml(name, p) {
  return `<tr data-provider-row class="${CARD_ROW_CLASS}">
    ${cardCell('provider', `<input class="w-full sm:w-auto" data-provider-name value="${escapeHtml(name)}" placeholder="name">`)}
    ${cardCell('backend', `<input class="w-full sm:w-auto" data-provider-backend value="${escapeHtml(p.backend || '')}" placeholder="acp|claudecode|simulation">`)}
    ${cardCell('command', `<input class="w-full sm:w-auto" data-provider-command value="${escapeHtml(p.command || '')}">`)}
    ${cardCell('model_env', `<input class="w-full sm:w-auto" data-provider-model-env value="${escapeHtml(p.model_env || '')}">`)}
    ${cardCell('', '<button type="button" data-provider-remove title="remove provider">&times;</button>')}
  </tr>`;
}

// onConfigClick handles every panel's delegated add/remove/clear — the
// panels are innerHTML so a single listener on the view drives each row's
// control (matching the items/run-list convention).
function onConfigClick(e) {
  if (e.target.closest('button[data-repo-add]')) {
    const rows = $('config-repos-rows');
    if (rows) {
      rows.querySelectorAll('tr[data-empty-hint]').forEach(r => r.remove());
      rows.insertAdjacentHTML('beforeend', repoRowHtml('', {}, '', (configLoaded && configLoaded.vm_images) || {}));
    }
    return;
  }
  const rmRepo = e.target.closest('button[data-repo-remove]');
  if (rmRepo) { rmRepo.closest('tr[data-repo-row]').remove(); return; }
  if (e.target.closest('button[data-provider-add]')) {
    const rows = $('config-providers-rows');
    if (rows) {
      rows.querySelectorAll('tr[data-empty-hint]').forEach(r => r.remove());
      rows.insertAdjacentHTML('beforeend', providerRowHtml('', {}));
    }
    return;
  }
  const rmProv = e.target.closest('button[data-provider-remove]');
  if (rmProv) { rmProv.closest('tr[data-provider-row]').remove(); return; }
  if (e.target.closest('button[data-linear-clear]')) {
    // Toggle the pending clear and re-render just the Linear panel from the
    // redacted load state, so arming is reversible ("keep key" un-arms) and
    // in-progress repo/provider edits elsewhere are left untouched.
    linearClear = !linearClear;
    setConfigDirty(true);
    const panel = $('config-linear');
    if (panel && configLoaded) panel.outerHTML = linearPanelHtml(configLoaded.linear, linearClear);
  }
}

// onConfigChange handles delegated select changes: a runner select flipping
// to/from vm enables/disables that row's image select (the image is only
// meaningful under a vm runner — dispatch resolution §2). It also marks the
// view dirty, since select changes don't fire the input listener in every
// browser.
function onConfigChange(e) {
  setConfigDirty(true);
  const runnerSel = e.target.closest('select[data-repo-runner]');
  if (!runnerSel) return;
  const img = runnerSel.closest('tr[data-repo-row]')?.querySelector('select[data-repo-image]');
  if (img) img.disabled = isNonVMPlacement(runnerSel.value);
}

// setConfigDirty tracks unsaved edits so the user sees the view has pending
// changes; a successful save (or a fresh render) clears it.
function setConfigDirty(dirty) {
  configDirty = dirty;
  const el = $('config-dirty');
  if (el) el.textContent = dirty ? 'unsaved changes' : '';
}

// collectConfig scrapes the panels' inputs into a plain form object. Non-
// standard checks a repo may carry (e.g. e2e) are not shown as columns, so
// they are seeded from the loaded doc keyed by the row's current name and
// preserved on save — only the four standard checks are edited here.
function collectConfig() {
  const loaded = (configLoaded && configLoaded.repos) || {};
  const repos = [...document.querySelectorAll('#config-repos-rows tr[data-repo-row]')].map(tr => {
    const name = tr.querySelector('[data-repo-name]').value.trim();
    const checks = { ...((loaded[name] && loaded[name].checks) || {}) };
    tr.querySelectorAll('input[data-check]').forEach(inp => {
      const v = inp.value.trim();
      if (v) checks[inp.dataset.check] = v; else delete checks[inp.dataset.check];
    });
    return {
      name, path: tr.querySelector('[data-repo-path]').value.trim(), checks,
      runner: tr.querySelector('[data-repo-runner]').value,
      image: tr.querySelector('[data-repo-image]').value,
    };
  });
  const providers = [...document.querySelectorAll('#config-providers-rows tr[data-provider-row]')].map(tr => ({
    name: tr.querySelector('[data-provider-name]').value.trim(),
    backend: tr.querySelector('[data-provider-backend]').value.trim(),
    command: tr.querySelector('[data-provider-command]').value.trim(),
    model_env: tr.querySelector('[data-provider-model-env]').value.trim(),
  }));
  return {
    defaultProvider: $('config-default-provider').value,
    providers, repos,
    linearKey: $('config-linear-key').value,
    linearClear,
  };
}

// buildPutBody reshapes the collected form into the PUT /config Document:
// provider/repo rows become maps (blank-name rows dropped), and the Linear
// secret follows secret-merge — an empty key is sent empty (preserve), a
// value replaces, an armed clear sets api_key_clear (the distinct clear).
function buildPutBody(form) {
  const providers = {};
  for (const p of form.providers) {
    if (!p.name) continue;
    providers[p.name] = { backend: p.backend, command: p.command, model_env: p.model_env };
  }
  const repos = {};
  for (const r of form.repos) {
    if (!r.name) continue;
    const rc = { path: r.path, checks: r.checks || {} };
    // A declared runner rides as a field; an unset runner emits no key,
    // keeping an untouched config byte-unchanged. The vm.image pin is kept
    // unless the runner is an EXPLICIT non-vm placement — an unset runner
    // inherits the daemon default, which may be vm, so the pin stays a valid
    // value there (dispatch resolves the image on the effective runner —
    // spec §Dispatch resolution). Dropping it on a blank runner would wipe a
    // legitimate pin.
    if (r.runner) rc.runner = r.runner;
    if (r.image && r.runner !== 'direct' && r.runner !== 'local') rc.vm = { image: r.image };
    repos[r.name] = rc;
  }
  const linear = { api_key: form.linearKey || '' };
  if (form.linearClear) linear.api_key_clear = true;
  // vm_images is deliberately not sent: it is server-owned (nix/CLI-managed),
  // the server preserves it across a PUT that omits it, and echoing a stale
  // GET snapshot would revert a concurrent registry edit (per-repo VM config,
  // VM4).
  return { default_provider: form.defaultProvider || '', providers, repos, linear };
}

// saveMessage classifies the PUT /config response into a banner: a 422 is a
// structural rejection (nothing saved), a 200 with warnings saved softly, a
// clean 200 saved, anything else a generic failure.
function saveMessage(status, body) {
  if (status === 200) {
    const warnings = (body && body.warnings) || [];
    if (warnings.length) return { kind: 'warn', text: 'Saved with warnings: ' + warnings.join('; ') };
    return { kind: 'ok', text: 'Saved.' };
  }
  if (status === 422 && body && body.error) return { kind: 'error', text: body.error };
  return { kind: 'error', text: `Save failed (${status}).` };
}

// saveConfig PUTs the whole doc. A structural rejection (422) keeps the
// user's edits on screen — nothing was saved, so re-reading would discard
// them. A success re-reads from the server (reflecting redaction and
// clearing the pending-clear/dirty state) before showing the result.
let configSaving = false;
async function saveConfig() {
  if (!configLoaded || configSaving) return;   // no save before a successful load
  configSaving = true;
  const btn = $('config-save');
  if (btn) btn.disabled = true;
  setConfigStatus('saving…', '');
  try {
    let r;
    try {
      r = await putJSON('/config', buildPutBody(collectConfig()));
    } catch (e) { setConfigStatus('could not reach the daemon', 'error'); return; }
    let body = {};
    try { body = await r.json(); } catch (e) { /* an error body may not be JSON */ }
    const msg = saveMessage(r.status, body);
    // Re-render from server truth (reflects redaction, clears dirty), carrying
    // the soft warnings so they land inline on the offending repo rows too.
    if (r.status === 200) await showConfig((body && body.warnings) || []);
    setConfigStatus(msg.text, msg.kind);
  } finally {
    configSaving = false;
    if (btn) btn.disabled = false;
  }
}

// ---- wait.human dock ---------------------------------------------------
async function refreshDock() {
  if (!currentRun) return;
  try {
    const r = await fetch(`/pipelines/${currentRun}/questions`);
    renderDock((await r.json()).questions || []);
  } catch (e) { /* transient; retried on next tick */ }
}

// renderDock builds the wait.human dock via DOM + listeners rather than
// interpolating question text into an HTML string: option labels can
// contain quotes that would otherwise break an inline onclick attribute.
function renderDock(questions) {
  const dock = $('human-dock');
  // The loud header banner and the sidebar dock render from the same list, so
  // they can never disagree about whether a run is blocked (U5).
  $('run-blocked').innerHTML = blockedBannerHtml(questions);
  dock.textContent = '';
  if (!questions.length) return;
  const h = document.createElement('h3'); h.textContent = 'open questions';
  dock.appendChild(h);
  questions.forEach(q => {
    const box = document.createElement('div'); box.className = 'q';
    const label = document.createElement('div');
    label.textContent = (q.text || '') + ' ';
    const who = document.createElement('span'); who.className = 'muted';
    who.textContent = '(' + (q.node_id || '') + ')';
    label.appendChild(who);
    box.appendChild(label);
    if ((q.options || []).length) {
      q.options.forEach(o => {
        const b = document.createElement('button');
        b.textContent = o.label;
        b.addEventListener('click', () => answer(q.id, gateAnswer(o)));
        box.appendChild(b); box.appendChild(document.createTextNode(' '));
      });
    } else {
      const input = document.createElement('input'); input.placeholder = 'answer';
      const send = document.createElement('button'); send.textContent = 'send';
      send.addEventListener('click', () => answer(q.id, gateAnswer(null, input.value)));
      box.appendChild(input); box.appendChild(document.createTextNode(' ')); box.appendChild(send);
    }
    dock.appendChild(box);
  });
}

// postJSON POSTs a JSON body and returns the raw Response, leaving status
// handling to the caller.
function postJSON(url, body) {
  return fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}

// putJSON PUTs a JSON body and returns the raw Response (the Config view's
// whole-doc save), leaving status handling to the caller.
function putJSON(url, body) {
  return fetch(url, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}

// gateAnswer builds the answer POST body (server AnswerPayload). A chosen
// option carries key+label (→ AnswerChoice); free text carries text only
// (→ AnswerText). Values ride as plain data, never interpolated into markup —
// the reason renderDock builds the dock via DOM rather than an HTML string.
function gateAnswer(option, text) {
  if (option) return { key: option.key, label: option.label };
  return { text: text || '' };
}

async function answer(qid, body) {
  await postJSON(`/pipelines/${currentRun}/questions/${qid}/answer`, body);
  refreshDock();
}

// ---- shared placeholders -----------------------------------------------
// One visual language for the three non-content states every list/pane can
// land in (web-ui-v2-spec U1): an empty result, an in-flight load, and a
// failure — each reads differently. Pure helpers returning inert markup; the
// message is escaped because some carry backend/error text.
// stateBadge renders a run-state pill: the Tailwind Plus badge shape
// (badges.html — inline-flex, rounded, inset ring) carrying its per-state
// colour through the existing `.status.<state>` token rule, so one colour maps
// to each run state and light/dark tracks (ui-tailwind-spec T6a). The ring
// inherits `currentColor` (the state colour), tinted; the surface stays
// neutral. label defaults to the state word; href turns it into a link (the
// Items view tints a run-id link by its run state). All three are escaped.
function stateBadge(status, label, href) {
  const s = escapeHtml(status || '');
  const text = escapeHtml(label != null ? label : (status || ''));
  const cls = `status ${s} inline-flex items-center rounded-md bg-surface-1 ` +
    `px-2 py-1 text-sm font-medium ring-1 ring-inset ring-current/25`;
  return href
    ? `<a class="${cls}" href="${escapeHtml(href)}" title="${s}">${text}</a>`
    : `<span class="${cls}">${text}</span>`;
}
function emptyState(msg) {
  return `<p class="state state-empty">${escapeHtml(msg)}</p>`;
}
// emptyPanel is the Tailwind Plus empty-state (empty-state.html) remapped to
// the UI tokens: a centred icon, heading and optional subtext for a primary
// empty view (the Items and Runs lists). The stock gray icon/subtext become
// text-muted and the heading text-ink so light/dark tracks. Both strings are
// escaped. Minor placeholders keep the one-line emptyState.
function emptyPanel(title, sub) {
  return `<div class="state-empty text-center">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true" class="mx-auto size-12 text-muted">
      <path d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <h3 class="mt-2 text-sm font-semibold text-ink">${escapeHtml(title)}</h3>
    ${sub ? `<p class="mt-1 text-sm text-muted">${escapeHtml(sub)}</p>` : ''}
  </div>`;
}
function loadingState(msg) {
  return `<p class="state state-loading pulse" aria-busy="true">${escapeHtml(msg || 'loading…')}</p>`;
}
function errorState(msg) {
  return `<p class="state state-error" role="alert">${escapeHtml(msg)}</p>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ---- boot --------------------------------------------------------------
window.addEventListener('load', () => {
  syncToggle();
  // Toolbar controls re-render from the cached merged set — no refetch.
  for (const id of ['items-filter-source', 'items-filter-type', 'items-filter-repo',
                    'items-filter-progress', 'items-group']) {
    $(id)?.addEventListener('change', renderItems);
  }
  $('items-filter-text')?.addEventListener('input', renderItems);
  // Fleet filter toolbar (web-ui-v2-spec U7): reflect the toolbar into the
  // hash (shareable) and re-render the cached fleet — no refetch, matching the
  // items toolbar.
  for (const id of ['runs-filter-status', 'runs-filter-workflow', 'runs-filter-repo', 'runs-filter-origin']) {
    $(id)?.addEventListener('change', onRunsFilterChange);
  }
  $('runs-filter-text')?.addEventListener('input', onRunsFilterChange);
  $('workflow-expand')?.addEventListener('change', renderWorkflowGraph);
  // Re-render the current run's graph with the chosen graphviz layout engine.
  $('graph-engine')?.addEventListener('change', () => { if (currentRun) loadGraph(currentRun); });
  // Event-timeline filters (web-ui-v2-spec U3): seed the kind dropdown from the
  // known kinds, then re-render on either control changing.
  const kindSel = $('tl-kind');
  if (kindSel) for (const k of EVENT_KINDS) kindSel.insertAdjacentHTML('beforeend', `<option value="${k}">${k}</option>`);
  $('tl-kind')?.addEventListener('change', renderTimeline);
  $('tl-text')?.addEventListener('input', renderTimeline);
  // Delegated run trigger: item rows are innerHTML, so a single listener on
  // the list opens the picker for whichever row's run button was clicked.
  $('items-list')?.addEventListener('click', e => {
    const btn = e.target.closest('button[data-run]');
    if (btn) openRunPicker(btn);
  });
  // Delegated cancel trigger: run rows are innerHTML (and re-rendered every
  // poll tick), so a single listener on the list handles whichever row's
  // cancel button was clicked.
  $('run-list')?.addEventListener('click', e => {
    const btn = e.target.closest('button[data-cancel]');
    if (btn) cancelRun(btn.dataset.cancelId);
  });
  // Delegated run-detail controls: re-run reopens the Run modal prefilled from
  // the current run's summary; re-run-from-failure POSTs …/restart.
  $('run-actions')?.addEventListener('click', e => {
    const rerun = e.target.closest('button[data-rerun]');
    if (rerun) { openRunForm(rerunOpts(currentRunSummary)); return; }
    const restart = e.target.closest('button[data-restart]');
    if (restart) restartRun(restart.dataset.runId);
  });
  // Delegated Config controls: panels are innerHTML, so one listener on the
  // view handles add/remove/clear for every row; a second marks the view
  // dirty on any field edit.
  $('config-view')?.addEventListener('click', onConfigClick);
  $('config-view')?.addEventListener('input', () => setConfigDirty(true));
  $('config-view')?.addEventListener('change', onConfigChange);
  $('config-save')?.addEventListener('click', saveConfig);
  // Delegated Workflows-view run trigger: rows are innerHTML, so one listener
  // opens the form standalone for whichever row's run button was clicked.
  $('workflows-list')?.addEventListener('click', e => {
    const btn = e.target.closest('button[data-run-workflow]');
    if (btn) openRunForWorkflow(btn.dataset.runWorkflow);
  });
  $('run-form-workflow')?.addEventListener('change', onWorkflowChange);
  $('run-form-cancel')?.addEventListener('click', () => $('run-form').close());
  $('run-form-run')?.addEventListener('click', submitRun);
  // A full unload (reload / close / external nav) bypasses the hash router,
  // so guard it too: the browser shows its native leave prompt when the
  // Config view has unsaved edits.
  window.addEventListener('beforeunload', (e) => {
    if (activeView === 'config-view' && configDirty) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('hashchange', route);
  route();
});
</script>
</body>
</html>
