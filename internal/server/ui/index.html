    applied = pos;
    fn(JSON.parse(e.data));
  });
  // On a terminal event, close the stream. The server ends the SSE
  // connection for finished runs, so leaving it open lets EventSource
  // reconnect every few seconds and replay the whole history again,
  // duplicating prose chunks each time.
  // On a terminal event, stop the dock poll too: the server clears a finished
  // run's questions, so one final refreshDock reconciles to empty and the
  // interval would otherwise poll a dead run forever in an open tab.
  const done = () => {
    if (es) es.close();
    if (dockTimer) { clearInterval(dockTimer); dockTimer = null; }
    renderDock([]); refreshDock();
  };
  // Every kind is registered through one table so a single dispatch point
  // handles the run (kinds with no side-effect map to null). Registering all
  // of them keeps the applied/pos replay cursor authoritative for the whole
  // stream — the U3 timeline recorder hangs off this same dispatch.
  const HANDLERS = {
    stage_started:   ev => {
      // Track the active parent node so a forwarded child terminal (which
      // carries no node_id) can be attributed to the node running the child
      // pipeline (T9b). Child stage_starts belong to the nested run, not here.
      if (!isChildEvent(ev)) { activeParentNode = ev.node_id; scheduleStateRehydrate(); }
      // Follow the run: surface the active node's live log unless the user
      // pinned a node by clicking one (U2). Replay re-runs this, so a reload
      // lands on whatever was last running.
      if (!isChildEvent(ev) && !pinnedNode) selectNode(ev.node_id, false);
    },
    stage_completed: ev => {
      if (!isChildEvent(ev)) {
        // Remember the node that just produced output so a gate firing next can
        // point back at it (plan_gate reviews plan's output — plan-at-gate, U5).
        lastCompletedNode = ev.node_id;
        scheduleStateRehydrate();
      }
    },
    stage_failed:    ev => { if (!isChildEvent(ev)) scheduleStateRehydrate(); },
    stage_retrying:  ev => { if (!isChildEvent(ev)) scheduleStateRehydrate(); },
    stage_progress:  ev => appendProgress(ev),
    // Only the PARENT run's completion is terminal. A forwarded child
    // pipeline_completed (a child review that passed) must not end the stream —
    // doing so froze the view at "resolved" and masked a later real parent
    // failure (T8b). The parent's own completion closes the run.
    pipeline_completed: ev => {
      if (isChildEvent(ev)) return;
      done(); loadArtifacts(); scheduleStateRehydrate();
    },
    // A forwarded child pipeline_failed is a nested run's verdict/findings, not
    // the run's failure (T9b): attribute it to the node that ran the child
    // pipeline (the active parent node) — surfaced in that node's inspector —
    // and do NOT end the stream. Only the run's own failure is the red banner
    // and terminal.
    pipeline_failed:    ev => {
      if (isChildEvent(ev)) { recordNodeFinding(activeParentNode, ev.message); return; }
      $('run-failure').innerHTML = failureBannerHtml(ev.message); done(); loadArtifacts(); scheduleStateRehydrate();
    },
    // Gate events drive the dock live (U5): a run blocks (interview_started) or
    // resumes (answered/timeout) between polls, so refresh the dock + banner
    // the moment the stream says so rather than waiting for the poll fallback.
    interview_started:  ev => {
      // Pin the gate to the node whose output it reviews, so the dock can show
      // that node's produced text next to the question (plan-at-gate, U5).
      if (ev.node_id && lastCompletedNode) gatePreceding[ev.node_id] = lastCompletedNode;
      refreshDock();
    },
    interview_answered: () => refreshDock(),
    interview_timeout:  () => refreshDock(),
  };
  // Every event runs its kind's side-effect (if any) and — unless it is a
  // high-frequency kind (TIMELINE_SKIP) — lands in the U3 timeline. One
  // dispatch keeps the applied/pos cursor authoritative for both.
  for (const kind of EVENT_KINDS) {
    const fn = HANDLERS[kind];
    const record = !TIMELINE_SKIP.has(kind);
    // feedIngest reshapes the same event into the R2 feed; it shares this one
    // dispatch (and its replay cursor) so the feed is built exactly once.
    on(kind, ev => { if (record) recordTimelineEvent(kind, ev); feedIngest(kind, ev); if (fn) fn(ev); });
  }
  es.onerror = () => { /* transient; EventSource retries on its own */ };
}

// appendProgress records assistant_delta / tool_call chunks per node.
function appendProgress(ev) {
  const node = ev.node_id; if (!node) return;
  const kind = ev.detail && ev.detail.kind;
  // Accumulate only the node's prose (assistant deltas / plain messages) — the
  // gate plan panel falls back to it when the daemon lacks the stage file (a VM
  // run keeps stage files on the guest). Tool-call and lifecycle chunks carry no
  // prose; the feed renders those, so the inspector no longer mirrors a live log.
  if (kind !== 'tool_call' && ev.message) {
    (nodeProse[node] = nodeProse[node] || []).push(ev.message);
  }
}

// recordTimelineEvent appends one streamed event to the run's event log and
// its row to the timeline (web-ui-v2-spec U3). Appending a single row keeps a
// run of N events at O(N) total work — a full renderTimeline() rebuild per
// event would be O(N^2) and freeze the main thread on any real run.
function recordTimelineEvent(kind, ev) {
  timeline.push({ kind, ev });
  if (timeline.length > TIMELINE_MAX) {
    // Over the cap: drop the oldest and rebuild the (now bounded) window. This
    // is the only O(TIMELINE_MAX) path and it fires at most once per event once
    // capped — still bounded, never the unbounded O(N) of the pre-cap rebuild.
    timeline.shift();
    renderTimeline();
    return;
  }
  appendTimelineRow(kind, ev);
}

// appendTimelineRow adds one event's row to #tl-rows when it passes the active
// filter, clearing the empty-state placeholder on the first row and following
// the tail. Full-rebuild paths (filter change, run reset) go through
// renderTimeline instead.
function appendTimelineRow(kind, ev) {
  const rows = $('tl-rows');
  if (!rows) return;
  if (!eventMatchesFilter(kind, ev, timelineFilter())) return;
  if (rows.querySelector('.state')) rows.innerHTML = '';
  rows.insertAdjacentHTML('beforeend', timelineRowHtml(kind, ev));
  rows.scrollTop = rows.scrollHeight;
}

// timelineFilter reads the active kind + text filter from the controls.
function timelineFilter() {
  return { kind: $('tl-kind')?.value || '', text: $('tl-text')?.value || '' };
}

// renderTimeline rebuilds #tl-rows from the recorded timeline through the
// active filter. Used on a filter change or run reset — a live event appends a
// single row (appendTimelineRow) instead. An empty result distinguishes "no
// events yet" from "filtered everything out".
function renderTimeline() {
  const rows = $('tl-rows');
  if (!rows) return;
  const f = timelineFilter();
  const html = timeline
    .filter(e => eventMatchesFilter(e.kind, e.ev, f))
    .map(e => timelineRowHtml(e.kind, e.ev))
    .join('');
  rows.innerHTML = html || emptyState(timeline.length ? 'no events match the filter' : 'no events yet');
}

// eventMatchesFilter is the U3 timeline filter predicate. An empty kind keeps
// any kind; a kind keeps only that kind. An empty text keeps any event; text
// matches case-insensitively against the message and node id. Both conditions
// must hold, so kind + text narrow together.
function eventMatchesFilter(kind, ev, filter) {
  if (filter.kind && kind !== filter.kind) return false;
  const q = (filter.text || '').toLowerCase();
  if (!q) return true;
  const hay = `${ev.message || ''} ${ev.node_id || ''}`.toLowerCase();
  return hay.includes(q);
}

// failureBannerHtml renders the run header's failure reason prominently
// (web-ui-v2-spec U3): the reason is why the run failed and is the first thing
// a debugger needs. An empty reason renders nothing — a healthy run shows no
// banner. The reason is attacker-controlled and escaped.
function failureBannerHtml(reason) {
  if (!reason) return '';
  return `<p class="banner error run-failure">${escapeHtml(reason)}</p>`;
}

// isChildEvent reports whether a pipeline event was forwarded from a nested
// child run. A manager_loop re-emits every child engine event onto the parent
// stream tagged detail.source="child" (handler/manager_loop.go
// consumeChildEvents) — including the child's own terminal pipeline_completed /
// pipeline_failed. Those are NOT the parent run's terminal events: gating on
// this keeps a forwarded child terminal from closing the parent's stream or
// painting the parent's banners (ui-tailwind-spec T8b).
function isChildEvent(ev) {
  return !!(ev.detail && ev.detail.source === 'child');
}

// recordNodeFinding attributes a forwarded child-pipeline finding to the node
// that ran the child (T9b): the child terminal carries no node_id, so it belongs
// to the active parent node (the last non-child stage_started). If that node's
// inspector is open, refresh its findings block live — resolved once the node
// itself reaches completed (the fix loop cleared the findings).
function recordNodeFinding(node, message) {
  if (!node) return;
  (nodeFindings[node] = nodeFindings[node] || []).push(message);
  if (selectedNode === node) {
    const box = $('node-findings');
    if (box) box.innerHTML = nodeFindingsHtml(nodeFindings[node], runState?.nodes?.[node]?.status === 'completed');
  }
}

// nodeFindingsHtml renders a node's child-pipeline findings as a labelled,
// collapsible block in the node inspector (ui-tailwind-spec T9b) — deliberately
// NOT error-red: a manager_loop node's child verdict may be resolved by the fix
// loop and the node still completes. `resolved` (node reached completed) marks
// them fixed (collapsed + a resolved tag); otherwise it stays open. Empty →
// nothing (no leftover section). Findings text is the child's failure_reason
// (attacker-controlled) and is escaped.
function nodeFindingsHtml(findings, resolved) {
  if (!findings || !findings.length) return '';
  const items = findings.map(n => `<li>${escapeHtml(n)}</li>`).join('');
  const tag = resolved ? ' <span class="node-findings-tag">resolved</span>' : '';
  return `<details class="node-findings"${resolved ? '' : ' open'}>` +
    `<summary>Findings${tag}</summary>` +
    `<ul class="node-findings-list">${items}</ul></details>`;
}

// blockedBannerHtml renders the loud run-header banner for a run waiting on a
// human (web-ui-v2-spec U5). Distinct from the failure banner: a blocked run
// is not failed, it needs an answer. No open questions → no banner. The count
// tells the teammate how many gates are open; question text is not inlined
// here (it lives in the dock), so nothing attacker-controlled reaches the DOM,
// but the count is escaped for symmetry with the other banners.
function blockedBannerHtml(questions) {
  const n = (questions || []).length;
  if (!n) return '';
  const noun = n === 1 ? 'answer' : 'answers';
  return `<p class="banner blocked" role="alert">Waiting on you — ${escapeHtml(String(n))} open ${noun}.</p>`;
}

// timelineRowHtml renders one run event as a timeline row (web-ui-v2-spec U3):
// relative timestamp (full ISO on hover, via fmtDate), a kind badge, the node
// id when the event has one, and the message. Every field is attacker-
// controlled — kind, node and message are all escaped inert.
function timelineRowHtml(kind, ev) {
  const node = ev.node_id ? `<span class="tl-node">${escapeHtml(ev.node_id)}</span>` : '';
  const msg = ev.message ? `<span class="tl-msg">${escapeHtml(ev.message)}</span>` : '';
  return `<div class="tl-row">` +
    `<span class="tl-time">${fmtDate(ev.ts)}</span>` +
    `<span class="badge tl-kind">${escapeHtml(kind)}</span>` +
    node + msg + `</div>`;
}

// isDiffPath reports whether an artifact path looks like a produced diff (U4):
// a .diff/.patch suffix or a file literally named "diff". Used to auto-render
// the run's change without a fixed server-side diff artifact.
function isDiffPath(path) {
  const name = String(path).split('/').pop();
  return /\.(diff|patch)$/.test(name) || name === 'diff';
}

// fmtBytes renders a byte count as a short human-readable size.
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  const units = ['KB', 'MB', 'GB'];
  let u = -1;
  do { n /= 1024; u++; } while (n >= 1024 && u < units.length - 1);
  return n.toFixed(1) + ' ' + units[u];
}

// artifactListHtml renders the U4 artifact browser: one clickable row per file,
// carrying its logs-root-relative path (data-path, read by the click handler)
// and a human size. Directories are structural — shown as headers, not
// clickable rows. Paths are attacker-controlled (a run writes arbitrary names)
// and escaped. An empty listing renders an empty state.
function artifactListHtml(entries) {
  entries = entries || [];
  if (!entries.length) return emptyState('No artifacts produced yet.');
  return entries.map(e => {
    const path = escapeHtml(e.path);
    if (e.is_dir) return `<div class="artifact-dir">${path}/</div>`;
    return `<button class="artifact-row" data-path="${path}">` +
      `<span class="artifact-name">${path}</span>` +
      `<span class="artifact-size muted">${escapeHtml(fmtBytes(e.size))}</span></button>`;
  }).join('');
}

// diffHtml renders a unified diff (U4) line-by-line: added lines get a
// diff-add class, removed lines diff-del, hunk headers (@@) diff-hunk, and
// context lines render plain. File-header lines (+++/---) are treated as hunk
// chrome, not source add/remove, so they don't paint green/red. Every line is
// escaped — a diff body is arbitrary source and thus attacker-controlled. Empty
// input renders nothing, so a run that produced no diff shows a clean empty
// state rather than a stray box.
function diffHtml(text) {
  const lines = String(text || '').replace(/\n$/, '').split('\n');
  if (lines.length === 1 && lines[0] === '') return '';
  return lines.map(line => {
    let cls = 'diff-ctx';
    if (line.startsWith('@@')) cls = 'diff-hunk';
    else if (line.startsWith('+++') || line.startsWith('---')) cls = 'diff-file';
    else if (line.startsWith('+')) cls = 'diff-add';
    else if (line.startsWith('-')) cls = 'diff-del';
    return `<span class="diff-line ${cls}">${escapeHtml(line)}</span>`;
  }).join('');
}

// diffBodyHtml renders the Diff section honestly from the daemon's X-Diff-Status
// header (P2, ui-run-view-v3 R4): "no-commits-yet" (a live run before its first
// commit, or one that changed nothing) and "not-computable" (no jj range /
// workspace gone) are distinct states with plain messages — not the old single
// misleading "produced no diff". Any other status ("ok" or a legacy absent
// header) renders the body as a coloured diff, empty falling back to a neutral
// note. The body is attacker-controlled source; diffHtml escapes every line.
function diffBodyHtml(status, text) {
  if (status === 'not-computable') return emptyState('Diff not computable for this run.');
  if (status === 'no-commits-yet') return emptyState('No commits yet.');
  const html = diffHtml(text);
  return html || emptyState('This run produced no diff.');
}

// ---- markdown (safe subset) --------------------------------------------
// renderMarkdown turns agent prose into HTML from a deliberately small, safe
// Markdown subset (ui-run-view-v3 R2): ATX headings, bold, italic, inline +
// fenced code, unordered/ordered lists, and links. The source is
// attacker-controlled, so it is HTML-escaped FIRST and never passed through
// raw — the only tags in the output are the ones this function emits. Reused
// everywhere prose renders (feed bubbles, the gate plan snippet, the inspector
// response).
function renderMarkdown(src) {
  const lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let para = [];
  const flushPara = () => {
    if (!para.length) return;
    out.push(`<p>${mdInline(escapeHtml(para.join('\n')))}</p>`);
    para = [];
  };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    // Fenced code block: raw text, escaped, never inline-processed.
    if (/^\s*```/.test(line)) {
      flushPara();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
      out.push(`<pre class="md-code overflow-x-auto"><code>${escapeHtml(buf.join('\n'))}</code></pre>`);
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara();
      const level = Math.min(6, h[1].length);
      out.push(`<h${level} class="md-h">${mdInline(escapeHtml(h[2].trim()))}</h${level}>`);
      continue;
    }
    if (/^\s*[-*+]\s+/.test(line)) {
      flushPara();
      const items = [];
      while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
        items.push(`<li>${mdInline(escapeHtml(lines[i].replace(/^\s*[-*+]\s+/, '')))}</li>`);
        i++;
      }
      i--;
      out.push(`<ul class="md-list">${items.join('')}</ul>`);
      continue;
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      flushPara();
      const items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(`<li>${mdInline(escapeHtml(lines[i].replace(/^\s*\d+\.\s+/, '')))}</li>`);
        i++;
      }
      i--;
      out.push(`<ol class="md-list">${items.join('')}</ol>`);
      continue;
    }
    if (/^\s*$/.test(line)) { flushPara(); continue; }
    para.push(line);
  }
  flushPara();
  return out.join('');
}

// mdInline applies inline Markdown to an ALREADY-HTML-ESCAPED string: inline
// code first (so emphasis markers inside code stay literal), then links, then
// bold/italic. A link's url is validated by safeUrl (http/https only, else #);
// because the whole string is pre-escaped no quote can break out of the href
// attribute, so a "javascript:" or attribute-breakout url renders inert.
function mdInline(s) {
  const code = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { code.push(c); return '\x00' + (code.length - 1) + '\x00'; });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, url) =>
    `<a href="${safeUrl(url)}" target="_blank" rel="noopener">${text}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g, '$1<em>$2</em>');
  s = s.replace(/\x00(\d+)\x00/g, (_, n) => `<code class="md-inline-code">${code[+n]}</code>`);
  return s;
}

// ---- ANSI (SGR subset) -------------------------------------------------
// ANSI_FG maps the SGR foreground codes this UI honours to theme-aware classes
// (30-37 normal, 90-97 bright). Colours resolve to CSS tokens so both palettes
// track; backgrounds, cursor moves and OSC are stripped, never rendered.
const ANSI_FG = {
  30: 'blk', 31: 'red', 32: 'grn', 33: 'yel', 34: 'blu', 35: 'mag', 36: 'cyn', 37: 'wht',
  90: 'blk-b', 91: 'red-b', 92: 'grn-b', 93: 'yel-b', 94: 'blu-b', 95: 'mag-b', 96: 'cyn-b', 97: 'wht-b',
};

// ansiToHtml renders captured command output (nix, pnpm, Nx colorize) for the
// browser (ui-run-view-v3 R2): the raw bytes are attacker-controlled, so the
// text is HTML-escaped FIRST, then the common SGR subset (16/256 fg colours,
// bold, dim, reset) becomes theme-aware spans and every other escape (CSI
// cursor moves, OSC titles, lone escapes) is stripped — no raw \x1b reaches the
// operator.
function ansiToHtml(raw) {
  const esc = escapeHtml(raw == null ? '' : String(raw));
  const state = { fg: null, rgb: null, bold: false, dim: false };
  let out = '', open = false, i = 0;
  const spanTag = () => {
    const cls = [];
    if (state.bold) cls.push('ansi-bold');
    if (state.dim) cls.push('ansi-dim');
    if (state.fg) cls.push('ansi-' + state.fg);
    const style = state.rgb ? ` style="color:${state.rgb}"` : '';
    if (!cls.length && !style) return '';
    return `<span class="${cls.join(' ')}"${style}>`;
  };
  const reopen = () => {
    if (open) { out += '</span>'; open = false; }
    const t = spanTag();
    if (t) { out += t; open = true; }
  };
  while (i < esc.length) {
    if (esc[i] === '\x1b') {
      const csi = /^\x1b\[([0-9;?]*)([ -\/]*[@-~])/.exec(esc.slice(i));
      if (csi) {
        if (csi[2].slice(-1) === 'm') { applySGR(csi[1], state); reopen(); }
        i += csi[0].length;
        continue;
      }
      const osc = /^\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/.exec(esc.slice(i));
      if (osc) { i += osc[0].length; continue; }
      i += 2;   // drop a lone escape + its next byte
      continue;
    }
    out += esc[i];
    i++;
  }
  if (open) out += '</span>';
  return out;
}

// applySGR folds one SGR sequence's parameters into the running colour state.
function applySGR(params, state) {
  const codes = params === '' ? [0] : params.split(';').map(n => parseInt(n, 10) || 0);
  for (let k = 0; k < codes.length; k++) {
    const n = codes[k];
    if (n === 0) { state.fg = null; state.rgb = null; state.bold = false; state.dim = false; }
    else if (n === 1) state.bold = true;
    else if (n === 2) state.dim = true;
    else if (n === 22) { state.bold = false; state.dim = false; }
    else if (n === 39) { state.fg = null; state.rgb = null; }
    else if (ANSI_FG[n]) { state.fg = ANSI_FG[n]; state.rgb = null; }
    else if (n === 38) {
      if (codes[k + 1] === 5) { state.rgb = ansi256(codes[k + 2]); state.fg = null; k += 2; }
      else if (codes[k + 1] === 2) { state.rgb = `rgb(${codes[k + 2] || 0},${codes[k + 3] || 0},${codes[k + 4] || 0})`; state.fg = null; k += 4; }
    }
    // background (40-49, 100-107) and unrecognised codes are ignored.
  }
}

// ansi256 maps a 256-colour index to an absolute rgb() (ANSI colours are
// absolute by definition): the 6x6x6 cube, the greyscale ramp, and the 16
// standard colours as concrete values.
function ansi256(n) {
  n = n | 0;
  if (n >= 16 && n <= 231) {
    n -= 16;
    const cv = v => v === 0 ? 0 : 55 + v * 40;
    return `rgb(${cv(Math.floor(n / 36))},${cv(Math.floor((n % 36) / 6))},${cv(n % 6)})`;
  }
  if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }
  const std = ['0,0,0', '205,0,0', '0,205,0', '205,205,0', '0,0,238', '205,0,205', '0,205,205', '229,229,229',
    '127,127,127', '255,0,0', '0,255,0', '255,255,0', '92,92,255', '255,0,255', '0,255,255', '255,255,255'];
  return `rgb(${std[n] || '0,0,0'})`;
}

// nodeInspectorHtml builds the R3 node inspector, hydrated from three
// server-computed sources rather than replay-derived accumulators: /state
// (status + attempts + timing), /nodes (the resolved prompt — served even for a
// yet-to-run node), and /stages (the response, or a tool node's output + exit
// code). The node's transcript is the feed slice: selecting a node scopes the
// feed (crumb visible), so the pane points there rather than re-rendering it.
//
// "stage detail unavailable" is unreachable by construction: a completed node
// shows its files, a running one a live-tail note, a pending one its prompt with
// a "not started" framing. Every field is attacker-controlled and escaped.
function nodeInspectorHtml(o) {
  o = o || {};
  const id = o.id || '';
  const st = o.state || { status: 'pending' };
  const node = o.node || {};
  const status = st.status || 'pending';
  const pending = status === 'pending';
  // Header: the authoritative status/attempts/timing from /state. Durations are
  // tabular-nums so multi-node timings align; the per-attempt breakdown lives in
  // the feed slice, so the header only names the count.
  const attempts = st.attempts > 1 ? `<span class="ins-attempts muted">${st.attempts} attempts</span>` : '';
  const meta = `<div class="stage-meta">${stateBadge(status)}${attempts}` +
    `<span class="ins-dur">${fmtDuration(st.started_at, st.completed_at)}</span></div>`;
  // Prompt: always from /nodes, so a yet-to-run node is informative, not broken.
  let prompt = '';
  if (node.prompt) {
    const framing = pending ? ` <span class="muted">— not started</span>` : '';
    prompt = `<h4>Prompt${framing}</h4><pre class="stage-text overflow-x-auto">${escapeHtml(node.prompt)}</pre>`;
  } else if (pending) {
    prompt = `<p class="muted">not started — this node has no prompt.</p>`;
  }
  const notStarted = pending && node.prompt ? `<p class="ins-notstarted muted">not started — prompt below</p>` : '';
  const feednote = `<p class="ins-feed muted">Transcript is the feed below, scoped to <b>${escapeHtml(id)}</b>.</p>`;
  return `<h3>${escapeHtml(id)}</h3>${meta}` +
    `<div id="node-findings">${nodeFindingsHtml(o.findings, status === 'completed')}</div>` +
    notStarted + prompt + nodeInspectorBody(o) + feednote;
}

// nodeInspectorBody renders the response-or-output section: a codergen node's
// markdown response, or a tool node's ANSI-rendered stdout/stderr with its exit
// code. A node that has not produced its output yet (running, or pending) points
// at the live feed instead of showing an empty box.
function nodeInspectorBody(o) {
  const st = o.state || {};
  const status = st.status || 'pending';
  if (status === 'pending') return '';            // nothing ran yet; prompt shown above
  const node = o.node || {};
  const stage = o.stage || null;
  if (node.type === 'tool') {
    const exitTxt = o.exit != null
      ? ` <span class="ins-exit${o.exit === 0 ? '' : ' fail'}">exit ${escapeHtml(String(o.exit))}</span>` : '';
    let body;
    if (o.output) body = `<pre class="stage-text overflow-x-auto">${ansiToHtml(o.output)}</pre>`;
    else if (status === 'running') body = `<p class="muted">running — output streams in the feed below.</p>`;
    else body = `<p class="muted">no output captured.</p>`;
    return `<h4>Output${exitTxt}</h4>${body}`;
  }
  if (stage && stage.response) {
    return `<h4>Response</h4><div class="stage-md md">${renderMarkdown(stage.response)}</div>`;
  }
  if (status === 'running') {
    return `<h4>Response</h4><p class="muted">running — response streams in the feed below.</p>`;
  }
  return `<h4>Response</h4><p class="muted">no response recorded.</p>`;
}

// nodeDetailCache memoises GET /nodes/{node} per run: the prepared graph is
// immutable, so a node's prompt/type is fetched once and reused across selects.
const nodeDetailCache = {};

// selectNode opens the R3 inspector for a node, hydrating it from /state,
// /nodes, and /stages (and, for a completed tool node, its tail output). It
// never renders "unavailable": whatever a source lacks degrades to a framed
// note. selectedNode guards the race where a later click resolves first, so a
// slow fetch never overwrites a newer selection.
async function selectNode(id, manual = true) {
  // A manual click pins the node so the run's auto-follow (stage_started) stops
  // hijacking the inspector; auto-selection passes manual=false.
  if (manual) pinnedNode = true;
  selectedNode = id;
  const run = currentRun;
  const pane = $('node-pane');
  if (pane) pane.innerHTML = loadingState();
  const stale = () => selectedNode !== id || currentRun !== run;
  const [state, node, stage] = await Promise.all([
    fetchJSON(`/pipelines/${run}/state`),
    fetchNodeDetail(run, id),
    fetchJSON(`/pipelines/${run}/stages/${id}`),
  ]);
  if (stale()) return;
  const nodeSt = (state && state.nodes && state.nodes[id]) || { status: 'pending' };
  let output = null, exit = null;
  // A completed/failed tool node's stdout/stderr are files served by the tail
  // endpoint (the same source the feed's check blocks read); its exit code is on
  // the stage detail (server-derived from the tool outcome context).
  if (node && node.type === 'tool' && (nodeSt.status === 'completed' || nodeSt.status === 'failed')) {
    output = await fetchStageOutput(run, id);
    if (stale()) return;
    if (stage && stage.exit_code != null && stage.exit_code !== '') exit = Number(stage.exit_code);
    else if (nodeSt.outcome) exit = nodeSt.outcome === 'success' ? 0 : 1;
  }
  if (stale()) return;
  if (pane) pane.innerHTML = nodeInspectorHtml({
    id, state: nodeSt, node: node || {}, stage, output, exit,
    findings: nodeFindings[id] || [],
  });
}

// fetchJSON GETs a URL and returns its parsed JSON, or null on any failure —
// the inspector composes from whatever resolves, so a missing source is a
// framed note, never a thrown error.
async function fetchJSON(url) {
  try {
    const r = await fetch(url);
    if (r.ok) return await r.json();
  } catch (e) { /* fall through to null */ }
  return null;
}

// fetchNodeDetail returns GET /nodes/{node}, memoised per run (the prepared
// graph is immutable, so a node's prompt/type never changes within a run).
async function fetchNodeDetail(run, id) {
  const key = run + '#' + id;
  if (nodeDetailCache[key]) return nodeDetailCache[key];
  const d = await fetchJSON(`/pipelines/${run}/nodes/${id}`);
  if (d) nodeDetailCache[key] = d;
  return d;
}

// ARTIFACT_RENDER_CAP bounds how much artifact text the run detail renders
// inline (U4). A multi-megabyte diff or log would freeze the tab, so anything
// larger is skipped (diff) or truncated (inline view) — the raw file is still
// downloadable via GET …/artifacts/{path}.
const ARTIFACT_RENDER_CAP = 512 * 1024;

// artifactURL percent-encodes each path segment (U4) so a file whose name
// holds #, ?, %, or a space stays reachable, while the / separators between
// segments survive for the server's {path...} match.
function artifactURL(path) {
  return String(path).split('/').map(encodeURIComponent).join('/');
}

// loadArtifacts fills the U4 Diff + Artifacts regions for the current run. It
// lists the run's logs tree (GET …/artifacts), renders the browser, then
// auto-fetches the first diff-looking file and paints it in the Diff region.
// Everything degrades to an empty/error state — a run with no artifacts yet
// reads clean, not broken. Wiring the click handler here (not at boot) keeps it
// bound to the freshly-rendered list.
async function loadArtifacts() {
  if (!currentRun) return;
  const run = currentRun;                 // guard: a run switch mid-fetch must
  const stale = () => currentRun !== run; // not paint this run into the shared DOM
  const listEl = $('run-artifacts-list');
  const diffEl = $('run-diff-body');
  if (listEl) listEl.innerHTML = loadingState();
  if (diffEl) diffEl.innerHTML = '';
  let entries;
  try {
    const r = await fetch(`/pipelines/${run}/artifacts`);
    if (!r.ok) throw new Error(String(r.status));
    entries = (await r.json()).entries || [];
  } catch (e) {
    if (listEl && !stale()) listEl.innerHTML = errorState('artifacts unavailable');
    return;
  }
  if (stale()) return;
  if (listEl) {
    listEl.innerHTML = artifactListHtml(entries);
    listEl.onclick = e => {
      const row = e.target.closest && e.target.closest('.artifact-row');
      if (row) viewArtifact(row.getAttribute('data-path'));
    };
  }
  if (!diffEl) return;
  // The daemon serves the run's jj-derived diff (T9c/P2) at /diff for every
  // runner, classified by the X-Diff-Status header: "ok" is a real change,
  // "no-commits-yet" and "not-computable" are distinct empty states the Diff
  // section renders honestly (R4). The header is authoritative — no *.diff
  // artifact fallback masks it; only a failed /diff request falls through.
  try {
    const r = await fetch(`/pipelines/${run}/diff`);
    if (r.ok) {
      const status = r.headers.get('X-Diff-Status') || '';
      const text = await r.text();
      if (stale()) return;
      // Cap the jj-diff render like the artifact path (T9c B3): a body past the
      // cap (the daemon serves cap+1 bytes for exactly this signal) would freeze
      // the tab, so show a note instead of rendering.
      if (text.length > ARTIFACT_RENDER_CAP) {
        diffEl.innerHTML = emptyState(`Diff too large to render inline (${fmtBytes(text.length)}). ` +
          `Open it from Artifacts below.`);
        return;
      }
      diffEl.innerHTML = diffBodyHtml(status, text);
      return;
    }
  } catch (e) { /* fall back to a *.diff artifact */ }
  if (stale()) return;
  const diff = entries.find(e => !e.is_dir && isDiffPath(e.path));
  if (!diff) { diffEl.innerHTML = emptyState('This run produced no diff.'); return; }
  if (diff.size > ARTIFACT_RENDER_CAP) {
    diffEl.innerHTML = emptyState(`Diff too large to render inline (${fmtBytes(diff.size)}). ` +
      `Open it from Artifacts below.`);
    return;
  }
  try {
    const r = await fetch(`/pipelines/${run}/artifacts/${artifactURL(diff.path)}`);
    if (!r.ok) throw new Error(String(r.status));
    const text = await r.text();
    if (!stale()) diffEl.innerHTML = diffHtml(text);
  } catch (e) {
    if (!stale()) diffEl.innerHTML = errorState('diff unavailable');
  }
}

// viewArtifact fetches a single artifact and shows it inline (U4): a diff-looking
// file renders coloured, anything else as escaped text. The body is
// attacker-controlled, so it is never inserted raw.
async function viewArtifact(path) {
  if (!currentRun) return;
  const run = currentRun;
  const view = $('run-artifact-view');
  if (!view) return;
  view.innerHTML = loadingState();
  let body;
  try {
    const r = await fetch(`/pipelines/${run}/artifacts/${artifactURL(path)}`);
    if (!r.ok) throw new Error(String(r.status));
    body = await r.text();
  } catch (e) {
    if (currentRun === run) view.innerHTML = errorState('could not load ' + escapeHtml(path));
    return;
  }
  if (currentRun !== run) return;         // a run switch won the race
  let note = '';
  if (body.length > ARTIFACT_RENDER_CAP) {
    note = `<p class="muted">Showing the first ${fmtBytes(ARTIFACT_RENDER_CAP)} of ` +
      `${fmtBytes(body.length)} — truncated.</p>`;
    body = body.slice(0, ARTIFACT_RENDER_CAP);
  }
  // A diff renders coloured line-by-line; any other file (a stdout/stderr
  // capture carries SGR escapes) renders through the shared ANSI converter so
  // colours read and no raw \x1b garbage reaches the operator.
  const inner = isDiffPath(path)
    ? `<div class="diff min-w-0">${diffHtml(body)}</div>`
    : `<pre class="stage-text overflow-x-auto">${ansiToHtml(body)}</pre>`;
  view.innerHTML = `<h4>${escapeHtml(path)}</h4>${note}${inner}`;
}

// ---- run feed (ui-run-view-v3 R2) --------------------------------------
// The feed is the run's main surface: the whole run as a conversation-like
// stream, built ONCE from the SSE replay history and appended to by live
// events (hydrate-then-append). Every user-visible fact about node STATE comes
// from /state (the R1 card, the graph); the feed only reshapes the event
// transcript — so refreshing mid-run rebuilds the same feed.
//
// The model is an ordered array of entry objects; ingest mutates it in place
// (a prose bubble accumulates tokens, a divider gains its duration on
// completion) and renderFeed rebuilds #feed from it, debounced so a 1800-event
// replay is O(entries) per frame, not O(events^2).
let feed = [];                 // ordered feed model
let feedScope = '';            // node filter for the breadcrumb ('' = whole run)
const feedKinds = { prose: true, tools: true, checks: true, lifecycle: true };
let feedTerminal = false;      // the run reached a terminal event (clears live)
let feedFollow = true;         // auto-scroll to the newest entry (paused on scroll-up)
let feedRenderQueued = false;
// Ingest cursors — the "current" node run whose prose/tools accumulate.
let feCurNode = null, feCurAttempt = 0, feCurProse = null, feLiveEntry = null;
let feLastCompleted = null;    // most recent non-gate node to finish (a gate's subject)
const feStageDivider = {};     // "node#attempt" -> divider entry (for the duration fill)
const feLastAttempt = {};      // node -> its last started run ordinal (completions carry none)
const feRunOrdinal = {};       // node -> how many times it has run (divider "attempt n")
const feGateNodes = {};        // node -> true once it emits an interview (suppresses its check)
const feProseSeen = {};        // "node#attempt" -> true (a run that made a bubble is not a check)
const feAnswers = {};          // question_id -> {label, note} captured via the live answer flow
let fePendingGate = null;      // a gate answered but whose taken edge is not yet known
const feRepoChecks = {};       // check node -> configured command (hydrated from /config)

// STRUCTURAL_NODES are the graph's plumbing (entry/exit markers): they emit
// lifecycle events but no work, so they get neither a divider nor a block.
const STRUCTURAL_NODES = new Set(['start', 'done', 'end']);

// FEED_PROSE_CLAMP is how tall a prose bubble grows before it clamps to a
// preview with an expand control (collapse-never-truncate); FAILED_TAIL_LINES
// is how much of a failed check's tail auto-shows.
const FEED_PROSE_CLAMP_PX = 260;
const FAILED_TAIL_LINES = 40;
const CHECK_HEADTAIL_LINES = 200;   // head+tail kept for a huge expanded output

// feedReset clears the model and every ingest cursor for a fresh run.
function feedReset() {
  feed = [];
  feedScope = '';
  feedKinds.prose = feedKinds.tools = feedKinds.checks = feedKinds.lifecycle = true;
  feedTerminal = false;
  feedFollow = true;
  feCurNode = null; feCurAttempt = 0; feCurProse = null; feLiveEntry = null;
  feLastCompleted = null; fePendingGate = null;
  for (const k in feStageDivider) delete feStageDivider[k];
  for (const k in feLastAttempt) delete feLastAttempt[k];
  for (const k in feRunOrdinal) delete feRunOrdinal[k];
  for (const k in feGateNodes) delete feGateNodes[k];
  for (const k in feProseSeen) delete feProseSeen[k];
  for (const k in feAnswers) delete feAnswers[k];
  for (const k in feRepoChecks) delete feRepoChecks[k];
  renderFeed();
}

// feedPush appends an entry and schedules a render.
function feedPush(entry) {
  feed.push(entry);
  scheduleFeedRender();
  return entry;
}

// feedIngest turns one streamed event into feed entries (or accumulates into
// the open one). It runs on the SAME dispatch as the timeline/graph, gated by
// the replay cursor, so a reconnect never double-ingests. Child-run events are
// the nested pipeline's transcript, not this feed's.
function feedIngest(kind, ev) {
  if (isChildEvent(ev)) return;
  switch (kind) {
    case 'stage_started': {
      const node = ev.node_id;
      // The divider's "attempt n" is the run ordinal — how many times this node
      // has run (retries and fix-loop re-entries both count), matching the
      // approved mock ("implement attempt 2"). The engine's ev.attempt is a
      // retry-within-a-single-run counter and reads 1 on every loop re-entry.
      feCurNode = node; feCurAttempt = (feRunOrdinal[node] || 0) + 1; feCurProse = null;
      feRunOrdinal[node] = feCurAttempt;
      feLastAttempt[node] = feCurAttempt;
      // A gate answered on the previous events took whichever edge leads to the
      // node now starting — that reveals the chosen option's label.
      if (fePendingGate && !fePendingGate.answer) {
        resolveGateAnswer(fePendingGate, node);
        fePendingGate = null;
      }
      if (STRUCTURAL_NODES.has(node)) break;
      const d = { t: 'divider', node, attempt: feCurAttempt, startTs: ev.ts };
      feStageDivider[node + '#' + feCurAttempt] = d;
      feedPush(d);
      break;
    }
    case 'stage_progress': {
      const dk = ev.detail && ev.detail.kind;
      if (dk === 'tool_call') { ensureProse(); if (feCurProse) feCurProse.tools.push(ev.message || ''); scheduleFeedRender(); }
      else if (ev.message) { ensureProse(); if (feCurProse) feCurProse.text += ev.message; scheduleFeedRender(); }
      break;
    }
    case 'stage_completed':
    case 'stage_failed': {
      const node = ev.node_id;
      const att = feLastAttempt[node] || 1;
      const failed = kind === 'stage_failed';
      const d = feStageDivider[node + '#' + att];
      // stage_failed carries no duration_ns; fall back to the start→end span.
      if (d) {
        d.durNs = ev.duration_ns != null ? ev.duration_ns : tsDeltaNs(d.startTs, ev.ts);
        d.status = failed ? 'failed' : 'completed';
      }
      // A run that produced a prose bubble is a codergen node; one that produced
      // none (and is neither structural nor a gate) is a tool/check → output block.
      const madeProse = feProseSeen[node + '#' + att];
      if (!madeProse && !STRUCTURAL_NODES.has(node) && !feGateNodes[node]) {
        feedPush({
          t: 'check', node, attempt: att, status: failed ? 'failed' : 'completed',
          durNs: ev.duration_ns, cmd: feCheckCmd(node),
          exit: failed ? parseExit(ev.message) : 0,
          output: null, expanded: false, loading: false,
        });
        if (failed) autoLoadCheck(node, att);   // a failed check auto-shows its tail
      }
      if (!feGateNodes[node] && !STRUCTURAL_NODES.has(node)) feLastCompleted = node;
      if (feCurProse && feCurProse.node === node) { feCurProse.live = false; feCurProse = null; }
      scheduleFeedRender();
      break;
    }
    case 'interview_started': {
      const node = ev.node_id;
      feGateNodes[node] = true;
      // The gate replaces the plumbing divider its stage_started pushed.
      const att = feLastAttempt[node] || 1;
      const d = feStageDivider[node + '#' + att];
      if (d) d.suppressed = true;
      const gate = {
        t: 'gate', node, qid: ev.question_id,
        question: ev.question || { text: ev.message || '' },
        precedingNode: feLastCompleted, planText: (nodeProse[feLastCompleted] || []).join(''),
        startTs: ev.ts, answered: false, answer: null,
      };
      feedPush(gate);
      if (feLastCompleted) loadFeedPlan(gate);
      break;
    }
    case 'interview_answered': {
      const gate = lastGateFor(ev.question_id);
      if (gate) {
        gate.answered = true;
        gate.answeredAfterNs = tsDeltaNs(gate.startTs, ev.ts);
        const d = ev.detail || {};
        // A live answer (captured by this session's answer flow) wins — it has
        // the note exactly as typed. Otherwise the answer content the daemon
        // now records on the event (chosen label + note) fills the bubble on a
        // replayed/reloaded run. Only a legacy event with neither falls back to
        // deriving the label from the edge the run then took.
        if (feAnswers[gate.qid]) gate.answer = feAnswers[gate.qid];
        else if (d.label != null) gate.answer = { label: d.label, note: d.note || '' };
        else fePendingGate = gate;   // wait for the next stage_started to reveal the edge
      }
      scheduleFeedRender();
      break;
    }
    // The parent run's own terminal clears the live indicator; a forwarded child
    // terminal (guarded above) does not.
    case 'pipeline_completed':
    case 'pipeline_failed':
      feedMarkTerminal();
      break;
  }
}

// ensureProse opens the current node run's message bubble on the first prose or
// tool_call token, marking it the live bubble (the streaming one) until the run
// ends or the next node starts.
function ensureProse() {
  if (feCurProse) return;
  if (feLiveEntry) feLiveEntry.live = false;
  feCurProse = { t: 'prose', node: feCurNode, attempt: feCurAttempt, text: '', tools: [], live: !feedTerminal };
  feProseSeen[feCurNode + '#' + feCurAttempt] = true;
  feLiveEntry = feCurProse;
  feedPush(feCurProse);
}

// feedMarkTerminal clears the live indicator once the run has ended.
function feedMarkTerminal() {
  feedTerminal = true;
  if (feLiveEntry) { feLiveEntry.live = false; feLiveEntry = null; }
  feCurProse = null;
  scheduleFeedRender();
}

// lastGateFor finds the most recent gate entry for a question id.
function lastGateFor(qid) {
  for (let i = feed.length - 1; i >= 0; i--) {
    if (feed[i].t === 'gate' && feed[i].qid === qid) return feed[i];
  }
  return null;
}

// feCheckCmd returns a check node's command, from the repo's configured checks
// (the authoritative source, hydrated up front) — else empty (shown headerless).
function feCheckCmd(node) { return feRepoChecks[node] || ''; }

// parseExit pulls the numeric exit code out of a tool failure message
// ("tool: exit status 1: …"); defaults to 1 when absent.
function parseExit(msg) {
  const m = /exit status (\d+)/.exec(String(msg || ''));
  return m ? parseInt(m[1], 10) : 1;
}

// tsDeltaNs is the nanoseconds between two ISO timestamps (for a gate's
// answered-after duration), or null if either is missing/unparseable.
function tsDeltaNs(a, b) {
  const ta = new Date(a).getTime(), tb = new Date(b).getTime();
  if (isNaN(ta) || isNaN(tb)) return null;
  return (tb - ta) * 1e6;
}

// resolveGateAnswer fills a gate's answer bubble. A live answer (captured by
// the answer flow) wins; otherwise the chosen option is derived from the edge
// the run took — the gate's outgoing edge to the node that ran next carries the
// option's label. The note is only known for live answers.
async function resolveGateAnswer(gate, nextNode) {
  if (gate.answer) return;
  if (feAnswers[gate.qid]) { gate.answer = feAnswers[gate.qid]; scheduleFeedRender(); return; }
  let label = 'answered';
  try {
    const r = await fetch(`/pipelines/${currentRun}/nodes/${gate.node}`);
    if (r.ok) {
      const d = await r.json();
      const edge = (d.outgoing || []).find(e => e.to === nextNode && e.label);
      if (edge) label = edge.label;
    }
  } catch (e) { /* keep the generic label */ }
  gate.answer = { label, note: '' };
  scheduleFeedRender();
}

// loadFeedPlan fills a gate's plan snippet with the reviewed node's produced
// text — its canonical response when the daemon has the stage file, else the
// prose reconstructed from the stream (VM runs keep stage files on the guest).
async function loadFeedPlan(gate) {
  try {
    const r = await fetch(`/pipelines/${currentRun}/stages/${gate.precedingNode}`);
    if (r.ok) {
      const d = await r.json();
      if (d.response) { gate.planText = d.response; scheduleFeedRender(); }
    }
  } catch (e) { /* keep the streamed-prose fallback */ }
}

// autoLoadCheck / expandCheck fetch a check's captured output on demand. The
// output is served by the stage tail endpoint (P5d): stderr carries the command
// echo + summary, stdout the detail — both ANSI-rendered. A failed check loads
// eagerly (its tail auto-shows); a passing one loads when the operator expands.
async function fetchStageOutput(run, node) {
  const grab = async (file) => {
    try {
      const r = await fetch(`/pipelines/${run}/stages/${node}/tail?file=${file}&offset=0`);
      if (r.status === 200) return await r.text();
    } catch (e) { /* absent file → empty */ }
    return '';
  };
  const [err, out] = await Promise.all([grab('stderr'), grab('stdout')]);
  return [err, out].filter(Boolean).join('\n');
}

function findCheck(node, attempt) {
  return feed.find(e => e.t === 'check' && e.node === node && e.attempt === attempt);
}

async function autoLoadCheck(node, attempt) {
  const e = findCheck(node, attempt);
  if (!e || e.loading || e.output != null) return;
  e.loading = true; scheduleFeedRender();
  const run = currentRun;
  const text = await fetchStageOutput(run, node);
  if (currentRun !== run) return;
  e.loading = false; e.output = text; scheduleFeedRender();
}

// toggleCheck expands/collapses a check's output, loading it lazily the first
// time an unfetched block is expanded.
async function toggleCheck(node, attempt, act) {
  const e = findCheck(node, attempt);
  if (!e) return;
  if (act === 'collapse') { e.expanded = false; scheduleFeedRender(); return; }
  e.expanded = true;
  if (e.output == null && !e.loading) { await autoLoadCheck(node, attempt); }
  scheduleFeedRender();
}

// ---- feed rendering (pure builders) ------------------------------------

// fmtDurNs formats a nanosecond duration like the mock: "3.0s" under ten
// seconds, then "Mm SSs" and "Hh MMm".
function fmtDurNs(ns) {
  if (ns == null || isNaN(ns)) return '';
  const secs = ns / 1e9;
  if (secs < 10) return secs.toFixed(1) + 's';
  const s = Math.round(secs);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  if (h) return `${h}h ${String(m).padStart(2, '0')}m`;
  if (m) return `${m}m ${String(r).padStart(2, '0')}s`;
  return `${r}s`;
}

// feChip renders a clickable node chip that scopes the feed to that node.
function feChip(node) {
  return `<span class="fe-chip" data-node="${escapeHtml(node)}" role="button" tabindex="0">${escapeHtml(node)}</span>`;
}

// tailLines keeps the last n lines of text; clamped reports whether any were
// dropped (a failed check shows its tail).
function tailLines(text, n) {
  const lines = String(text).replace(/\n$/, '').split('\n');
  if (lines.length <= n) return { text: lines.join('\n'), clamped: false };
  return { text: lines.slice(-n).join('\n'), clamped: true };
}

// headTail keeps the head AND tail of a huge output, eliding the middle
// (collapse-never-truncate: the full text stays one fetch away).
function headTail(text, n) {
  const lines = String(text).replace(/\n$/, '').split('\n');
  if (lines.length <= 2 * n) return { text: lines.join('\n'), clamped: false };
  const elided = lines.length - 2 * n;
  return {
    text: lines.slice(0, n).join('\n') + `\n… ${elided} lines elided …\n` + lines.slice(-n).join('\n'),
    clamped: true,
  };
}

// feEntryHtml dispatches one model entry to its typed builder, wrapping it as a
// filterable feed entry (data-kind drives the kind chips; data-node the scope).
function feEntryHtml(e) {
  if (e.t === 'divider') return e.suppressed ? '' : feDividerHtml(e);
  if (e.t === 'prose') return feProseHtml(e);
  if (e.t === 'check') return feCheckHtml(e);
  if (e.t === 'gate') return feGateHtml(e);
  return '';
}

// feDividerHtml renders a thin lifecycle row: node chip · attempt n · duration.
function feDividerHtml(e) {
  const parts = [`attempt ${e.attempt || 1}`];
  const done = e.status === 'completed' || e.status === 'failed';
  if (done) parts.push(`<span class="fe-dur">${e.durNs != null ? fmtDurNs(e.durNs) : (e.status === 'failed' ? 'failed' : 'done')}</span>`);
  else parts.push('running');
  const cls = e.status === 'failed' ? ' fe-div-fail' : '';
  return `<div class="fe-entry fe-divider${cls}" data-kind="lifecycle" data-node="${escapeHtml(e.node)}">` +
    `${feChip(e.node)}<span class="fe-div-meta">${parts.join(' · ')}</span></div>`;
}

// feProseHtml renders a node run's message bubble: markdown prose, a per-group
// collapsed "N tool calls", and the live dot while streaming. The prose clamps
// by height with an expand control (revealed by renderFeed only when it
// overflows).
function feProseHtml(e) {
  const tools = e.tools && e.tools.length
    ? `<details class="fe-tools"><summary>${e.tools.length} tool call${e.tools.length > 1 ? 's' : ''}</summary>` +
      e.tools.map(t => `<div class="fe-tool-row">${escapeHtml(t)}</div>`).join('') + `</details>`
    : '';
  const live = e.live ? ` <span class="fe-live">● live</span>` : '';
  return `<div class="fe-entry fe-msg" data-kind="prose" data-node="${escapeHtml(e.node)}">` +
    `<div class="fe-who">${feChip(e.node)} <span class="muted">agent</span>${live}</div>` +
    `<div class="fe-prose"><div class="fe-prose-body md">${renderMarkdown(e.text)}</div>` +
    `<button class="fe-more" hidden data-act="prose-toggle">show more</button></div>${tools}</div>`;
}

// feCheckHtml renders a tool/check output block: chip · command · exit (colour
// by outcome) · duration, over the captured output. A failed block shows its
// tail auto-expanded; expanding a huge output keeps head+tail with "show full"
// still reachable.
function feCheckHtml(e) {
  const failed = e.status === 'failed';
  const exitTxt = failed ? `exit ${e.exit != null ? e.exit : 1}` : 'exit 0';
  const dur = e.durNs != null ? ` <span class="fe-dur">${fmtDurNs(e.durNs)}</span>` : '';
  const cmd = e.cmd ? ` <span class="fe-cmd">${escapeHtml(e.cmd)}</span>` : '';
  const head = `<div class="fe-check-row">${feChip(e.node)}${cmd} <span class="fe-exit">${exitTxt}</span>${dur}</div>`;
  const attr = ` data-node="${escapeHtml(e.node)}" data-attempt="${e.attempt}"`;
  let body;
  if (e.loading) {
    body = `<div class="fe-out-note muted">loading output…</div>`;
  } else if (e.output) {
    let shown, more;
    if (e.expanded) {
      const p = headTail(e.output, CHECK_HEADTAIL_LINES);
      shown = p.text;
      more = `<button class="fe-out-toggle"${attr} data-act="collapse">collapse output</button>`;
    } else {
      const t = tailLines(e.output, FAILED_TAIL_LINES);
      shown = t.text;
      more = t.clamped
        ? `<button class="fe-out-toggle"${attr} data-act="expand">show full output</button>` : '';
    }
    body = `<pre class="fe-out overflow-x-auto">${ansiToHtml(shown)}</pre>${more}`;
  } else if (e.output === '') {
    body = `<div class="fe-out-note muted">no output captured</div>`;
  } else {
    body = `<button class="fe-out-toggle"${attr} data-act="expand">▸ output</button>`;
  }
  return `<div class="fe-entry fe-check${failed ? ' fail' : ''}" data-kind="checks" data-node="${escapeHtml(e.node)}">${head}${body}</div>`;
}

// feGateHtml renders a human gate as a first-class turn: the question, the
// reviewed node's plan snippet (markdown, expandable), and — once answered —
// the answer bubble (chosen option label + any note).
function feGateHtml(e) {
  const q = e.question || {};
  const status = e.answered
    ? `answered${e.answeredAfterNs != null ? ` after ${fmtDurNs(e.answeredAfterNs)}` : ''}`
    : 'waiting for you';
  const plan = e.planText
    ? `<details class="fe-plan"><summary>Show ${escapeHtml(e.precedingNode || 'plan')} output</summary>` +
      `<div class="fe-plan-body md">${renderMarkdown(e.planText)}</div></details>`
    : '';
  const answer = e.answered ? feAnswerHtml(e.answer) : '';
  return `<div class="fe-entry fe-gate-wrap" data-kind="gate" data-node="${escapeHtml(e.node)}">` +
    `<div class="fe-gate">` +
    `<div class="fe-who">${feChip(e.node)} <span class="fe-gate-tag">⏸ human gate · ${escapeHtml(status)}</span></div>` +
    `<div class="fe-q">${escapeHtml(q.text || '')}</div>${plan}</div>${answer}</div>`;
}

// feAnswerHtml renders the human's answer bubble: the chosen option label and,
// when known (a live answer), the note rendered as markdown.
function feAnswerHtml(a) {
  a = a || {};
  const note = a.note ? `<div class="fe-answer-note md">${renderMarkdown(a.note)}</div>` : '';
  return `<div class="fe-answer"><div class="fe-who muted">you · ${escapeHtml(a.label || 'answered')}</div>${note}</div>`;
}

// feedCrumbHtml renders the scope breadcrumb + kind-filter chips (the mock's
// "feed: whole run · filters: …"). The scope names the filtered node with a
// "show all" reset; each kind chip reflects its active state.
function feedCrumbHtml() {
  const scope = feedScope
    ? `<b>${escapeHtml(feedScope)}</b> · <a href="#" data-feed-scope="">show all</a>`
    : '<b>whole run</b>';
  const chip = (k, label) =>
    `<span class="fe-filter${feedKinds[k] ? ' active' : ''}" data-feed-kind="${k}" role="button" tabindex="0">${label}</span>`;
  return `feed: ${scope} · filters: ` +
    chip('prose', 'prose') + ' ' + chip('tools', 'tools') + ' ' +
    chip('checks', 'checks') + ' ' + chip('lifecycle', 'lifecycle');
}

// scheduleFeedRender coalesces a burst of ingests (replay is thousands of
// events) into a single render on the next tick.
function scheduleFeedRender() {
  if (feedRenderQueued) return;
  feedRenderQueued = true;
  setTimeout(() => { feedRenderQueued = false; renderFeed(); }, 0);
}

// renderFeed rebuilds #feed from the model, applies the kind + scope filters
// (hidden entries are display:none, never re-derived), refreshes the crumb, and
// follows the tail while live unless the operator scrolled up.
function renderFeed() {
  const crumb = $('feed-crumb');
  if (crumb) crumb.innerHTML = feedCrumbHtml();
  const el = $('feed');
  if (!el) return;
  el.innerHTML = feed.map(feEntryHtml).join('') ||
    '<p class="state state-empty">Waiting for the run to produce events…</p>';
  applyFeedKinds();
  applyFeedScope();
  // Reveal a prose bubble's "show more" only when it actually overflows the
  // clamp, so short prose carries no stray control.
  el.querySelectorAll('.fe-prose').forEach(p => {
    const body = p.querySelector('.fe-prose-body');
    const more = p.querySelector('.fe-more');
    if (!body || !more) return;
    if (!p.classList.contains('open') && body.scrollHeight > FEED_PROSE_CLAMP_PX + 8) more.hidden = false;
  });
  if (feedFollow && window.scrollTo) window.scrollTo(0, (document.body && document.body.scrollHeight) || 0);
}

// applyFeedKinds toggles the kind classes on #feed so a disabled chip hides
// that entry type via CSS (no model change).
function applyFeedKinds() {
  const el = $('feed');
  if (!el) return;
  el.classList.toggle('hide-prose', !feedKinds.prose);
  el.classList.toggle('hide-tools', !feedKinds.tools);
  el.classList.toggle('hide-checks', !feedKinds.checks);
  el.classList.toggle('hide-lifecycle', !feedKinds.lifecycle);
}

// applyFeedScope hides every entry not belonging to the scoped node.
function applyFeedScope() {
  const el = $('feed');
  if (!el) return;
  el.querySelectorAll('.fe-entry').forEach(fe => {
    fe.classList.toggle('scoped-out', !!feedScope && fe.getAttribute('data-node') !== feedScope);
  });
}

// setFeedScope filters the feed to one node (or clears it), updating the crumb.
function setFeedScope(node) {
  feedScope = node || '';
  renderFeed();
}

// toggleFeedKind flips one kind filter chip.
function toggleFeedKind(kind) {
  if (!(kind in feedKinds)) return;
  feedKinds[kind] = !feedKinds[kind];
  renderFeed();
}

// ---- config view -------------------------------------------------------
// The Config view edits the whole daemon-owned config doc (config-screen-
// spec C4): hand-built panels over GET /config, saved back whole via
// PUT /config. showConfig refetches on every entry (no cache — a stale or
// failure-cached config is worse than a reload) so edits made elsewhere and
// the true redaction state always show.
async function showConfig(warnings) {
  const body = $('config-body');
  body.innerHTML = loadingState();
  setConfigStatus('');
  let doc;
  try {
    const r = await fetch('/config');
    if (!r.ok) throw new Error('status ' + r.status);
    doc = await r.json();
  } catch (e) {
    body.innerHTML = errorState('could not load config');
    return;
  }
  configLoaded = doc;
  renderConfig(doc, warnings);
}

// renderConfig paints the panels from the loaded doc. Each panel is a pure
// name→HTML function so it is unit-testable via the node vm harness. Soft
// save-warnings (from a preceding PUT) are threaded to the Repos panel so
// they surface inline on the offending rows as well as in the top banner.
function renderConfig(doc, warnings) {
  linearClear = false;
  $('config-body').innerHTML =
    reposPanelHtml(doc.repos, warnings, doc.vm_images) + linearPanelHtml(doc.linear, linearClear) + providersPanelHtml(doc);
  setConfigDirty(false);
}

// setConfigStatus shows a save result above the panels: an error (structural
// rejection — nothing saved), a warning (soft — saved with caveats), or ok.
// Empty text clears it.
function setConfigStatus(text, kind) {
  const el = $('config-status');
  if (!el) return;
  el.textContent = text || '';
  el.className = text ? 'banner ' + (kind || '') : '';
}

// reposPanelHtml renders the Repos panel: one editable row per registered
// repo — owner/name, checkout path, and the standard check commands — plus
// an add-repo control. Every stored value is external to the HTML context,
// so all are escaped. The row inputs carry data-* hooks the save collector
// scrapes.
function reposPanelHtml(repos, warnings, vmImages) {
  const names = Object.keys(repos || {}).sort();
  // Empty-state hint spans every column (owner/name + path + runner + image +
  // each standard check + the remove control) so a fresh config reads as "none
  // yet, add one" rather than a bare header (config-screen-spec C5).
  const cols = 5 + STANDARD_CHECKS.length;
  const rows = names.length
    ? names.map(name => repoRowHtml(name, repos[name] || {}, repoWarning(name, warnings), vmImages)).join('')
    : `<tr data-empty-hint><td class="muted" colspan="${cols}">No repos registered — add one.</td></tr>`;
  // Mobile-first responsive (ui-tailwind-spec T2): the wide table overflows a
  // phone, so at <640px it collapses to stacked cards (block table sub-elements,
  // header hidden — each row carries its own field labels) and restores to a
  // real table at sm.
  const fixed = ['owner/name', 'path', 'runner', 'image'].map(h => `<th class="${TH_CLASS}">${h}</th>`).join('');
  const head = `<tr>${fixed}${
    STANDARD_CHECKS.map(c => `<th class="${TH_CLASS}">${escapeHtml(c)}</th>`).join('')}<th></th></tr>`;
  return `<section class="config-panel card" id="config-repos">
    <h3>Repos</h3>
    <p class="muted">Registered repos and their check commands — the run-form dropdown and the check backbone read these.</p>
    ${dataTable(head, rows, 'config-repos-rows')}
    <p><button type="button" data-repo-add>add repo</button></p>
  </section>`;
}

// repoRowHtml renders one repo row. An empty name/path (the add-repo case)
// yields a blank editable row. A non-empty warning (a soft save-warning for
// this repo, e.g. an unresolved path) surfaces inline under the path input
// so the reject-vs-warn distinction lands on the offending row, not only in
// the top banner (config-screen-spec C5).
function repoRowHtml(name, rc, warning, vmImages, expanded) {
  // A row with a soft save-warning auto-expands so the inline ⚠ (which sits in
  // the collapsible path cell) is visible on a phone — a collapsed warned row
  // would look valid, defeating the C5 validation surface (ui-tailwind-spec
  // T7b). An explicit `expanded` (the add-repo case) still wins.
  if (expanded === undefined) expanded = !!warning;
  const checks = rc.checks || {};
  const checkCells = STANDARD_CHECKS.map(c =>
    cardCell(escapeHtml(c), `<input class="w-full sm:w-auto ${FIELD_CONTROL_CLASS}" data-check="${escapeHtml(c)}" value="${escapeHtml(checks[c] || '')}">`, false, 'accordion-detail')).join('');
  const warn = warning
    ? `<div class="config-note" data-repo-warning>⚠ ${escapeHtml(warning)}</div>` : '';
  const runner = rc.runner || '';
  const summary = accordionSummaryCell(escapeHtml(name) || 'new repo', escapeHtml(runner || '(default)'), expanded);
  return `<tr data-repo-row class="${CARD_ROW_CLASS}${expanded ? '' : ' is-collapsed'}">
    ${summary}
    ${cardCell('owner/name', `<input class="w-full sm:w-auto ${FIELD_CONTROL_CLASS}" data-repo-name value="${escapeHtml(name)}" placeholder="owner/name">`, false, 'accordion-detail')}
    ${cardCell('path', `<input class="w-full sm:w-auto ${FIELD_CONTROL_CLASS}" data-repo-path value="${escapeHtml(rc.path || '')}" placeholder="/path/to/checkout">${warn}`, false, 'accordion-detail')}
    ${cardCell('runner', runnerSelectHtml(runner), false, 'accordion-detail')}
    ${cardCell('image', imageSelectHtml((rc.vm && rc.vm.image) || '', runner, vmImages), false, 'accordion-detail')}
    ${checkCells}
    ${cardCell('', '<button type="button" data-repo-remove title="remove repo">&times;</button>', false, 'accordion-detail')}
  </tr>`;
}

// runnerSelectHtml renders the per-repo runner (launcher placement) select: a
// blank "(default)" — leave the daemon --runner default — plus the fixed
// direct|local|vm placements, the declared one selected. data-repo-runner is
// the save-collector hook and the change handler that toggles the row's image
// select (per-repo VM config, VM4).
function runnerSelectHtml(runner) {
  const opts = ['', 'direct', 'local', 'vm'].map(v =>
    `<option value="${escapeHtml(v)}"${v === runner ? ' selected' : ''}>${v || '(default)'}</option>`).join('');
  return `<select class="w-full sm:w-auto ${FIELD_CONTROL_CLASS}" data-repo-runner>${opts}</select>`;
}

// imageSelectHtml renders the per-repo VM image select: a blank "(default)"
// image plus each registered vm_images name, the declared one selected. It is
// only meaningful when the runner is vm, so it is disabled otherwise (the save
// collector likewise drops the image off-vm). Names are external → escaped.
// isNonVMPlacement reports an EXPLICIT non-vm runner (direct|local), where a
// vm.image is meaningless. An unset runner is not one — it inherits the
// daemon default, which may be vm (per-repo VM config, VM4).
function isNonVMPlacement(runner) {
  return runner === 'direct' || runner === 'local';
}

function imageSelectHtml(image, runner, vmImages) {
  const names = Object.keys(vmImages || {}).sort();
  // The registry is nix/CLI-managed and drifts independently of the config, so
  // a repo may be pinned to an image no longer registered — still a valid
  // persisted ref (dispatch falls back to default). Union it in so the select
  // represents and round-trips the stored value instead of collapsing it to
  // (default) and wiping the pin on save (per-repo VM config, VM4).
  if (image && !names.includes(image)) names.push(image);
  const opts = [''].concat(names).map(v =>
    `<option value="${escapeHtml(v)}"${v === image ? ' selected' : ''}>${v ? escapeHtml(v) : '(default)'}</option>`).join('');
  // Editable unless an explicit non-vm placement — an unset runner inherits
  // the daemon default (which may be vm), so a pin is meaningful there too.
  const dis = isNonVMPlacement(runner) ? ' disabled' : '';
  return `<select class="w-full sm:w-auto ${FIELD_CONTROL_CLASS}" data-repo-image${dis}>${opts}</select>`;
}

// repoWarning finds the soft save-warning for a repo, matching the backend's
// `repo %q:` prefix (config Validate) so the quoted name delimits the match
// — a same-prefixed sibling ("a/bc") does not steal "a/b"'s warning. Returns
// the warning string, or '' when none applies.
function repoWarning(name, warnings) {
  const prefix = `repo "${name}":`;
  return (warnings || []).find(w => String(w).startsWith(prefix)) || '';
}

// linearPanelHtml renders the Linear secret panel: the key's set/unset
// state (never the value — GET /config redacts it), a secret input that
// replaces the stored key only when non-empty, and a Clear control shown
// only when a key is stored (nothing to clear otherwise). armedClear
// reflects a pending Clear: the input is disabled, the note announces the
// clear, and the control flips to an undo — so arming is a re-render, not a
// one-way DOM mutation.
function linearPanelHtml(linear, armedClear) {
  const set = !!(linear && linear.api_key_set);
  const armed = set && !!armedClear;
  return `<section class="config-panel card" id="config-linear">
    <h3>Linear</h3>
    <p class="muted">API key for the Linear item source — status <strong>${set ? 'set' : 'unset'}</strong>. The stored key is never shown.</p>
    ${formField('API key', `<input type="password" id="config-linear-key" class="w-full ${FIELD_CONTROL_CLASS}"${armed ? ' disabled' : ''} placeholder="${
      set ? 'leave blank to keep the stored key' : 'enter a key'}">`)}
    <p>${set ? `<button type="button" data-linear-clear>${armed ? 'keep key' : 'clear key'}</button> ` : ''}<span id="config-linear-note" class="config-note">${
      armed ? 'key will be cleared on save' : ''}</span></p>
  </section>`;
}

// providersPanelHtml renders the Providers panel: the default-provider
// choice plus an editable row per provider (backend / command / model_env).
// Providers are startup-built, so a restart note flags that edits apply
// only after the daemon restarts (config-screen-spec effect timing).
function providersPanelHtml(doc) {
  const providers = (doc && doc.providers) || {};
  const def = (doc && doc.default_provider) || '';
  const names = Object.keys(providers).sort();
  const options = names.map(n =>
    `<option value="${escapeHtml(n)}"${n === def ? ' selected' : ''}>${escapeHtml(n)}</option>`).join('');
  // Empty-state hint spans provider + backend + command + model_env + the
  // remove control (C5 empty states).
  const rows = names.length
    ? names.map(n => providerRowHtml(n, providers[n] || {})).join('')
    : `<tr data-empty-hint><td class="muted" colspan="5">No providers configured — add one.</td></tr>`;
  return `<section class="config-panel card" id="config-providers">
    <h3>Providers</h3>
    <p class="muted">Agent backends the router dispatches to.</p>
    <p class="config-note">Editing providers takes effect only after a daemon restart.</p>
    ${formField('default provider', `<select id="config-default-provider" class="w-full ${FIELD_CONTROL_CLASS}"><option value=""${def ? '' : ' selected'}>(none — simulate bare runs)</option>${options}</select>`)}
    ${dataTable(`<tr>${['provider', 'backend', 'command', 'model_env'].map(h => `<th class="${TH_CLASS}">${h}</th>`).join('')}<th></th></tr>`, rows, 'config-providers-rows')}
    <p><button type="button" data-provider-add>add provider</button></p>
  </section>`;
}

// providerRowHtml renders one provider row; a blank name is the add case.
function providerRowHtml(name, p, expanded) {
  const summary = accordionSummaryCell(escapeHtml(name) || 'new provider', escapeHtml(p.backend || '(none)'), expanded);
  return `<tr data-provider-row class="${CARD_ROW_CLASS}${expanded ? '' : ' is-collapsed'}">
    ${summary}
    ${cardCell('provider', `<input class="w-full sm:w-auto ${FIELD_CONTROL_CLASS}" data-provider-name value="${escapeHtml(name)}" placeholder="name">`, false, 'accordion-detail')}
    ${cardCell('backend', `<input class="w-full sm:w-auto ${FIELD_CONTROL_CLASS}" data-provider-backend value="${escapeHtml(p.backend || '')}" placeholder="acp|claudecode|simulation">`, false, 'accordion-detail')}
    ${cardCell('command', `<input class="w-full sm:w-auto ${FIELD_CONTROL_CLASS}" data-provider-command value="${escapeHtml(p.command || '')}">`, false, 'accordion-detail')}
    ${cardCell('model_env', `<input class="w-full sm:w-auto ${FIELD_CONTROL_CLASS}" data-provider-model-env value="${escapeHtml(p.model_env || '')}">`, false, 'accordion-detail')}
    ${cardCell('', '<button type="button" data-provider-remove title="remove provider">&times;</button>', false, 'accordion-detail')}
  </tr>`;
}

// onConfigClick handles every panel's delegated add/remove/clear — the
// panels are innerHTML so a single listener on the view drives each row's
// control (matching the items/run-list convention).
function onConfigClick(e) {
  // A mobile accordion header toggles its row's collapse (T7b): flip the row
  // class the CSS keys off and keep aria-expanded in sync (vanilla-JS toggle,
  // like the nav menu — no dep). Handled first so it never falls through to a
  // repo/provider control.
  const acc = e.target.closest('button[data-accordion-toggle]');
  if (acc) {
    const row = acc.closest('tr');
    const collapsed = row.classList.toggle('is-collapsed');
    acc.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    return;
  }
  if (e.target.closest('button[data-repo-add]')) {
    const rows = $('config-repos-rows');
    if (rows) {
      rows.querySelectorAll('tr[data-empty-hint]').forEach(r => r.remove());
      // Expanded so the fresh row's fields are ready to type into.
      rows.insertAdjacentHTML('beforeend', repoRowHtml('', {}, '', (configLoaded && configLoaded.vm_images) || {}, true));
    }
    return;
  }
  const rmRepo = e.target.closest('button[data-repo-remove]');
  if (rmRepo) { rmRepo.closest('tr[data-repo-row]').remove(); return; }
  if (e.target.closest('button[data-provider-add]')) {
    const rows = $('config-providers-rows');
    if (rows) {
      rows.querySelectorAll('tr[data-empty-hint]').forEach(r => r.remove());
      rows.insertAdjacentHTML('beforeend', providerRowHtml('', {}, true));
    }
    return;
  }
  const rmProv = e.target.closest('button[data-provider-remove]');
  if (rmProv) { rmProv.closest('tr[data-provider-row]').remove(); return; }
  if (e.target.closest('button[data-linear-clear]')) {
    // Toggle the pending clear and re-render just the Linear panel from the
    // redacted load state, so arming is reversible ("keep key" un-arms) and
    // in-progress repo/provider edits elsewhere are left untouched.
    linearClear = !linearClear;
    setConfigDirty(true);
    const panel = $('config-linear');
    if (panel && configLoaded) panel.outerHTML = linearPanelHtml(configLoaded.linear, linearClear);
  }
}

// onConfigChange handles delegated select changes: a runner select flipping
// to/from vm enables/disables that row's image select (the image is only
// meaningful under a vm runner — dispatch resolution §2). It also marks the
// view dirty, since select changes don't fire the input listener in every
// browser.
function onConfigChange(e) {
  setConfigDirty(true);
  const runnerSel = e.target.closest('select[data-repo-runner]');
  if (!runnerSel) return;
  const img = runnerSel.closest('tr[data-repo-row]')?.querySelector('select[data-repo-image]');
  if (img) img.disabled = isNonVMPlacement(runnerSel.value);
}

// setConfigDirty tracks unsaved edits so the user sees the view has pending
// changes; a successful save (or a fresh render) clears it.
function setConfigDirty(dirty) {
  configDirty = dirty;
  const el = $('config-dirty');
  if (el) el.textContent = dirty ? 'unsaved changes' : '';
}

// collectConfig scrapes the panels' inputs into a plain form object. Non-
// standard checks a repo may carry (e.g. e2e) are not shown as columns, so
// they are seeded from the loaded doc keyed by the row's current name and
// preserved on save — only the four standard checks are edited here.
function collectConfig() {
  const loaded = (configLoaded && configLoaded.repos) || {};
  const repos = [...document.querySelectorAll('#config-repos-rows tr[data-repo-row]')].map(tr => {
    const name = tr.querySelector('[data-repo-name]').value.trim();
    const checks = { ...((loaded[name] && loaded[name].checks) || {}) };
    tr.querySelectorAll('input[data-check]').forEach(inp => {
      const v = inp.value.trim();
      if (v) checks[inp.dataset.check] = v; else delete checks[inp.dataset.check];
    });
    return {
      name, path: tr.querySelector('[data-repo-path]').value.trim(), checks,
      runner: tr.querySelector('[data-repo-runner]').value,
      image: tr.querySelector('[data-repo-image]').value,
    };
  });
  const providers = [...document.querySelectorAll('#config-providers-rows tr[data-provider-row]')].map(tr => ({
    name: tr.querySelector('[data-provider-name]').value.trim(),
    backend: tr.querySelector('[data-provider-backend]').value.trim(),
    command: tr.querySelector('[data-provider-command]').value.trim(),
    model_env: tr.querySelector('[data-provider-model-env]').value.trim(),
  }));
  return {
    defaultProvider: $('config-default-provider').value,
    providers, repos,
    linearKey: $('config-linear-key').value,
    linearClear,
  };
}

// buildPutBody reshapes the collected form into the PUT /config Document:
// provider/repo rows become maps (blank-name rows dropped), and the Linear
// secret follows secret-merge — an empty key is sent empty (preserve), a
// value replaces, an armed clear sets api_key_clear (the distinct clear).
function buildPutBody(form) {
  const providers = {};
  for (const p of form.providers) {
    if (!p.name) continue;
    providers[p.name] = { backend: p.backend, command: p.command, model_env: p.model_env };
  }
  const repos = {};
  for (const r of form.repos) {
    if (!r.name) continue;
    const rc = { path: r.path, checks: r.checks || {} };
    // A declared runner rides as a field; an unset runner emits no key,
    // keeping an untouched config byte-unchanged. The vm.image pin is kept
    // unless the runner is an EXPLICIT non-vm placement — an unset runner
    // inherits the daemon default, which may be vm, so the pin stays a valid
    // value there (dispatch resolves the image on the effective runner —
    // spec §Dispatch resolution). Dropping it on a blank runner would wipe a
    // legitimate pin.
    if (r.runner) rc.runner = r.runner;
    if (r.image && r.runner !== 'direct' && r.runner !== 'local') rc.vm = { image: r.image };
    repos[r.name] = rc;
  }
  const linear = { api_key: form.linearKey || '' };
  if (form.linearClear) linear.api_key_clear = true;
  // vm_images is deliberately not sent: it is server-owned (nix/CLI-managed),
  // the server preserves it across a PUT that omits it, and echoing a stale
  // GET snapshot would revert a concurrent registry edit (per-repo VM config,
  // VM4).
  return { default_provider: form.defaultProvider || '', providers, repos, linear };
}

// saveMessage classifies the PUT /config response into a banner: a 422 is a
// structural rejection (nothing saved), a 200 with warnings saved softly, a
// clean 200 saved, anything else a generic failure.
function saveMessage(status, body) {
  if (status === 200) {
    const warnings = (body && body.warnings) || [];
    if (warnings.length) return { kind: 'warn', text: 'Saved with warnings: ' + warnings.join('; ') };
    return { kind: 'ok', text: 'Saved.' };
  }
  if (status === 422 && body && body.error) return { kind: 'error', text: body.error };
  return { kind: 'error', text: `Save failed (${status}).` };
}

// saveConfig PUTs the whole doc. A structural rejection (422) keeps the
// user's edits on screen — nothing was saved, so re-reading would discard
// them. A success re-reads from the server (reflecting redaction and
// clearing the pending-clear/dirty state) before showing the result.
let configSaving = false;
async function saveConfig() {
  if (!configLoaded || configSaving) return;   // no save before a successful load
  configSaving = true;
  const btn = $('config-save');
  if (btn) btn.disabled = true;
  setConfigStatus('saving…', '');
  try {
    let r;
    try {
      r = await putJSON('/config', buildPutBody(collectConfig()));
    } catch (e) { setConfigStatus('could not reach the daemon', 'error'); return; }
    let body = {};
    try { body = await r.json(); } catch (e) { /* an error body may not be JSON */ }
    const msg = saveMessage(r.status, body);
    // Re-render from server truth (reflects redaction, clears dirty), carrying
    // the soft warnings so they land inline on the offending repo rows too.
    if (r.status === 200) await showConfig((body && body.warnings) || []);
    setConfigStatus(msg.text, msg.kind);
  } finally {
    configSaving = false;
    if (btn) btn.disabled = false;
  }
}

// ---- wait.human dock ---------------------------------------------------
async function refreshDock() {
  if (!currentRun) return;
  try {
    const r = await fetch(`/pipelines/${currentRun}/questions`);
    renderDock((await r.json()).questions || []);
  } catch (e) { /* transient; retried on next tick */ }
}

// renderDock builds the wait.human dock via DOM + listeners rather than
// interpolating question text into an HTML string: option labels can
// contain quotes that would otherwise break an inline onclick attribute.
function renderDock(questions) {
  const dock = $('human-dock');
  // The loud header banner and the sidebar dock render from the same list, so
  // they can never disagree about whether a run is blocked (U5).
  $('run-blocked').innerHTML = blockedBannerHtml(questions);
  dock.textContent = '';
  if (!questions.length) return;
  const h = document.createElement('h3'); h.textContent = 'open questions';
  dock.appendChild(h);
  questions.forEach(q => {
    const box = document.createElement('div'); box.className = 'q';
    const label = document.createElement('div');
    label.textContent = (q.text || '') + ' ';
    const who = document.createElement('span'); who.className = 'muted';
    who.textContent = '(' + (q.node_id || '') + ')';
    label.appendChild(who);
    box.appendChild(label);
