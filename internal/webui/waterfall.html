<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>attractor run</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #d7dae0;
    --dim: #8b93a1; --accent: #6ea8fe; --ok: #4cc38a; --warn: #e5c07b;
    --bad: #e06c75; --retry: #c678dd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
           padding: .6rem 1rem; border-bottom: 1px solid var(--line);
           position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header .goal { color: var(--dim); overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; max-width: 34ch; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: .1rem .6rem;
          background: var(--panel); white-space: nowrap; }
  .chip b { color: var(--accent); font-weight: 600; }
  .status-running { color: var(--warn); } .status-completed { color: var(--ok); }
  .status-failed { color: var(--bad); }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line);
           border-radius: 4px; padding: .1rem .3rem; font: inherit; }
  button.tab { background: var(--panel); color: var(--text); border: 1px solid var(--line);
               border-radius: 4px; padding: .15rem .6rem; cursor: pointer; font: inherit; }
  button.tab.active, button.tab:hover { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr minmax(0, 30rem); min-height: calc(100vh - 3rem); }
  #left { min-width: 0; }
  #waterfall { padding: .8rem 1rem; overflow-x: auto; }
  #graphview, #artifactsview, #contextview { display: none; padding: .8rem 1rem; overflow: auto; }
  #graphview img { max-width: 100%; background: #f6f8fa; border-radius: 6px; }
  #detail { border-left: 1px solid var(--line); padding: .8rem 1rem; background: var(--panel);
            display: none; overflow-wrap: anywhere; }
  #detail.open { display: block; }
  #detail pre { white-space: pre-wrap; background: var(--bg); padding: .5rem;
                border-radius: 4px; max-height: 22rem; overflow: auto; }
  #detail .close { float: right; cursor: pointer; color: var(--dim); }
  #detail h3 { margin: .2rem 0 .4rem; }
  .cap { color: var(--dim); margin-top: .7rem; }
  .lane { display: grid; grid-template-columns: 16rem 1fr; gap: .5rem;
          align-items: center; margin-bottom: .35rem; }
  .lane-label { text-align: right; color: var(--dim); overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .lane-label .ctx { display: block; height: 3px; background: var(--line);
                     border-radius: 2px; margin-top: 2px; overflow: hidden; }
  .lane-label .ctx i { display: block; height: 100%; background: var(--accent); }
  .track { position: relative; height: 1.4rem; }
  .span { position: absolute; top: 2px; bottom: 2px; border-radius: 3px;
          background: #31384a; border: 1px solid var(--line); cursor: pointer;
          overflow: hidden; min-width: 6px; }
  .span.success { background: #1e3a2f; border-color: var(--ok); }
  .span.fail { background: #3a2326; border-color: var(--bad); }
  .span.retry { background: #33273c; border-color: var(--retry); border-style: dashed; }
  .span.running { border-color: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { filter: brightness(1.5); } }
  .tick { position: absolute; top: 20%; bottom: 20%; width: 2px; background: var(--dim); }
  .tick.failed { background: var(--bad); width: 3px; }
  .glyph { font-size: .8em; margin-right: .2rem; }
  #questions { padding: 0 1rem; }
  .question { border: 1px solid var(--warn); border-radius: 6px; padding: .6rem .8rem;
              margin: .6rem 0; background: var(--panel); }
  .question button { margin: .2rem .4rem .2rem 0; background: var(--bg); color: var(--text);
                     border: 1px solid var(--accent); border-radius: 4px; padding: .25rem .7rem;
                     cursor: pointer; font: inherit; }
  .question button:hover { background: var(--accent); color: var(--bg); }
  .question input { background: var(--bg); color: var(--text); border: 1px solid var(--line);
                    border-radius: 4px; padding: .25rem; font: inherit; width: 60%; }
  .question .cap { color: var(--dim); font-size: .8rem; margin: .4rem 0 .2rem; }
  .question pre.qcontext { max-height: 40vh; overflow: auto; white-space: pre-wrap;
                    background: var(--bg); border: 1px solid var(--line); border-radius: 4px;
                    padding: .5rem; margin: 0 0 .4rem; font-size: .85rem; }
  .fail-banner { margin: .6rem 1rem; padding: .5rem .8rem; border: 1px solid var(--bad);
                 border-radius: 6px; color: var(--bad); white-space: pre-wrap; }
  #live { background: var(--bg); border: 1px solid var(--warn); border-radius: 4px;
          padding: .5rem; max-height: 14rem; overflow: auto; white-space: pre-wrap; }
  .toolcall { border: 1px solid var(--line); border-radius: 4px; margin: .25rem 0; }
  .toolcall summary { cursor: pointer; padding: .25rem .5rem; color: var(--dim); }
  .toolcall pre { margin: 0; max-height: 16rem; }
  table.kv { border-collapse: collapse; width: 100%; }
  table.kv td { border-bottom: 1px solid var(--line); padding: .3rem .5rem;
                vertical-align: top; }
  table.kv td.k { color: var(--accent); white-space: nowrap; }
  table.kv td.v { white-space: pre-wrap; overflow-wrap: anywhere; }
  ul.files { list-style: none; padding: 0 0 0 .2rem; margin: 0; }
  ul.files a { color: var(--accent); text-decoration: none; }
  .visits button { margin-right: .3rem; }
</style>
</head>
<body>
<header>
  <span id="name">…</span>
  <span class="goal" id="goal"></span>
  <span class="chip">status <b id="status">…</b></span>
  <span class="chip">runtime <b id="runtime">–</b></span>
  <span class="chip">tokens <b id="tokens">–</b></span>
  <span class="chip">spans <b id="spancount">–</b></span>
  <label>lane <select id="groupby">
    <option value="node_id">node</option>
    <option value="thread_id">thread</option>
    <option value="class">class</option>
    <option value="type">type</option>
  </select></label>
  <span style="flex:1"></span>
  <button class="tab active" id="tab-waterfall">waterfall</button>
  <button class="tab" id="tab-graph">graph</button>
  <button class="tab" id="tab-context">context</button>
  <button class="tab" id="tab-artifacts">files</button>
</header>
<div id="failreason" class="fail-banner" style="display:none"></div>
<div id="questions"></div>
<main>
  <div id="left">
    <div id="waterfall"></div>
    <div id="graphview"></div>
    <div id="contextview"></div>
    <div id="artifactsview"></div>
  </div>
  <aside id="detail"><span class="close" onclick="closeDetail()">✕</span><div id="detail-body"></div></aside>
</main>
<script>
"use strict";
let runId = null, lastSeq = -1, doc = null;
let eventCursor = 0;
// liveText accumulates recent agent output per node from the event
// stream (assistant deltas), so a running span can show what the agent
// is saying right now.
const liveText = {};
let lastSpeaker = null; // node_id of the most recent node to emit agent text
let selected = null; // the span open in the detail panel
let following = true; // auto-open the running node's detail until the user pins one
let questionsSig = ""; // signature of the pending questions currently rendered
const gateContent = {}; // span base -> canonical "what's being reviewed" text (cached)
const $ = id => document.getElementById(id);

// On the hub, the page is served at /ui/{run_id}; on a single-run
// server at /ui (run id resolved from the one-entry /pipelines list).
{
  const parts = location.pathname.split("/").filter(Boolean);
  if (parts[0] === "ui" && parts[1]) runId = decodeURIComponent(parts[1]);
}

async function j(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(url + ": " + r.status);
  return r.headers.get("content-type")?.includes("json") ? r.json() : r.text();
}
const api = path => "/pipelines/" + encodeURIComponent(runId) + path;

// Poll loop (D5): 500ms tick, never stops — a finished run keeps
// serving its final state, a restarted server just resumes.
async function tick() {
  try {
    if (!runId) {
      const list = await j("/pipelines");
      if (list.length) runId = list[0].run_id;
    }
    if (runId) {
      const d = await j(api(""));
      if (d.last_seq !== lastSeq || d.status === "running") {
        lastSeq = d.last_seq; doc = d; render();
      }
      await drainEvents();
    }
  } catch (e) { /* server briefly unavailable; keep polling */ }
  setTimeout(tick, 500);
}

// drainEvents tails the event stream from a cursor and keeps the last
// ~80 lines of agent output per node for the live view.
async function drainEvents() {
  const text = await j(api("/events?since=" + eventCursor));
  if (typeof text !== "string" || !text.trim()) return;
  for (const line of text.split("\n")) {
    if (!line.trim()) continue;
    let ev;
    try { ev = JSON.parse(line); } catch { continue; }
    if (ev.seq > eventCursor) eventCursor = ev.seq;
    if (ev.kind === "stage_progress" && ev.detail?.kind === "assistant_delta" && ev.node_id) {
      const buf = (liveText[ev.node_id] = liveText[ev.node_id] || []);
      buf.push(ev.message || "");
      // Deltas are fragments; keep a bounded tail.
      if (buf.length > 400) buf.splice(0, buf.length - 400);
      lastSpeaker = ev.node_id;
    }
  }
  if (selected && selected.outcome === "running") renderLive();
  if (doc && doc.pending_questions && doc.pending_questions.length) updateGateContexts();
}

function fmtTokens(u) {
  if (!u || (!u.input_tokens && !u.output_tokens)) return "–";
  const k = n => n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
  return k(u.input_tokens || 0) + " in / " + k(u.output_tokens || 0) + " out";
}
function fmtDur(ms) {
  if (ms < 0) return "–";
  const s = Math.floor(ms / 1000);
  return s >= 3600 ? Math.floor(s/3600) + "h" + Math.floor(s%3600/60) + "m"
       : s >= 60 ? Math.floor(s/60) + "m" + (s%60) + "s" : s + "s";
}
const GLYPH = { success: "✓", fail: "✗", retry: "↻", running: "◐", partial_success: "◑", skipped: "⊘" };

function render() {
  // Re-point `selected` at the fresh span object so its outcome
  // (running → success) stays current across polls — auto-follow and the
  // live panel both key off selected.outcome.
  if (selected) {
    const fresh = doc.spans.find(x => x.node_id === selected.node_id
      && x.visit === selected.visit && x.attempt === selected.attempt);
    if (fresh) selected = fresh;
  }
  $("name").textContent = doc.graph_name || doc.run_id;
  $("goal").textContent = doc.goal || "";
  $("goal").title = doc.goal || "";
  $("status").textContent = doc.status;
  $("status").className = "status-" + doc.status;
  $("tokens").textContent = fmtTokens(doc.usage);
  $("spancount").textContent = doc.spans.length;
  const start = Date.parse(doc.started_at);
  const end = doc.ended_at ? Date.parse(doc.ended_at) : Date.now();
  $("runtime").textContent = fmtDur(end - start);
  $("failreason").style.display = doc.failure_reason ? "block" : "none";
  $("failreason").textContent = doc.failure_reason || "";
  renderQuestions();
  renderWaterfall(start, end);
  autoFollow();
}

// autoFollow opens the running node's detail automatically so live agent
// output is visible without a click. It stops once the user pins a span
// (clicks one) or closes the panel, so it never fights manual navigation.
function autoFollow() {
  if (!following) return;
  // Follow the running agent node — the one producing live text — not a
  // gate or tool node, whose detail panel has nothing to stream.
  const running = doc.spans.filter(s => s.outcome === "running" && s.type === "codergen");
  if (!running.length) return;
  const s = running[running.length - 1];
  if (!selected || selected.node_id !== s.node_id
    || selected.visit !== s.visit || selected.attempt !== s.attempt) {
    openDetail(s);
  }
}

function renderQuestions() {
  const qs = doc.pending_questions || [];
  const sig = qs.map(q => q.id).join("|");
  // Build the box only when the set of questions changes. The 500ms poll
  // calls render() constantly while running; rebuilding every tick would
  // wipe the note field and steal focus the moment you click into it. The
  // "what's being reviewed" panel is refreshed separately (updateGateContexts)
  // so its content can arrive after the box without touching the input.
  if (sig !== questionsSig) {
    questionsSig = sig;
    const host = $("questions");
    host.innerHTML = "";
    for (const q of qs) {
      const box = el("div", "question");
      box.appendChild(el("div", null, "⏸ " + (q.question?.text || q.message || q.id)));
      box.appendChild(el("div", "cap", "what's being reviewed — the agent's work leading into this gate"));
      const pre = el("pre", "qcontext", "(waiting for agent output…)");
      pre.id = "gatectx-" + q.id;
      box.appendChild(pre);
      const note = el("input");
      note.placeholder = "optional note to the agent";
      for (const opt of q.question?.options || []) {
        // Edge labels often embed their own accelerator ("[S] Ship") —
        // don't prefix a second copy of the key.
        const b = el("button", null, opt.label.startsWith("[") ? opt.label : "[" + opt.key + "] " + opt.label);
        b.onclick = () => answer(q.id, opt.key, note.value);
        box.appendChild(b);
      }
      box.appendChild(note);
      host.appendChild(box);
    }
  }
  updateGateContexts();
}

// updateGateContexts fills each gate's "what's being reviewed" panel with the
// work leading into it: the CANONICAL structured output of the most recent
// agent node (plan_markdown for a plan gate, review.summary for a ship gate,
// else its final response) — not just the streamed narration, which for a
// plan node is the agent's chatter rather than the plan itself. Refreshed in
// place so it can arrive after the box without disturbing the note field.
function latestCodergenSpan() {
  const done = doc.spans.filter(s => s.type === "codergen" && s.ended_at);
  if (!done.length) return null;
  done.sort((a, b) => Date.parse(a.ended_at) - Date.parse(b.ended_at));
  return done[done.length - 1];
}

async function fetchGateContent(base) {
  try {
    const st = await j(api("/artifacts/" + base + "/status.json"));
    const cu = (st && typeof st === "object" && st.context_updates) || {};
    const canonical = cu.plan_markdown || cu["review.summary"]
      || (cu.review && cu.review.summary) || cu.last_response;
    if (canonical && String(canonical).trim()) return String(canonical);
  } catch (e) { /* no structured status for this node */ }
  try {
    const resp = await j(api("/artifacts/" + base + "/response.md"));
    if (typeof resp === "string" && resp.trim()) return resp;
  } catch (e) { /* no response artifact */ }
  return "";
}

function paintGateContexts(text) {
  if (!text) return;
  const shown = text.length > 12000 ? text.slice(-12000) : text;
  for (const q of doc.pending_questions || []) {
    const pre = $("gatectx-" + q.id);
    if (pre) pre.textContent = shown;
  }
}

function updateGateContexts() {
  if (!doc.pending_questions || !doc.pending_questions.length) return;
  const subj = latestCodergenSpan();
  // Fallback until the canonical artifact resolves: the streamed text.
  let text = (liveText[(subj && subj.node_id) || lastSpeaker] || []).join("").trim();
  if (subj) {
    const base = spanBase(subj.node_id, subj.visit, subj.attempt);
    if (gateContent[base] === undefined) {
      gateContent[base] = ""; // in-flight: fetch once
      fetchGateContent(base).then(t => { if (t) { gateContent[base] = t; paintGateContexts(t); } });
    }
    if (gateContent[base]) text = gateContent[base];
  }
  paintGateContexts(text);
}

async function answer(qid, value, note) {
  try {
    await j(api("/questions/" + encodeURIComponent(qid) + "/answer"),
      { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value, note }) });
  } catch (e) { alert("answer failed: " + e.message); }
}

// Waterfall (D5): one lane per groupBy key, spans placed
// time-truthfully within the lane. Tool calls render as tick marks,
// red on error.
function renderWaterfall(start, end) {
  const key = $("groupby").value;
  const lanes = new Map();
  for (const s of doc.spans) {
    const k = s[key] || s.node_id;
    if (!lanes.has(k)) lanes.set(k, []);
    lanes.get(k).push(s);
  }
  const total = Math.max(end - start, 1);
  const host = $("waterfall");
  host.innerHTML = "";
  const maxTokens = Math.max(...[...lanes.values()].map(
    ss => ss.reduce((a, s) => a + (s.input_tokens || 0), 0)), 1);
  for (const [label, spans] of lanes) {
    const lane = document.createElement("div");
    lane.className = "lane";
    const lab = document.createElement("div");
    lab.className = "lane-label";
    lab.textContent = label;
    lab.title = label;
    const laneTokens = spans.reduce((a, s) => a + (s.input_tokens || 0), 0);
    const ctx = document.createElement("span");
    ctx.className = "ctx";
    const fill = document.createElement("i");
    fill.style.width = (100 * laneTokens / maxTokens) + "%";
    ctx.appendChild(fill);
    lab.appendChild(ctx);
    lane.appendChild(lab);
    const track = document.createElement("div");
    track.className = "track";
    for (const s of spans) {
      const s0 = Date.parse(s.started_at);
      const s1 = s.ended_at ? Date.parse(s.ended_at) : end;
      const el = document.createElement("div");
      el.className = "span " + (s.outcome === "partial_success" ? "success" : s.outcome);
      el.style.left = (100 * (s0 - start) / total) + "%";
      el.style.width = Math.max(100 * (s1 - s0) / total, 0.4) + "%";
      el.title = s.node_id + " v" + s.visit + " a" + s.attempt + " — " + s.outcome
               + (s.detail ? ": " + s.detail : "");
      const g = document.createElement("span");
      g.className = "glyph";
      g.textContent = GLYPH[s.outcome] || "";
      el.appendChild(g);
      for (const t of s.tool_calls || []) {
        const tick = document.createElement("span");
        tick.className = "tick" + (t.failed ? " failed" : "");
        tick.style.left = (100 * (Date.parse(t.at) - s0) / Math.max(s1 - s0, 1)) + "%";
        tick.title = t.title || "tool call";
        el.appendChild(tick);
      }
      el.onclick = () => { following = false; openDetail(s, null); };
      track.appendChild(el);
    }
    lane.appendChild(track);
    host.appendChild(lane);
  }
}

// ---- detail panel ---------------------------------------------------------

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// spanBase derives a span's directory from its identity (A4) — always
// constructed, never parsed: {node_id}@v{visit}.a{attempt}
const spanBase = (node, v, a) => node + "@v" + v + ".a" + a;

// openDetail renders one span's full story. The span itself names its
// exact evidence directory; sibling spans of the same node drive the
// visit/attempt tabs.
async function openDetail(s, ignored) {
  selected = s;
  const body = $("detail-body");
  body.innerHTML = "";
  body.appendChild(el("h3", null, s.node_id + " (visit " + s.visit + ", attempt " + s.attempt + ") — " + s.outcome));
  const meta = el("div", null, [s.type, s.class, s.model, s.thread_id && ("thread " + s.thread_id),
    fmtTokens({ input_tokens: s.input_tokens, output_tokens: s.output_tokens })]
    .filter(Boolean).join(" · "));
  body.appendChild(meta);
  if (s.detail) body.appendChild(el("pre", null, s.detail));

  // Visit/attempt tabs from SPAN data (not file listings): every
  // sibling execution of this node is a first-class span.
  const siblings = doc.spans.filter(x => x.node_id === s.node_id);
  if (siblings.length > 1) {
    const tabs = el("div", "visits");
    tabs.appendChild(el("span", "cap", "executions: "));
    for (const sib of siblings) {
      const label = "v" + sib.visit + ".a" + sib.attempt;
      const active = sib.visit === s.visit && sib.attempt === s.attempt;
      const b = el("button", "tab" + (active ? " active" : ""), label);
      b.title = sib.outcome;
      b.onclick = () => { following = false; openDetail(sib); };
      tabs.appendChild(b);
    }
    body.appendChild(tabs);
  }

  // Live agent output for a running span.
  if (s.outcome === "running") {
    body.appendChild(el("div", "cap", "live output"));
    const live = el("div");
    live.id = "live";
    body.appendChild(live);
    renderLive();
  }

  const base = spanBase(s.node_id, s.visit, s.attempt);
  let files = [];
  try { files = await j(api("/artifacts")); } catch (e) {}
  const spanFiles = files.filter(f => f.startsWith(base + "/"));

  for (const name of ["status.json", "agent-status.json", "prompt.md", "response.md"]) {
    if (spanFiles.length && !spanFiles.includes(base + "/" + name)) continue;
    try {
      const txt = await j(api("/artifacts/" + base + "/" + name));
      body.appendChild(el("div", "cap", name));
      body.appendChild(el("pre", null, typeof txt === "string" ? txt : JSON.stringify(txt, null, 2)));
    } catch (e) { /* artifact absent for this node kind */ }
  }
  // Tool node output.
  for (const name of ["stdout.txt", "stderr.txt"]) {
    if (!spanFiles.includes(base + "/" + name)) continue;
    try {
      const txt = await j(api("/artifacts/" + base + "/" + name));
      if (String(txt).trim()) {
        body.appendChild(el("div", "cap", name));
        body.appendChild(el("pre", null, String(txt)));
      }
    } catch (e) {}
  }

  // Tool-call payloads (the ticks, expandable).
  const calls = spanFiles.filter(f => f.startsWith(base + "/tool_calls/")).sort();
  if (calls.length) {
    body.appendChild(el("div", "cap", "tool calls (" + calls.length + ")"));
    for (const f of calls) {
      const d = el("details", "toolcall");
      d.appendChild(el("summary", null, f.split("/").pop()));
      d.addEventListener("toggle", async () => {
        if (d.open && d.childElementCount === 1) {
          try {
            const txt = await j(api("/artifacts/" + f));
            d.appendChild(el("pre", null, typeof txt === "string" ? txt : JSON.stringify(txt, null, 2)));
          } catch (e) { d.appendChild(el("pre", null, "unavailable: " + e.message)); }
        }
      }, { once: false });
      body.appendChild(d);
    }
  }
  $("detail").classList.add("open");
}

function renderLive() {
  const live = $("live");
  if (!live || !selected) return;
  live.textContent = (liveText[selected.node_id] || []).join("");
  live.scrollTop = live.scrollHeight;
}

function closeDetail() { selected = null; following = false; $("detail").classList.remove("open"); }

// ---- header tabs ----------------------------------------------------------

const views = { waterfall: "waterfall", graph: "graphview", context: "contextview", artifacts: "artifactsview" };
function showView(name) {
  for (const [n, id] of Object.entries(views)) {
    $(id).style.display = n === name ? "block" : "none";
    $("tab-" + n).classList.toggle("active", n === name);
  }
}
$("tab-waterfall").onclick = () => showView("waterfall");
$("tab-graph").onclick = async () => {
  showView("graph");
  const host = $("graphview");
  if (!host.childElementCount) {
    const img = document.createElement("img");
    img.alt = "pipeline graph";
    img.src = api("/graph");
    img.onerror = () => { host.textContent = "no graph available for this run"; };
    host.appendChild(img);
  }
};
$("tab-context").onclick = async () => {
  showView("context");
  const host = $("contextview");
  host.innerHTML = "";
  try {
    const ckpt = await j(api("/artifacts/checkpoint.json"));
    const values = (typeof ckpt === "string" ? JSON.parse(ckpt) : ckpt).context || {};
    const tbl = el("table", "kv");
    for (const k of Object.keys(values).sort()) {
      const tr = document.createElement("tr");
      tr.appendChild(el("td", "k", k));
      tr.appendChild(el("td", "v", values[k]));
      tbl.appendChild(tr);
    }
    host.appendChild(el("div", "cap", "run context (as of the last checkpoint)"));
    host.appendChild(tbl);
  } catch (e) {
    host.textContent = "no checkpoint yet — the context appears after the first completed node";
  }
};
$("tab-artifacts").onclick = async () => {
  showView("artifacts");
  const host = $("artifactsview");
  host.innerHTML = "";
  try {
    const files = await j(api("/artifacts"));
    const ul = el("ul", "files");
    for (const f of files.sort()) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = api("/artifacts/" + f);
      a.target = "_blank";
      a.textContent = f;
      li.appendChild(a);
      ul.appendChild(li);
    }
    host.appendChild(el("div", "cap", files.length + " files in the run directory"));
    host.appendChild(ul);
  } catch (e) { host.textContent = "artifacts unavailable: " + e.message; }
};

$("groupby").onchange = () => doc && render();
tick();
</script>
</body>
</html>
