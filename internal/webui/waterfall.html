<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run · attractor</title>
<style>/* UI_CSS */</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><span class="brandmark" aria-hidden="true"></span><a href="/ui">attractor</a></div>
    <nav class="railnav" aria-label="Workspace"><a href="/ui" id="hub-link">Runs</a><a class="current" href="#" id="current-run-link" aria-current="page">Run overview</a></nav>
    <div class="railfoot"><span class="connection" id="connection-dot"></span><span id="connection-label">Connecting…</span></div>
  </aside>
  <main class="content">
    <div class="breadcrumb" id="breadcrumb" hidden><a href="/ui">← Runs</a> / <span id="run-id"></span></div>
    <div id="run-heading"><h1>Loading run…</h1></div>
    <div id="connection-notice" role="status"></div>
    <div id="failreason" hidden class="notice error"></div>
    <div id="questions" aria-label="Human review"></div>
    <nav class="runtabs" aria-label="Run views">
      <button data-view="graph" aria-pressed="true">Graph</button>
      <button data-view="waterfall" aria-pressed="false">Readable waterfall</button>
      <button data-view="timing" aria-pressed="false">Accurate timing</button>
      <button data-view="steps" aria-pressed="false">Steps</button>
      <button data-view="context" aria-pressed="false">Context</button>
      <button data-view="files" aria-pressed="false">Files</button>
    </nav>
    <div class="runlayout noinspector" id="run-layout">
      <section id="view" style="min-width:0"><div class="empty">Loading run…</div></section>
      <aside class="inspector" id="inspector" tabindex="-1" aria-label="Execution inspector" hidden></aside>
    </div>
  </main>
</div>
<script id="ui-core">/* UI_CORE */</script>
<script>/* UI_APP */</script>
</body>
</html>
