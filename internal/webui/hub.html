<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runs · attractor</title>
<style>/* UI_CSS */</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><span class="brandmark" aria-hidden="true"></span><a href="/ui">attractor</a></div>
    <nav class="railnav" aria-label="Workspace"><a class="current" href="/ui" aria-current="page">Runs</a></nav>
    <div class="railfoot"><span class="connection" id="connection-dot"></span><span id="connection-label">Connecting…</span></div>
  </aside>
  <main class="content">
    <div class="heading"><div><div class="eyebrow">Workspace</div><h1>Runs</h1><p>Current work first. Recent results within reach.</p></div><button id="launch-toggle">+ Launch run</button></div>
    <div id="connection-notice" role="status"></div>
    <div class="tools">
      <input class="search" id="search" type="search" aria-label="Search runs" placeholder="Search name, run ID or pipeline…">
      <label for="historywindow" class="muted">History</label>
      <select id="historywindow"><option value="today">Today</option><option value="7" selected>Last 7 days</option><option value="all">All history</option></select>
      <label class="rowcheck"><input type="checkbox" id="groupnames">Group similar names</label>
    </div>
    <div id="hub-results"><div class="empty">Loading runs…</div></div>
    <p class="helper">Older results remain in All history. Similar names are a display grouping; every run stays accessible.</p>
  </main>
</div>
<dialog class="dialog" id="launch-dialog" aria-labelledby="launch-title">
  <form id="launch">
    <h2 id="launch-title">Launch a run</h2>
    <label class="fieldlabel" for="l-path">Pipeline name or DOT path</label><input id="l-path" required placeholder="plan-build-review">
    <label class="fieldlabel" for="l-cwd">Working tree</label><input id="l-cwd" placeholder="/path/to/repository">
    <label class="fieldlabel" for="l-vars">Variables · key=value, separated by spaces</label><textarea id="l-vars" placeholder="base=main"></textarea>
    <p id="l-msg" class="note" role="status"></p>
    <div class="dialogactions"><button id="launch-close" type="button">Close</button><button type="submit" id="launch-submit">Launch run</button></div>
  </form>
</dialog>
<script id="ui-core">/* UI_CORE */</script>
<script>/* UI_APP */</script>
</body>
</html>
