<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>attractor hub</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #d7dae0;
    --dim: #8b93a1; --accent: #6ea8fe; --ok: #4cc38a; --warn: #e5c07b;
    --bad: #e06c75;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display: flex; gap: .75rem; align-items: baseline;
           padding: .6rem 1rem; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 1rem; margin: 0; }
  header .dim { color: var(--dim); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: .45rem .8rem; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 400; }
  tr.run { cursor: pointer; }
  tr.run:hover { background: var(--panel); }
  a { color: var(--accent); text-decoration: none; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: .05rem .55rem;
          background: var(--panel); white-space: nowrap; }
  .running { color: var(--warn); } .completed { color: var(--ok); } .failed { color: var(--bad); }
  .live { color: var(--ok); } .unreachable { color: var(--bad); } .archived { color: var(--dim); }
  .goal { color: var(--dim); max-width: 40ch; overflow: hidden;
          text-overflow: ellipsis; white-space: nowrap; }
  .pill.pl { font-weight: 600; }
  .active { color: var(--accent); max-width: 18ch; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
  .dur { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.run code { color: var(--dim); }
  .dismiss { border: 1px solid var(--line); border-radius: 4px; background: none;
             color: var(--dim); cursor: pointer; padding: 0 .4rem; font: inherit; }
  .dismiss:hover { border-color: var(--bad); color: var(--bad); }
  #empty { padding: 2rem 1rem; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>attractor hub</h1>
  <span class="dim" id="counts">…</span>
  <span style="flex:1"></span>
  <button id="launch-toggle" class="pill" style="cursor:pointer">+ launch run</button>
</header>
<form id="launch" style="display:none; padding:.8rem 1rem; border-bottom:1px solid var(--line)">
  <input id="l-path" placeholder="pipeline name or .dot path" required
         style="width:22rem; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:.3rem .5rem; font:inherit">
  <input id="l-cwd" placeholder="working tree (--cwd)"
         style="width:18rem; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:.3rem .5rem; font:inherit">
  <input id="l-vars" placeholder='vars, k=v space-separated'
         style="width:22rem; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:.3rem .5rem; font:inherit">
  <button type="submit" class="pill" style="cursor:pointer; color:var(--accent)">launch</button>
  <span id="l-msg" class="dim"></span>
</form>
<table id="runs" style="display:none">
  <thead><tr>
    <th>run</th><th>pipeline</th><th>goal</th><th>status</th><th></th>
    <th>doing</th><th>dur</th><th>where</th><th>started</th><th></th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="empty" style="display:none">
  No runs yet. Start one with
  <code>attractor run --announce &lt;this hub&gt; …</code> or
  <code>POST /pipelines</code>.
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);

async function j(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + ": " + r.status);
  return r.json();
}

function fmtWhen(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleString();
}

// fmtDur renders an elapsed span compactly: 42s, 3m 20s, 1h 4m.
function fmtDur(ms) {
  if (!isFinite(ms) || ms < 0) return "";
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m " + (s % 60) + "s";
  const h = Math.floor(m / 60);
  return h + "h " + (m % 60) + "m";
}

// esc escapes a value for safe interpolation into an attribute or cell.
function esc(v) {
  return String(v || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
}

// pipelineBadge colours the pipeline name by a stable hash of its name,
// so each pipeline reads as its own colour at a glance (no fixed list —
// new pipelines get a consistent colour for free).
function pipelineBadge(name) {
  if (!name) return "";
  let hash = 0;
  for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) & 0xffff;
  const hue = hash % 360;
  return `<span class="pill pl" style="border-color:hsl(${hue} 45% 45%);` +
    `color:hsl(${hue} 70% 72%)">${esc(name)}</span>`;
}

async function refresh() {
  try {
    // /runs carries reachability; /pipelines carries the doc summaries
    // (goal, graph name, timestamps). Join on run_id.
    const [runs, docs] = await Promise.all([j("/runs"), j("/pipelines")]);
    const byID = {};
    for (const d of docs) byID[d.run_id] = d;
    // Defensive sort: the hub already orders /runs newest-first, but
    // sort here too so a stale field can never reshuffle the table.
    const startMs = r => Date.parse((byID[r.run_id] || {}).started_at || r.started_at || "") || 0;
    runs.sort((a, b) => startMs(b) - startMs(a) || (a.run_id < b.run_id ? -1 : 1));
    const rows = $("rows");
    rows.innerHTML = "";
    for (const r of runs) {
      const d = byID[r.run_id] || {};
      const status = r.status || d.status || "?";
      const tr = document.createElement("tr");
      tr.className = "run";
      const where = r.archived ? ["archived", "archived"]
                  : r.reachable ? ["live", "live"] : ["unreachable", "unreachable"];
      const gates = (d.pending_questions || []).length;
      // Elapsed: ended runs freeze; a running run ticks against now.
      const start = Date.parse(d.started_at || "");
      const end = d.ended_at ? Date.parse(d.ended_at) : Date.now();
      const dur = isNaN(start) ? "" : fmtDur(end - start);
      const doing = status === "running" ? (d.active_nodes || []).join(", ") : "";
      tr.innerHTML =
        `<td class="run"><a href="/ui/${encodeURIComponent(r.run_id)}">${esc(r.run_id)}</a></td>` +
        `<td>${pipelineBadge(d.graph_name)}</td>` +
        `<td class="goal" title="${esc(d.goal)}">${esc(d.goal)}</td>` +
        `<td><span class="pill ${status}">${status}</span></td>` +
        `<td>${gates ? `<span class="pill running" title="${gates} gate(s) waiting for a human">⏸ ${gates}</span>` : ""}</td>` +
        `<td class="active" title="${esc(doing)}">${esc(doing)}</td>` +
        `<td class="dur">${dur}</td>` +
        `<td><span class="pill ${where[0]}">${where[1]}</span></td>` +
        `<td>${fmtWhen(d.started_at)}</td>` +
        `<td>${!r.reachable ? `<button class="dismiss" title="remove this run from the hub">×</button>` : ""}</td>`;
      tr.onclick = ev => {
        if (ev.target.tagName === "A" || ev.target.tagName === "BUTTON") return;
        location.href = "/ui/" + encodeURIComponent(r.run_id);
      };
      const del = tr.querySelector(".dismiss");
      if (del) del.onclick = () => dismiss(r.run_id);
      rows.appendChild(tr);
    }
    $("runs").style.display = runs.length ? "table" : "none";
    $("empty").style.display = runs.length ? "none" : "block";
    const live = runs.filter(r => !r.archived && r.reachable).length;
    const arch = runs.filter(r => r.archived).length;
    $("counts").textContent = `${runs.length} runs — ${live} live, ${arch} archived`;
  } catch (e) { /* hub briefly unavailable; keep polling */ }
}

async function tick() {
  await refresh();
  setTimeout(tick, 2000);
}
async function dismiss(runID) {
  if (!confirm("Remove run " + runID + " from the hub? This deletes its record.")) return;
  try {
    const r = await fetch("/runs/" + encodeURIComponent(runID), { method: "DELETE" });
    if (!r.ok) alert("dismiss failed: " + r.status + " " + await r.text());
    else refresh();
  } catch (e) { alert("dismiss failed: " + e.message); }
}
$("launch-toggle").onclick = () => {
  const f = $("launch");
  f.style.display = f.style.display === "none" ? "block" : "none";
};
$("launch").onsubmit = async ev => {
  ev.preventDefault();
  const vars = {};
  for (const pair of $("l-vars").value.trim().split(/\s+/).filter(Boolean)) {
    const i = pair.indexOf("=");
    if (i > 0) vars[pair.slice(0, i)] = pair.slice(i + 1);
  }
  try {
    const r = await fetch("/pipelines", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path: $("l-path").value, cwd: $("l-cwd").value, vars }) });
    $("l-msg").textContent = r.ok ? "launched — it will appear once it announces"
                                  : "launch failed: " + r.status + " " + await r.text();
  } catch (e) { $("l-msg").textContent = "launch failed: " + e.message; }
};
tick();
</script>
</body>
</html>
